        document.getElementById('progress-staff-view').hidden = true;
      });

      // 進捗確認パネルのボタン委譲（status・linen・trash・check・reorder）
      document.getElementById('panel-progress').addEventListener('click', function(e) {
        // ステータスボタン
        var statusBtn = e.target.closest('[data-status]');
        if (statusBtn && statusBtn.dataset.progProp) {
          updateProgressField(statusBtn.dataset.progProp, { status: statusBtn.dataset.status });
          return;
        }
        // リネン（未 → 済）
        var linenBtn = e.target.closest('[data-linen-prop]');
        if (linenBtn) {
          updateProgressField(linenBtn.dataset.linenProp, { linen: 'DONE' });
          return;
        }
        // ゴミ（NEED → DONE）
        var trashBtn = e.target.closest('[data-trash-prop]');
        if (trashBtn) {
          updateProgressField(trashBtn.dataset.trashProp, { trash: 'DONE' });
          return;
        }
        // ゴミを NEED にする
        var trashOnBtn = e.target.closest('[data-trash-on-prop]');
        if (trashOnBtn) {
          updateProgressField(trashOnBtn.dataset.trashOnProp, { trash: 'NEED' });
          return;
        }
        // チェック（NEED → DONE）
        var checkBtn = e.target.closest('[data-check-prop]');
        if (checkBtn) {
          updateProgressField(checkBtn.dataset.checkProp, { check: 'DONE' });
          return;
        }
        // チェックを NEED にする
        var checkOnBtn = e.target.closest('[data-check-on-prop]');
        if (checkOnBtn) {
          updateProgressField(checkOnBtn.dataset.checkOnProp, { check: 'NEED' });
          return;
        }
        // 並べ替え（↑）
        var upBtn = e.target.closest('[data-reorder-up-prop]');
        if (upBtn) {
          reorderProgressCard(upBtn.dataset.reorderUpProp, 'up');
          return;
        }
        // 並べ替え（↓）
        var dnBtn = e.target.closest('[data-reorder-dn-prop]');
        if (dnBtn) {
          reorderProgressCard(dnBtn.dataset.reorderDnProp, 'down');
          return;

      });

          setBusy(false);

        if (toggle) {
          var k = toggle.dataset.schedToggle;
          if (S.scheduleExpandedKey === k) {
            S.scheduleExpandedKey = null;
            S.scheduleDetailKey   = null;
          } else {
            S.scheduleExpandedKey = k;
            S.scheduleDetailKey   = null;
          }
          renderScheduleList();
          return;
        }
        // 詳細設定ボタン
        var detailBtn = e.target.closest('[data-sched-detail-key]');
        if (detailBtn) {
          var dk = detailBtn.dataset.schedDetailKey;
          if (S.scheduleDetailKey === dk) {
            S.scheduleDetailKey = null;
            renderScheduleList();
          } else {
            S.scheduleDetailKey = dk;
            openScheduleDetail(dk.split('\t')[0]);
          }
          return;
        }
        // タスク完了・取消
        var taskBtn = e.target.closest('[data-sched-tid]');
        if (taskBtn) {
          var tid   = taskBtn.dataset.schedTid;
          var propN = taskBtn.dataset.schedProp;
          var st    = taskBtn.classList.contains('btn-task-done') ? 'DONE' : 'CANCELLED';
          taskBtn.disabled = true;
          callApi({ action: 'updateCleanTaskStatus', taskId: tid, status: st })
            .then(function(r) {
              if (r.ok) {
                toast(st === 'DONE' ? '完了にしました ✓' : '取り消しました');
                delete S.scheduleTasks[propN];
                S.taskCounts[propN] = Math.max(0, (S.taskCounts[propN] || 1) - 1);
                S.scheduleItems.forEach(function(i) {
                  if (i.propertyName === propN) i.taskCount = S.taskCounts[propN];
                });
                openScheduleDetail(propN);
              } else {
                taskBtn.disabled = false;
                toast('更新エラー: ' + (r.error || '不明'));
              }
            })
            .catch(function(e2) {
              taskBtn.disabled = false;
              if (e2.isUnauthorized) { handleUnauthorized(); return; }
              toast('更新エラー: ' + e2.message);
            });
          return;
        }
        // 対応追加
        var addBtn = e.target.closest('[data-sched-add-prop]');
        if (addBtn) { openTaskModal(addBtn.dataset.schedAddProp); return; }
        // 再送
        var resendBtn = e.target.closest('[data-sched-resend-prop]');
        if (resendBtn) { resendBlock(resendBtn.dataset.schedResendProp); return; }
      });

      // 今後の清掃予定タブ：担当変更セレクト（change 委譲）
      document.getElementById('panel-schedule').addEventListener('change', function(e) {
        var sel = e.target.closest('[data-sched-assign-key]');
        if (sel) { changeScheduleStaff(sel.dataset.schedAssignKey, sel.value); }
      });

      // 画面が隠れているあいだは自動更新を止める
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          stopBoardTimer();
          stopProgressTimer();
        } else {
          if (S.activeTab === 'schedule') {
            loadScheduleTab();
            startBoardTimer();
          }
          if (S.activeTab === 'progress') {
            loadProgress();
            startProgressTimer();
          }
        }
      });
    });

    // ── LIFF 初期化 ──────────────────────────────────────────────────
    liff.init({ liffId: CFG.LIFF_ID }).then(function() {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      S.idToken      = liff.getIDToken();
      S.currentDate  = tomorrow();
      S.boardDate    = today();
      S.progressDate = today();
      document.getElementById('date-sel').value          = S.currentDate;
      document.getElementById('board-date-sel').value    = S.boardDate;
      document.getElementById('progress-date-sel').value = S.progressDate;
      document.getElementById('loading').hidden = true;
      document.getElementById('app').hidden     = false;

      loadProgress();
      startProgressTimer();
    }).catch(function(e) {
      document.getElementById('loading').hidden = true;
      var el = document.getElementById('error');
      el.hidden = false;
      el.innerHTML =
        '<strong>LIFF の初期化に失敗しました</strong><br>' +
        esc(e.message || '不明なエラー');
    });
  </script>
</body>
</html>
