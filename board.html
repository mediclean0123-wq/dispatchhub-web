<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>管理ボード</title>
  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:  #00a84f;
      --bg:     #f4f4f4;
      --card:   #fff;
      --border: #e0e0e0;
      --muted:  #888;
    }
    body {
      font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg); color: #222; font-size: 15px; min-height: 100vh;
    }

    /* ── ローディング / エラー ── */
    .fill {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 2rem; text-align: center; gap: 1rem;
    }
    #error { color: #c00; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── アプリ ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── セッション期限切れバナー ── */
    .session-banner {
      background: #c00; color: #fff; text-align: center;
      padding: 0.65rem 1rem; font-size: 0.85rem; font-weight: bold;
    }

    /* ── タブ ── */
    .tabs {
      display: flex; background: var(--card);
      border-bottom: 2px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .tab-btn {
      flex: 1; padding: 0.8rem; border: none; background: transparent;
      font-size: 0.9rem; font-family: inherit; cursor: pointer; color: var(--muted);
    }
    .tab-btn.active {
      color: var(--green); border-bottom: 3px solid var(--green);
      margin-bottom: -2px; font-weight: bold;
    }

    /* ── パネル ── */
    .panel { padding: 0.75rem; }
    .panel[hidden] { display: none; }

    /* ── 日付行 ── */
    .date-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .date-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .date-row input[type="date"] {
      flex: 1; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.92rem; font-family: inherit; background: var(--card);
    }

    /* ── お知らせ / 警告 ── */
    .notice {
      background: #fffde7; border: 1px solid #f9c906; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #555;
      margin-bottom: 0.75rem;
    }
    .warn {
      background: #fff3e0; border: 1px solid #f57c00; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #444;
      margin-bottom: 0.75rem;
    }

    /* ── エリア見出し ── */
    .area-label {
      font-size: 0.78rem; font-weight: bold; color: var(--muted);
      padding: 0.35rem 0; margin-top: 0.6rem; border-bottom: 1px solid var(--border);
    }

    /* ── 物件カード（担当割り） ── */
    .prop-card {
      background: var(--card); border-radius: 8px;
      padding: 0.65rem 0.75rem; margin-top: 0.4rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.07);
    }
    .prop-name { font-weight: bold; font-size: 0.92rem; margin-bottom: 0.4rem; }
    .prop-ctrl { display: flex; align-items: center; gap: 0.4rem; }
    .staff-sel {
      flex: 1; padding: 0.38rem 0.5rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.88rem; font-family: inherit; background: var(--card);
    }
    .ord-btn {
      width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); cursor: pointer; font-size: 0.7rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ord-btn:active { background: var(--border); }
    .ord-badge {
      min-width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); font-size: 0.78rem; font-weight: bold; color: var(--muted);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* ── ボタン ── */
    .actions { display: flex; gap: 0.6rem; margin-top: 1rem; padding-bottom: 1rem; }
    .btn {
      flex: 1; padding: 0.7rem; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.92rem; font-weight: bold; font-family: inherit; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:active:not(:disabled) { opacity: 0.75; }
    .btn-save   { background: var(--green); color: #fff; }
    .btn-import { background: var(--card); color: var(--green); border: 1.5px solid var(--green); }

    /* ── ボード（今後の清掃予定タブ） ── */
    .board-stats {
      display: flex; gap: 0.5rem; background: var(--card); border-radius: 8px;
      padding: 0.7rem 0.5rem; margin-bottom: 0.75rem;
    }
    .bstat { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .bstat-n { font-size: 1.4rem; font-weight: bold; color: var(--green); }
    .bstat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .board-wrap { overflow-x: auto; padding-bottom: 0.75rem; }
    .board-cols { display: flex; gap: 0.55rem; min-width: min-content; }
    .bcol {
      min-width: 130px; max-width: 155px; background: var(--card); border-radius: 8px;
      padding: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.07); flex-shrink: 0;
    }
    .bcol-title {
      font-size: 0.82rem; font-weight: bold; text-align: center;
      background: var(--bg); border-radius: 4px; padding: 0.35rem; margin-bottom: 0.4rem;
    }
    .bprop {
      display: flex; flex-direction: column;
      padding: 0.38rem 0; border-bottom: 1px solid var(--bg); font-size: 0.8rem;
    }
    .bprop:last-child { border-bottom: none; }
    .bprop-top { display: flex; align-items: center; gap: 0.3rem; }
    .bprop-icon { flex-shrink: 0; font-size: 0.88rem; }
    .bprop-name { flex: 1; word-break: break-word; }
    .no-report { color: #aaa; font-size: 0.74rem; }
    .refresh-note { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 0.5rem; }

    /* ── 共通メッセージ ── */
    .msg { color: var(--muted); text-align: center; padding: 2rem 1rem; font-size: 0.88rem; }

    /* ── 確認モーダル ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-box {
      background: var(--card); border-radius: 12px; padding: 1.5rem 1.25rem;
      max-width: 300px; width: calc(100% - 2rem); text-align: center;
    }
    .modal-box p { margin-bottom: 0.5rem; font-size: 0.92rem; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }

    /* ── トースト ── */
    #toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); color: #fff; padding: 0.65rem 1.1rem;
      border-radius: 8px; font-size: 0.88rem; z-index: 100; white-space: nowrap;
      pointer-events: none; transition: opacity 0.25s;
    }
    #toast[hidden] { display: none; }

    /* ── 対応追加 ── */
    .bprop-bottom {
      display: flex; flex-wrap: wrap; align-items: center;
      margin-top: 0.3rem; gap: 0.35rem;
    }
    .task-badge {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: #fff3e0; color: #e65100; border: 1px solid #ffcc80;
      border-radius: 20px; padding: 0 0.55rem; font-size: 0.72rem;
      font-weight: bold; cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .task-badge:active { opacity: 0.7; }
    .btn-add-task {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--green); color: #fff; border: none; border-radius: 4px;
      padding: 0 0.6rem; font-size: 0.72rem; font-weight: bold;
      cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .btn-add-task:active { opacity: 0.75; }
    .btn-resend {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--green); border: 1px solid var(--green);
      border-radius: 4px; padding: 0 0.6rem; font-size: 0.72rem; font-weight: bold;
      cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .btn-resend:active { opacity: 0.75; }
    .board-add-row { margin-bottom: 0.6rem; }
    .btn-board-add {
      width: 100%; padding: 0.55rem; border-radius: 7px;
      border: 1.5px dashed var(--green); background: transparent;
      color: var(--green); font-size: 0.88rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-board-add:active { background: #f0faf5; }

    /* ── タスク登録モーダル ── */
    .task-modal-box {
      background: var(--card); border-radius: 14px;
      padding: 1.25rem; max-width: 340px; width: calc(100% - 2rem);
      max-height: 90vh; overflow-y: auto;
    }
    .task-modal-title {
      font-size: 1rem; font-weight: bold; margin-bottom: 0.9rem; text-align: center;
    }
    .task-modal-prop {
      font-size: 0.82rem; color: var(--muted); text-align: center;
      margin-top: -0.5rem; margin-bottom: 0.9rem;
    }
    .form-row { margin-bottom: 0.8rem; }
    .form-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; display: block; }
    .form-sel, .form-input, .form-textarea {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .form-textarea { height: 80px; resize: vertical; }
    .toggle-row { display: flex; gap: 0.5rem; }
    .toggle-btn {
      flex: 1; padding: 0.45rem; border: 1.5px solid var(--border); border-radius: 6px;
      background: var(--bg); font-size: 0.88rem; font-family: inherit; cursor: pointer;
    }
    .toggle-btn.selected {
      border-color: var(--green); background: #e8f5e9; color: var(--green); font-weight: bold;
    }
    .form-date-input {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .char-count { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 0.2rem; }
    .char-count.over { color: #c00; }

    /* ── タスクドロワー ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 40;
    }
    .drawer-overlay[hidden] { display: none; }
    .drawer-box {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-radius: 14px 14px 0 0;
      padding: 1rem; max-height: 75vh; overflow-y: auto; z-index: 45;
    }
    .drawer-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 0.75rem; }
    .task-item {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 0.75rem; margin-bottom: 0.55rem; background: var(--bg);
    }
    .task-item-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
    .task-type-badge {
      font-size: 0.7rem; font-weight: bold; padding: 0.15rem 0.45rem;
      border-radius: 10px; background: #e3f2fd; color: #1565c0;
    }
    .task-date-label { font-size: 0.75rem; color: var(--muted); }
    .task-expired-label {
      font-size: 0.7rem; color: #c00; font-weight: bold;
      background: #fce4ec; border-radius: 4px; padding: 0.1rem 0.35rem;
    }
    .task-content { font-size: 0.86rem; margin-bottom: 0.45rem; }
    .task-photo-tag {
      font-size: 0.72rem; color: #e65100; background: #fff3e0;
      border-radius: 4px; padding: 0.1rem 0.35rem; display: inline-block; margin-bottom: 0.45rem;
    }
    .task-actions { display: flex; gap: 0.5rem; }
    .btn-task-done {
      flex: 1; padding: 0.4rem; border: none; border-radius: 6px;
      background: var(--green); color: #fff; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-done:active { opacity: 0.75; }
    .btn-task-cancel {
      flex: 1; padding: 0.4rem; border: 1.5px solid #aaa; border-radius: 6px;
      background: transparent; color: #555; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-cancel:active { opacity: 0.75; }
    .drawer-empty { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 1rem 0; }
    .drawer-prop-sel {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.92rem; font-family: inherit;
      background: var(--card); margin-bottom: 0.9rem;
    }

    /* ── 進捗確認タブ ── */
    .progress-stats {
      display: flex; gap: 0.5rem; background: var(--card); border-radius: 8px;
      padding: 0.7rem 0.5rem; margin-bottom: 0.75rem;
    }
    .pstat { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .pstat-n { font-size: 1.05rem; font-weight: bold; color: var(--green); }
    .pstat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .view-btn {
      flex: 1; padding: 0.55rem; border-radius: 6px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.88rem; cursor: pointer; font-family: inherit;
    }
    .view-btn.active {
      border-color: var(--green); color: var(--green);
      background: #e8f5e9; font-weight: bold;
    }
    .prog-section { margin-bottom: 0.75rem; }
    .prog-section-title {
      font-size: 0.8rem; font-weight: bold; color: var(--muted);
      padding: 0.35rem 0; border-bottom: 1px solid var(--border); margin-bottom: 0.4rem;
    }

    /* 進捗カード */
    .prog-card {
      background: var(--card); border-radius: 8px;
      padding: 0.65rem 0.75rem; margin-bottom: 0.4rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.07); transition: background 0.2s;
    }
    .prog-card.doing { background: #e3f2fd; }
    .prog-card.done  { background: #f0f0f0; }
    .prog-card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 0.5rem; margin-bottom: 0.45rem;
    }
    .prog-card-name { font-weight: bold; font-size: 0.92rem; flex: 1; word-break: break-word; }
    .prog-card-staff { font-size: 0.72rem; color: var(--muted); }
    .prog-label-samedayin {
      font-size: 0.7rem; font-weight: bold; color: #1565c0;
      background: #e3f2fd; border-radius: 10px;
      padding: 0.15rem 0.5rem; white-space: nowrap; flex-shrink: 0;
    }
    .prog-label-notin {
      font-size: 0.7rem; font-weight: bold; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.15rem 0.5rem; white-space: nowrap; flex-shrink: 0;
    }
    .prog-card-bottom { display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.4rem; }
    .prog-task-count { font-size: 0.75rem; color: #e65100; font-weight: bold; }

    /* ステータスボタン */
    .status-row { display: flex; gap: 0.3rem; }
    .status-btn {
      flex: 1; padding: 0.38rem 0.2rem; border-radius: 5px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.78rem; font-family: inherit; cursor: pointer; text-align: center; color: #888;
    }
    .status-btn:active { opacity: 0.7; }
    .status-btn.active-todo  { border-color: #555; background: #fff; color: #333; font-weight: bold; }
    .status-btn.active-doing { border-color: #1976d2; background: #e3f2fd; color: #1565c0; font-weight: bold; }
    .status-btn.active-done  { border-color: #888; background: #e0e0e0; color: #555; font-weight: bold; }
    .prog-card.done .status-btn { color: #aaa; border-color: #ccc; }
    .prog-card.done .status-btn.active-done { color: #555; border-color: #888; }

    /* リネン・ゴミ・チェック インジケーター */
    .prog-indicators { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.45rem; }
    .prog-ind-btn {
      font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 10px;
      border: 1px solid var(--border); cursor: pointer;
      font-family: inherit; white-space: nowrap;
    }
    .prog-ind-btn:active { opacity: 0.7; }
    .linen-todo { background: var(--bg); color: var(--muted); border-color: var(--border); }
    .linen-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .trash-need { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
    .trash-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; cursor: default; }
    .check-need { background: #fffde7; color: #f57f17; border-color: #fff176; }
    .check-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; cursor: default; }
    .prog-ind-on {
      font-size: 0.68rem; padding: 0.15rem 0.4rem; border-radius: 8px;
      border: 1px dashed var(--muted); background: transparent; cursor: pointer;
      font-family: inherit; color: var(--muted); white-space: nowrap;
    }
    .prog-ind-on:active { background: var(--bg); }

    /* スタッフ別ビュー：並べ替えボタン */
    .prog-reorder-row { display: flex; justify-content: flex-end; gap: 0.3rem; margin-top: 0.35rem; }
    .prog-reorder-btn {
      width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); cursor: pointer; font-size: 0.75rem;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .prog-reorder-btn:active { background: var(--border); }
    .prog-reorder-btn[disabled] { opacity: 0.3; cursor: default; pointer-events: none; }

    /* 進捗カードの担当変更セレクト */
    .prog-staff-row { display: flex; align-items: center; margin-top: 0.45rem; }
    .prog-staff-sel {
      flex: 1; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 5px;
      font-size: 0.8rem; font-family: inherit; background: var(--card); color: #333;
    }
    .prog-card.done .prog-staff-sel { display: none; }

    /* 担当割りを開くボタン / 戻るボタン */
    .assign-open-row { margin-bottom: 0.6rem; }
    .btn-assign-open {
      width: 100%; padding: 0.55rem; border-radius: 7px;
      border: 1.5px solid var(--muted); background: transparent;
      color: var(--muted); font-size: 0.85rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-assign-open:active { background: #f0f0f0; }
    .assign-back-row { margin-bottom: 0.75rem; }
    .btn-assign-back {
      padding: 0.45rem 0.9rem; border-radius: 7px;
      border: 1.5px solid var(--border); background: var(--card);
      color: #555; font-size: 0.85rem; font-family: inherit; cursor: pointer;
    }
    .btn-assign-back:active { background: var(--bg); }

    /* ── 今後の清掃予定タブ：検索 ── */
    .sched-search {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.92rem; font-family: inherit; background: var(--card);
      margin-bottom: 0.65rem; display: block;
    }

    /* ── 今後の清掃予定タブ：行リスト ── */
    .sched-list { background: var(--card); border-radius: 8px; overflow: hidden; margin-bottom: 0.75rem; }
    .sched-row { border-bottom: 1px solid var(--border); }
    .sched-row:last-child { border-bottom: none; }
    .sched-row-main {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 0.65rem; min-height: 44px; cursor: pointer;
    }
    .sched-row-main:active { background: var(--bg); }
    .sched-prop-name { flex: 1; font-size: 0.88rem; font-weight: 600; word-break: break-word; }
    .sched-type-badge-in {
      font-size: 0.68rem; font-weight: bold; color: #1565c0; background: #e3f2fd;
      border-radius: 8px; padding: 0.12rem 0.4rem; white-space: nowrap; flex-shrink: 0;
    }
    .sched-type-badge-out {
      font-size: 0.68rem; font-weight: bold; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 0.12rem 0.4rem;
      white-space: nowrap; flex-shrink: 0;
    }
    .sched-staff {
      font-size: 0.75rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; max-width: 80px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .sched-staff.unassigned { color: #c62828; font-weight: bold; }
    .sched-task-cnt {
      font-size: 0.68rem; font-weight: bold; color: #e65100; background: #fff3e0;
      border: 1px solid #ffcc80; border-radius: 10px; padding: 0.1rem 0.4rem;
      white-space: nowrap; flex-shrink: 0;
    }
    .sched-chevron { font-size: 0.65rem; color: var(--muted); flex-shrink: 0; transition: transform 0.15s; }
    .sched-row.expanded .sched-chevron { transform: rotate(180deg); }

    /* 展開エリア */
    .sched-expand {
      padding: 0.6rem 0.65rem 0.65rem; border-top: 1px solid var(--border); background: #fafafa;
    }
    .sched-assign-section {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .sched-assign-label { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    .sched-staff-sel {
      flex: 1; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 5px;
      font-size: 0.82rem; font-family: inherit; background: var(--card); color: #333;
    }
    .sched-staff-sel:disabled { background: var(--bg); color: var(--muted); }
    .sched-detail-btn {
      background: transparent; border: none; color: var(--green); font-size: 0.82rem;
      font-family: inherit; cursor: pointer; padding: 0.3rem 0; font-weight: bold;
      display: block; width: 100%; text-align: left;
    }
    .sched-detail-btn:active { opacity: 0.7; }

    /* 詳細設定エリア（タスク） */
    .sched-tasks-section { padding-top: 0.55rem; border-top: 1px solid var(--border); margin-top: 0.4rem; }
    .sched-task-item {
      border: 1px solid var(--border); border-radius: 7px;
      padding: 0.55rem 0.65rem; margin-bottom: 0.45rem; background: var(--card);
    }
    .sched-tasks-empty { font-size: 0.82rem; color: var(--muted); padding: 0.4rem 0; }
    .btn-sched-add-task {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--green); color: #fff; border: none; border-radius: 5px;
      padding: 0.4rem 0.7rem; font-size: 0.8rem; font-weight: bold;
      font-family: inherit; cursor: pointer; margin-top: 0.4rem;
    }
    .btn-sched-add-task:active { opacity: 0.75; }
    .btn-sched-resend {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--green); border: 1px solid var(--green);
      border-radius: 5px; padding: 0.4rem 0.7rem; font-size: 0.8rem; font-weight: bold;
      font-family: inherit; cursor: pointer; margin-top: 0.4rem; margin-left: 0.4rem;
    }
    .btn-sched-resend:active { opacity: 0.75; }
  </style>
</head>

<body>
  <div id="loading" class="fill">
    <span class="spin" style="font-size:2rem">↻</span>
    <span>読み込み中…</span>
  </div>
  <div id="error" class="fill" hidden></div>

  <div id="app" hidden>
    <div id="session-banner" class="session-banner" hidden>
      ログインの有効期限が切れました。画面を開き直してください
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="progress">進捗確認</button>
      <button class="tab-btn"        data-tab="schedule">今後の清掃予定</button>
    </nav>

    <!-- 担当割りパネル（タブバー非表示・今後の清掃予定タブから開く）-->
    <div id="panel-assign" class="panel" hidden>
      <div class="assign-back-row">
        <button id="btn-assign-back" class="btn-assign-back">← 今後の清掃予定に戻る</button>
      </div>
      <div class="date-row">
        <label for="date-sel">日付</label>
        <input type="date" id="date-sel">
      </div>
      <div id="updating-warn" class="warn" hidden>
        清掃データ更新中のため保存できません。少し待って再読込してください
      </div>
      <div id="assign-notice" class="notice" hidden>
        この日は画面の担当割りが優先されます（最終保存：<span id="notice-time"></span>）
      </div>
      <div id="prop-list"></div>
      <div class="actions">
        <button class="btn btn-import" id="btn-import" disabled>スプシを取り込む</button>
        <button class="btn btn-save"   id="btn-save"   disabled>保存</button>
      </div>
    </div>

    <!-- 進捗確認タブ -->
    <div id="panel-progress" class="panel">
      <div class="date-row">
        <label for="progress-date-sel">日付</label>
        <input type="date" id="progress-date-sel">
      </div>
      <div class="progress-stats" id="progress-stats">
        <div class="pstat">
          <span class="pstat-n" id="ps-done">─/─</span>
          <span class="pstat-l">完了</span>
        </div>
        <div class="pstat">
          <span class="pstat-n" id="ps-samedayin">─/─</span>
          <span class="pstat-l">同日イン</span>
        </div>
        <div class="pstat">
          <span class="pstat-n" id="ps-notin">─/─</span>
          <span class="pstat-l">インなし</span>
        </div>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="vbtn-staff" data-view="staff">スタッフ別</button>
        <button class="view-btn"        id="vbtn-board" data-view="board">進捗ボード</button>
      </div>
      <div id="progress-staff-view"></div>
      <div id="progress-board-view" hidden></div>
      <div class="refresh-note" id="progress-refresh-note">30秒ごとに自動更新</div>
    </div>

    <!-- 今後の清掃予定タブ -->
    <div id="panel-schedule" class="panel" hidden>
      <div class="assign-open-row">
        <button class="btn-assign-open" id="btn-open-assign">担当割りを開く</button>
      </div>
      <div class="date-row">
        <label for="board-date-sel">日付</label>
        <input type="date" id="board-date-sel">
      </div>
      <input type="search" id="sched-search" class="sched-search" placeholder="物件名で絞り込み">
      <div class="board-stats">
        <div class="bstat"><span class="bstat-n" id="s-total">-</span><span class="bstat-l">清掃</span></div>
        <div class="bstat"><span class="bstat-n" id="s-samedayin">-</span><span class="bstat-l">同日イン</span></div>
        <div class="bstat"><span class="bstat-n" id="s-notin">-</span><span class="bstat-l">インなし</span></div>
        <div class="bstat"><span class="bstat-n" id="s-tasks">-</span><span class="bstat-l">対応予定</span></div>
      </div>
      <div id="sched-list" class="sched-list"></div>
      <div class="refresh-note" id="refresh-note">30秒ごとに自動更新</div>
    </div>
  </div>

  <!-- タスク登録モーダル -->
  <div id="task-modal" class="modal-overlay" hidden>
    <div class="task-modal-box">
      <div class="task-modal-title">対応追加</div>
      <div class="task-modal-prop" id="task-modal-prop"></div>
      <div class="form-row">
        <label class="form-label">種類</label>
        <select id="task-type" class="form-sel">
          <option value="WORK">作業追加（WORK）</option>
          <option value="TIME">時間変更（TIME）</option>
          <option value="CARRY">持ち込み（CARRY）</option>
          <option value="OTHER">その他（OTHER）</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">内容 <span id="task-char-count" class="char-count">0 / 200</span></label>
        <textarea id="task-content" class="form-textarea" placeholder="内容を入力（必須・200文字以内）" maxlength="200"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">写真</label>
        <div class="toggle-row">
          <button class="toggle-btn" data-val="false" id="photo-no">不要</button>
          <button class="toggle-btn" data-val="true"  id="photo-yes">必要</button>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">日付</label>
        <div class="toggle-row" id="date-mode-row">
          <button class="toggle-btn" data-mode="NEXT"      id="mode-next">次回清掃</button>
          <button class="toggle-btn" data-mode="DATE"      id="mode-tomorrow">明日</button>
          <button class="toggle-btn" data-mode="DATE_PICK" id="mode-pick">日付指定</button>
        </div>
        <input type="date" id="task-date-pick" class="form-date-input" style="margin-top:0.4rem" hidden>
      </div>
      <div class="modal-actions">
        <button class="btn btn-import" id="task-modal-cancel">キャンセル</button>
        <button class="btn btn-save"   id="task-modal-submit">登録</button>
      </div>
    </div>
  </div>

  <!-- タスク一覧ドロワー -->
  <div id="task-drawer" class="drawer-overlay" hidden>
    <div class="drawer-box">
      <div class="drawer-title" id="drawer-title">対応一覧</div>
      <div id="drawer-body"></div>
    </div>
  </div>

  <!-- 競合確認モーダル -->
  <div id="conflict-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <p>他の人が先に保存しました。</p>
      <p>再読込すると、入力中の内容は消えます。</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-import">キャンセル</button>
        <button id="modal-reload" class="btn btn-save">再読込</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script>
    'use strict';

    var CFG = window.DISPATCH_CONFIG || {};

    // ── 楽観的更新の二重送信防止フラグ ────────────────────────────────
    var _progressPending      = {};   // { [propName]: true } — updateProgressField 中
    var _reorderPending       = false;  // reorderProgressCard 中
    var _staffPendingProgress = false;  // changeProgressStaff 中
    var _staffPendingSchedule = false;  // changeScheduleStaff 中

    // ── 状態 ──────────────────────────────────────────────────────────
    var S = {
      idToken:            null,
      currentDate:        null,
      boardDate:          null,
      progressDate:       null,
      items:              [],
      cleaners:           [],
      latestUpdatedAt:    null,
      busy:               false,
      updating:           false,
      taskCounts:         {},
      activeProps:        [],
      sessionExpired:     false,
      activeTab:          'progress',
      boardTimer:         null,
      progressTimer:      null,
      activeProgressView: 'staff',
      progressItems:          [],   // スケジュール行（isSameDayIn / staff / uid / order）
      progressData:           {},   // { propertyName: { status, linen, trash, check, orderIndex, updatedAt } }
      progressDefaults:       {},   // { propertyName: { checkDefault, trashDefault } }
      progressAssignUpdatedAt: null, // 進捗確認タブで担当変更するときの衝突検知用
      // 今後の清掃予定タブ
      scheduleItems:           [],   // {propertyName, uid, date, staff, order, isSameDayIn, taskCount}
      scheduleAssignUpdatedAt: null, // saveAssignments の衝突検知
      scheduleProgressData:    {},   // boardDate===today のときの progressData（DONE チェック用）
      scheduleExpandedKey:     null, // 展開中の行キー（"propName\tdate"）
      scheduleDetailKey:       null, // 詳細設定が開いている行キー
      scheduleTasks:           {},   // {[propName]: tasks[]} lazy キャッシュ
      scheduleSearchText:      ''    // 検索テキスト
    };

    // ── ユーティリティ ─────────────────────────────────────────────────
    function today() {
      var d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function tomorrow() {
      var d = new Date();
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function fmtTime(iso) {
      if (!iso) return '';
      try {
        var d = new Date(iso);
        return d.getHours() + '時' + String(d.getMinutes()).padStart(2, '0') + '分';
      } catch (e) { return ''; }
    }

    var AREA_RANK = { '①': 1, '②': 2, '③': 3, '④': 4, '⑤': 5 };
    function areaRank(a) { return AREA_RANK[String(a || '').trim()] || 99; }

    var STATUS_RANK = { 'DONE': 0, 'DOING': 1, 'TODO': 2 };
    function statusRank(s) { return STATUS_RANK[s] !== undefined ? STATUS_RANK[s] : 2; }

    var toastTimer;
    function toast(msg, ms) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.hidden = true; }, ms || 2500);
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function setBusy(v) {
      S.busy = v;
      document.getElementById('btn-save').disabled   = v || S.updating || S.sessionExpired;
      document.getElementById('btn-import').disabled = v || S.sessionExpired;
    }

    function stopBoardTimer() {
      clearInterval(S.boardTimer);
      S.boardTimer = null;
    }

    function startBoardTimer() {
      stopBoardTimer();
      if (!document.hidden && !S.sessionExpired) {
        S.boardTimer = setInterval(loadScheduleTab, 30000);
      }
    }

    function stopProgressTimer() {
      clearInterval(S.progressTimer);
      S.progressTimer = null;
    }

    function startProgressTimer() {
      stopProgressTimer();
      if (!document.hidden && !S.sessionExpired) {
        S.progressTimer = setInterval(loadProgress, 30000);
      }
    }

    function handleUnauthorized() {
      stopBoardTimer();
      stopProgressTimer();
      S.sessionExpired = true;
      document.getElementById('session-banner').hidden = false;
      document.getElementById('btn-save').disabled   = true;
      document.getElementById('btn-import').disabled = true;
      var msg = '<div class="msg">ログインの有効期限が切れました。画面を開き直してください</div>';
      document.getElementById('prop-list').innerHTML           = msg;
      document.getElementById('sched-list').innerHTML          = msg;
      document.getElementById('progress-staff-view').innerHTML = msg;
      document.getElementById('progress-board-view').innerHTML = '';
    }

    // ── 競合確認モーダル ──────────────────────────────────────────────
    function showConflictModal(onReload) {
      var modal = document.getElementById('conflict-modal');
      modal.hidden = false;
      document.getElementById('modal-cancel').onclick = function() {
        modal.hidden = true;
        setBusy(false);
      };
      document.getElementById('modal-reload').onclick = function() {
        modal.hidden = true;
        onReload();
      };
    }

    // ── API ──────────────────────────────────────────────────────────
    function callApi(body) {
      body.idToken = S.idToken;
      return fetch(CFG.GAS_API_URL + '?api=1', {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify(body)
      }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(data) {
        if (data && data.error === 'unauthorized') {
          var err = new Error('unauthorized');
          err.isUnauthorized = true;
          throw err;
        }
        return data;
      });
    }

    // ── 担当割り：スケジュール読み込み ──────────────────────────────
    function loadSchedule(date) {
      setBusy(true);
      document.getElementById('prop-list').innerHTML =
        '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      return Promise.all([
        callApi({ action: 'getSchedule', date: date }),
        cleanerProm
      ]).then(function(res) {
        var sr = res[0], cr = res[1];
        if (!sr.ok) throw new Error('getSchedule: ' + (sr.error || '不明'));
        if (cr) {
          if (!cr.ok) throw new Error('getCleanerList: ' + (cr.error || '不明'));
          S.cleaners = cr.cleaners;
        }

        S.updating = !!sr.updating;
        document.getElementById('updating-warn').hidden = !S.updating;

        var hdr = sr.schedule.header;
        var H = {
          pn:   hdr.indexOf('PropertyName'),
          fd:   hdr.indexOf('Final_CheckoutDate'),
          fs:   hdr.indexOf('Final_AssignedStaff'),
          ord:  hdr.indexOf('Order'),
          area: hdr.indexOf('Area'),
          uid:  hdr.indexOf('UID')
        };

        var seen = {}, unique = [];
        sr.schedule.rows.forEach(function(row) {
          var k = String(row[H.pn] || '').trim() + '\t' + String(row[H.fd] || '').trim();
          if (!seen[k]) { seen[k] = true; unique.push(row); }
        });

        var am = {};
        (sr.assignments || []).forEach(function(a) {
          var pn = String(a.propertyName || '').trim();
          am[pn + '\t' + (a.uid || '')] = a;
          am['pn\t' + pn]               = a;
        });

        S.items = unique.map(function(row) {
          var pn  = String(row[H.pn]  || '').trim();
          var uid = String(row[H.uid] || '').trim();
          var cs  = String(row[H.fs]  || '').trim();
          var co  = Number(row[H.ord]) || 0;
          var ar  = H.area >= 0 ? String(row[H.area] || '').trim() : '';
          var a   = am[pn + '\t' + uid] || am['pn\t' + pn];
          return {
            propertyName: pn, uid: uid, date: date, area: ar,
            staff:   a ? String(a.staff  || '')  : cs,
            order:   a ? (Number(a.order) || 0)  : co,
            csStaff: cs, csOrder: co
          };
        });

        S.latestUpdatedAt = sr.latestUpdatedAt || null;

        var hasAsgn = (sr.assignments || []).length > 0;
        document.getElementById('assign-notice').hidden = !hasAsgn;
        if (hasAsgn && sr.latestUpdatedAt) {
          document.getElementById('notice-time').textContent = fmtTime(sr.latestUpdatedAt);
        }

        renderAssign();
        setBusy(false);
      });
    }

    // ── 担当割り：描画 ──────────────────────────────────────────────
    function renderAssign() {
      var list = document.getElementById('prop-list');
      if (!S.items.length) {
        list.innerHTML = '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var sorted = S.items.slice().sort(function(a, b) {
        var d = areaRank(a.area) - areaRank(b.area);
        if (d !== 0) return d;
        return (a.order || 999) - (b.order || 999);
      });

      var groups = [], curArea = null;
      sorted.forEach(function(item) {
        var a = item.area || '';
        if (a !== curArea) { groups.push({ area: a, items: [] }); curArea = a; }
        groups[groups.length - 1].items.push(item);
      });

      var html = '';
      groups.forEach(function(g) {
        html += '<div class="area-label">' +
          esc(g.area ? 'エリア ' + g.area : 'エリア未設定') + '</div>';
        g.items.forEach(function(item) {
          var idx  = S.items.indexOf(item);
          var opts = '<option value=""' + (!item.staff ? ' selected' : '') + '>（未割り当て）</option>';
          if (item.staff && !S.cleaners.some(function(c) { return c.name === item.staff; })) {
            opts += '<option value="' + esc(item.staff) + '" selected>' + esc(item.staff) + '</option>';
          }
          S.cleaners.forEach(function(c) {
            opts += '<option value="' + esc(c.name) + '"' +
              (c.name === item.staff ? ' selected' : '') + '>' + esc(c.name) + '</option>';
          });
          html +=
            '<div class="prop-card">' +
              '<div class="prop-name">' + esc(item.propertyName) + '</div>' +
              '<div class="prop-ctrl">' +
                '<select class="staff-sel" data-idx="' + idx + '">' + opts + '</select>' +
                '<button class="ord-btn" data-action="up"   data-idx="' + idx + '">↑</button>' +
                '<span  class="ord-badge">' + (item.order || '–') + '</span>' +
                '<button class="ord-btn" data-action="down" data-idx="' + idx + '">↓</button>' +
              '</div>' +
            '</div>';
        });
      });

      list.innerHTML = html;

      list.querySelectorAll('.ord-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          syncStaff();
          reorder(parseInt(btn.dataset.idx, 10), btn.dataset.action === 'up' ? -1 : 1);
        });
      });
    }

    function syncStaff() {
      document.querySelectorAll('.staff-sel').forEach(function(sel) {
        var i = parseInt(sel.dataset.idx, 10);
        if (!isNaN(i)) S.items[i].staff = sel.value;
      });
    }

    function reorder(idx, delta) {
      var item = S.items[idx];
      var peers = S.items.filter(function(it) { return it.staff === item.staff; })
        .sort(function(a, b) { return (a.order || 999) - (b.order || 999); });
      if (peers.length < 2) return;
      peers.forEach(function(it, i) { it.order = i + 1; });
      var pos = peers.indexOf(item);
      var np  = pos + delta;
      if (np < 0 || np >= peers.length) return;
      var other = peers[np];
      var tmp = item.order; item.order = other.order; other.order = tmp;
      renderAssign();
    }

    // ── 今後の清掃予定タブ ────────────────────────────────────────────
    function loadScheduleTab() {
      if (S.sessionExpired) return;
      document.getElementById('sched-list').innerHTML =
        '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      var progressProm = (S.boardDate === today())
        ? callApi({ action: 'getProgress', date: S.boardDate })
        : Promise.resolve(null);

      return Promise.all([
        callApi({ action: 'getSchedule', date: S.boardDate }),
        cleanerProm,
        progressProm
      ]).then(function(res) {
        var sr = res[0], cr = res[1], pr = res[2];
        if (cr && cr.ok) S.cleaners = cr.cleaners;
        if (!sr.ok) { toast('スケジュールの読み込みに失敗しました'); return; }

        S.taskCounts = sr.taskCounts || {};

        // 今日の場合は progressData で DONE チェック
        S.scheduleProgressData = {};
        if (pr && pr.ok) {
          (pr.progress || []).forEach(function(p) {
            S.scheduleProgressData[String(p.property || '').trim()] = p;
          });
        }

        var hdr = sr.schedule.header;
        var H = {
          pn:  hdr.indexOf('PropertyName'),
          fd:  hdr.indexOf('Final_CheckoutDate'),
          sdc: hdr.indexOf('Auto_SameDayCheckout'),
          ord: hdr.indexOf('Order'),
          uid: hdr.indexOf('UID')
        };

        var seen = {}, unique = [];
        sr.schedule.rows.forEach(function(row) {
          var k = String(row[H.pn] || '').trim() + '\t' + String(row[H.fd] || '').trim();
          if (!seen[k]) { seen[k] = true; unique.push(row); }
        });

        var am = {};
        (sr.assignments || []).forEach(function(a) {
          var pn = String(a.propertyName || '').trim();
          am[pn + '\t' + (a.uid || '')] = a;
          am['pn\t' + pn]               = a;
        });
        S.scheduleAssignUpdatedAt = sr.latestUpdatedAt || null;

        S.scheduleItems = unique.map(function(row) {
          var pn  = String(row[H.pn]  || '').trim();
          var uid = String(row[H.uid] || '').trim();
          var sdc = H.sdc >= 0 ? String(row[H.sdc] || '').trim() : '';
          var a   = am[pn + '\t' + uid] || am['pn\t' + pn];
          return {
            propertyName: pn,
            uid:          uid,
            date:         String(row[H.fd] || '').trim(),
            staff:        a ? String(a.staff || '') : '',
            order:        a ? (Number(a.order) || 0) : (Number(row[H.ord]) || 0),
            isSameDayIn:  sdc === 'Yes',
            taskCount:    S.taskCounts[pn] || 0
          };
        });

        // タスクキャッシュをリセット（再読込のたびに）
        S.scheduleTasks = {};

        // ソート：未担当先頭 → cleaners 順 → order 昇順
        var cmap = {};
        S.cleaners.forEach(function(c, i) { cmap[c.name] = i; });
        S.scheduleItems.sort(function(a, b) {
          var emptyA = !a.staff, emptyB = !b.staff;
          if (emptyA !== emptyB) return emptyA ? -1 : 1;
          var ia = cmap[a.staff] !== undefined ? cmap[a.staff] : 9999;
          var ib = cmap[b.staff] !== undefined ? cmap[b.staff] : 9999;
          if (ia !== ib) return ia - ib;
          return (a.order || 999) - (b.order || 999);
        });

        var sameDayN  = S.scheduleItems.filter(function(i) { return i.isSameDayIn; }).length;
        var notInN    = S.scheduleItems.filter(function(i) { return !i.isSameDayIn; }).length;
        var totalTasks = S.scheduleItems.reduce(function(acc, i) { return acc + i.taskCount; }, 0);
        document.getElementById('s-total').textContent     = S.scheduleItems.length;
        document.getElementById('s-samedayin').textContent = sameDayN;
        document.getElementById('s-notin').textContent     = notInN;
        document.getElementById('s-tasks').textContent     = totalTasks;

        var now = new Date();
        document.getElementById('refresh-note').textContent =
          '最終更新: ' + now.getHours() + ':' +
          String(now.getMinutes()).padStart(2, '0') + '  ／  30秒ごとに自動更新';

        renderScheduleList();
      }).catch(function(e) {
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('スケジュール読み込みエラー: ' + e.message);
      });
    }

    function renderScheduleList() {
      var search = S.scheduleSearchText.trim().toLowerCase();
      var items  = search
        ? S.scheduleItems.filter(function(i) {
            return i.propertyName.toLowerCase().indexOf(search) >= 0;
          })
        : S.scheduleItems;

      if (!items.length) {
        document.getElementById('sched-list').innerHTML =
          '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var showResend = (S.boardDate === today() || S.boardDate === tomorrow());

      var html = '';
      items.forEach(function(item) {
        var pn     = item.propertyName;
        var key    = pn + '\t' + item.date;
        var keyEsc = esc(key);
        var pnEsc  = esc(pn);
        var isExpanded = (S.scheduleExpandedKey === key);
        var isDetail   = (S.scheduleDetailKey   === key);

        var typeBadge = item.isSameDayIn
          ? '<span class="sched-type-badge-in">同日イン</span>'
          : '<span class="sched-type-badge-out">インなし</span>';

        var staffLabel = item.staff || '';
        var staffCls   = staffLabel ? 'sched-staff' : 'sched-staff unassigned';
        var staffText  = staffLabel || '未担当';

        var taskBadge = item.taskCount > 0
          ? '<span class="sched-task-cnt">対応' + item.taskCount + '件</span>'
          : '';

        html += '<div class="sched-row' + (isExpanded ? ' expanded' : '') + '" data-sched-key="' + keyEsc + '">';
        html += '<div class="sched-row-main" data-sched-toggle="' + keyEsc + '">' +
          '<span class="sched-prop-name">' + pnEsc + '</span>' +
          typeBadge +
          '<span class="' + staffCls + '">' + esc(staffText) + '</span>' +
          taskBadge +
          '<span class="sched-chevron">▼</span>' +
        '</div>';

        if (isExpanded) {
          // 担当変更セレクト
          var isDone = S.scheduleProgressData[pn] && S.scheduleProgressData[pn].status === 'DONE';
          var selOpts = '<option value=""' + (!item.staff ? ' selected' : '') + '>未担当</option>';
          S.cleaners.forEach(function(c) {
            selOpts += '<option value="' + esc(c.name) + '"' +
              (item.staff === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>';
          });

          html += '<div class="sched-expand">';
          html += '<div class="sched-assign-section">' +
            '<span class="sched-assign-label">担当：</span>' +
            '<select class="sched-staff-sel" data-sched-assign-key="' + keyEsc + '"' +
              (isDone ? ' disabled' : '') + '>' + selOpts + '</select>' +
          '</div>';
          html += '<button class="sched-detail-btn" data-sched-detail-key="' + keyEsc + '">' +
            (isDetail ? '▲ 詳細設定を閉じる' : '▼ 詳細設定') +
          '</button>';

          if (isDetail) {
            html += '<div class="sched-tasks-section">';
            var tasks = S.scheduleTasks[pn];
            if (!tasks) {
              html += '<div class="sched-tasks-empty">読み込み中…</div>';
            } else if (!tasks.length) {
              html += '<div class="sched-tasks-empty">OPEN の対応はありません</div>';
            } else {
              var todayYmd = today();
              tasks.forEach(function(t) {
                var dateLabel = t.targetMode === 'NEXT'
                  ? '次回清掃' + (t.boundDate ? '（' + t.boundDate + '）' : '')
                  : (t.targetDate || '');
                var expired = t.targetMode === 'DATE' && t.targetDate && t.targetDate < todayYmd;
                html += '<div class="sched-task-item">' +
                  '<div class="task-item-header">' +
                    '<span class="task-type-badge">' + esc(t.type) + '</span>' +
                    '<span class="task-date-label">' + esc(dateLabel) + '</span>' +
                    (expired ? '<span class="task-expired-label">期限切れ</span>' : '') +
                  '</div>' +
                  '<div class="task-content">' + esc(t.content) + '</div>' +
                  (t.photoRequired ? '<div class="task-photo-tag">📷 写真必要</div>' : '') +
                  '<div class="task-actions">' +
                    '<button class="btn-task-done" data-sched-tid="' + esc(t.taskId) + '" data-sched-prop="' + pnEsc + '">完了</button>' +
                    '<button class="btn-task-cancel" data-sched-tid="' + esc(t.taskId) + '" data-sched-prop="' + pnEsc + '">取消</button>' +
                  '</div>' +
                '</div>';
              });
            }
            html += '<button class="btn-sched-add-task" data-sched-add-prop="' + pnEsc + '">＋ 対応追加</button>';
            if (showResend) {
              html += '<button class="btn-sched-resend" data-sched-resend-prop="' + pnEsc + '">再送</button>';
            }
            html += '</div>';
          }
          html += '</div>';
        }
        html += '</div>';
      });

      document.getElementById('sched-list').innerHTML = html;
    }

    function changeScheduleStaff(key, newStaff) {
      if (_staffPendingSchedule) return;
      _staffPendingSchedule = true;

      var propName = key.split('\t')[0];

      // 楽観的更新：先に scheduleItems の staff を更新して再描画
      var oldStaff = '';
      S.scheduleItems.forEach(function(i) {
        if (i.propertyName === propName) { oldStaff = i.staff || ''; i.staff = newStaff; }
      });
      var oldUpdatedAt = S.scheduleAssignUpdatedAt;
      renderScheduleList();

      var rows = S.scheduleItems.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });
      callApi({
        action:         'saveAssignments',
        date:           S.boardDate,
        rows:           rows,
        knownUpdatedAt: oldUpdatedAt || ''
      }).then(function(r) {
        _staffPendingSchedule = false;
        if (r.ok) {
          if (r.latestUpdatedAt) S.scheduleAssignUpdatedAt = r.latestUpdatedAt;
          toast('担当を変更しました。反映まで最大5分かかります');
          return;
        }
        // ロールバック
        S.scheduleItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        S.scheduleAssignUpdatedAt = oldUpdatedAt;
        renderScheduleList();
        if (r.error === 'conflict') {
          toast('他の人が先に保存しました。再読込します');
          loadScheduleTab();
        } else {
          toast('担当変更エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _staffPendingSchedule = false;
        S.scheduleItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        S.scheduleAssignUpdatedAt = oldUpdatedAt;
        renderScheduleList();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('担当変更エラー: ' + e.message);
      });
    }

    function openScheduleDetail(propName) {
      if (S.scheduleTasks[propName]) { renderScheduleList(); return; }
      callApi({ action: 'getCleanTasksForProperty', propertyName: propName })
        .then(function(r) {
          S.scheduleTasks[propName] = r.ok ? (r.tasks || []) : [];
          renderScheduleList();
        })
        .catch(function(e) {
          S.scheduleTasks[propName] = [];
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          renderScheduleList();
        });
    }

    // ── 進捗確認タブ ────────────────────────────────────────────────
    function loadProgress() {
      if (S.sessionExpired) return;
      document.getElementById('progress-staff-view').innerHTML =
        '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';
      document.getElementById('progress-board-view').innerHTML = '';

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      Promise.all([
        callApi({ action: 'getSchedule', date: S.progressDate }),
        callApi({ action: 'getProgress',  date: S.progressDate }),
        cleanerProm
      ]).then(function(res) {
        var sr = res[0], pr = res[1], cr = res[2];
        if (cr && cr.ok) S.cleaners = cr.cleaners;
        if (!sr.ok) { toast('進捗確認の読み込みに失敗しました'); return; }
        S.taskCounts = sr.taskCounts || {};

        // CleanProgress データをキーマップに
        S.progressData    = {};
        S.progressDefaults = {};
        if (pr && pr.ok) {
          (pr.progress || []).forEach(function(p) {
            S.progressData[p.property] = {
              status:     p.status     || 'TODO',
              linen:      p.linen      || '',
              trash:      p.trash      || '',
              check:      p.check      || '',
              orderIndex: p.orderIndex || 0,
              updatedAt:  p.updatedAt  || ''
            };
          });
          S.progressDefaults = pr.defaults || {};
        }

        var hdr = sr.schedule.header;
        var H = {
          pn:  hdr.indexOf('PropertyName'),
          fd:  hdr.indexOf('Final_CheckoutDate'),
          fs:  hdr.indexOf('Final_AssignedStaff'),
          ord: hdr.indexOf('Order'),
          uid: hdr.indexOf('UID'),
          sdc: hdr.indexOf('Auto_SameDayCheckout')
        };

        var seen = {}, unique = [];
        sr.schedule.rows.forEach(function(row) {
          var k = String(row[H.pn] || '').trim() + '\t' + String(row[H.fd] || '').trim();
          if (!seen[k]) { seen[k] = true; unique.push(row); }
        });

        var am = {};
        (sr.assignments || []).forEach(function(a) {
          var pn = String(a.propertyName || '').trim();
          am[pn + '\t' + (a.uid || '')] = a;
          am['pn\t' + pn]               = a;
        });

        S.progressAssignUpdatedAt = sr.latestUpdatedAt || null;

        S.progressItems = unique.map(function(row) {
          var pn  = String(row[H.pn]  || '').trim();
          var uid = String(row[H.uid] || '').trim();
          var a   = am[pn + '\t' + uid] || am['pn\t' + pn];
          var sdc = H.sdc >= 0 ? String(row[H.sdc] || '').trim() : '';
          return {
            propertyName: pn,
            uid:          uid,
            staff:        a ? String(a.staff || '') : String(row[H.fs] || '').trim(),
            order:        a ? (Number(a.order) || 0) : (Number(row[H.ord]) || 0),
            isSameDayIn:  sdc === 'Yes'
          };
        });

        updateProgressStats();
        renderProgressStaff(S.progressItems);
        renderProgressBoard(S.progressItems);

        var now = new Date();
        document.getElementById('progress-refresh-note').textContent =
          '最終更新: ' + now.getHours() + ':' +
          String(now.getMinutes()).padStart(2, '0') + '  ／  30秒ごとに自動更新';
      }).catch(function(e) {
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('進捗確認読み込みエラー: ' + e.message);
      });
    }

    function updateProgressStats() {
      var items = S.progressItems;
      var totalN   = items.length;
      var sameDayN = items.filter(function(i) { return i.isSameDayIn; }).length;
      var notInN   = totalN - sameDayN;

      function isDone(item) {
        var pd = S.progressData[item.propertyName];
        return pd && pd.status === 'DONE';
      }
      var doneN        = items.filter(isDone).length;
      var doneSameDayN = items.filter(function(i) { return i.isSameDayIn && isDone(i); }).length;
      var doneNotInN   = items.filter(function(i) { return !i.isSameDayIn && isDone(i); }).length;

      document.getElementById('ps-done').textContent      = doneN        + '/' + totalN;
      document.getElementById('ps-samedayin').textContent = doneSameDayN + '/' + sameDayN;
      document.getElementById('ps-notin').textContent     = doneNotInN   + '/' + notInN;
    }

    function rerenderProgress() {
      updateProgressStats();
      renderProgressStaff(S.progressItems);
      renderProgressBoard(S.progressItems);
    }

    function getEffectiveProgress(propertyName) {
      if (S.progressData[propertyName]) return S.progressData[propertyName];
      // 行未作成の場合は defaults から初期値を計算
      var def = S.progressDefaults[propertyName] || {};
      return {
        status:     'TODO',
        linen:      '',
        trash:      def.trashDefault === 'NEED' ? 'NEED' : '',
        check:      def.checkDefault === 'NEED' ? 'NEED' : '',
        orderIndex: 0,
        updatedAt:  ''
      };
    }

    function renderProgressStaff(items) {
      var container = document.getElementById('progress-staff-view');
      if (!items.length) {
        container.innerHTML = '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var groups = {}, staffOrder = [];
      items.forEach(function(item) {
        var s = item.staff || '';
        if (!groups[s]) { groups[s] = []; staffOrder.push(s); }
        groups[s].push(item);
      });
      staffOrder.sort(function(a, b) {
        if (a === '') return -1;
        if (b === '') return 1;
        return a < b ? -1 : a > b ? 1 : 0;
      });

      var html = '';
      staffOrder.forEach(function(staffName) {
        var sItems = groups[staffName].slice().sort(function(a, b) {
          var pd1 = getEffectiveProgress(a.propertyName);
          var pd2 = getEffectiveProgress(b.propertyName);
          var sr1 = statusRank(pd1.status);
          var sr2 = statusRank(pd2.status);
          if (sr1 !== sr2) return sr1 - sr2;
          var oi1 = S.progressData[a.propertyName] ? (S.progressData[a.propertyName].orderIndex || 0) : (a.order || 0);
          var oi2 = S.progressData[b.propertyName] ? (S.progressData[b.propertyName].orderIndex || 0) : (b.order || 0);
          return oi1 - oi2;
        });

        html += '<div class="prog-section">' +
          '<div class="prog-section-title">' + esc(staffName || '未担当') + '</div>';
        sItems.forEach(function(item, posInGroup) {
          html += buildProgCard(item, 'staff', sItems, posInGroup);
        });
        html += '</div>';
      });

      container.innerHTML = html;
    }

    function renderProgressBoard(items) {
      var container = document.getElementById('progress-board-view');
      if (!items.length) {
        container.innerHTML = '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      function sortByStatusOrder(arr) {
        return arr.slice().sort(function(a, b) {
          var pd1 = getEffectiveProgress(a.propertyName);
          var pd2 = getEffectiveProgress(b.propertyName);
          var sr1 = statusRank(pd1.status);
          var sr2 = statusRank(pd2.status);
          if (sr1 !== sr2) return sr1 - sr2;
          var oi1 = S.progressData[a.propertyName] ? (S.progressData[a.propertyName].orderIndex || 0) : (a.order || 0);
          var oi2 = S.progressData[b.propertyName] ? (S.progressData[b.propertyName].orderIndex || 0) : (b.order || 0);
          return oi1 - oi2;
        });
      }

      var sameDayItems = sortByStatusOrder(items.filter(function(i) { return i.isSameDayIn; }));
      var notInItems   = sortByStatusOrder(items.filter(function(i) { return !i.isSameDayIn; }));

      var html = '';
      if (sameDayItems.length) {
        html += '<div class="prog-section"><div class="prog-section-title">同日イン</div>';
        sameDayItems.forEach(function(item) { html += buildProgCard(item, 'board', null, 0); });
        html += '</div>';
      }
      if (notInItems.length) {
        html += '<div class="prog-section"><div class="prog-section-title">インなし</div>';
        notInItems.forEach(function(item) { html += buildProgCard(item, 'board', null, 0); });
        html += '</div>';
      }

      container.innerHTML = html;
    }

    function buildProgCard(item, view, groupItems, posInGroup) {
      var pd    = getEffectiveProgress(item.propertyName);
      var status = pd.status || 'TODO';
      var cardClass = 'prog-card' + (status === 'DOING' ? ' doing' : status === 'DONE' ? ' done' : '');
      var pn = item.propertyName;
      var pnEsc = esc(pn);

      var label = item.isSameDayIn
        ? '<span class="prog-label-samedayin">同日イン</span>'
        : '<span class="prog-label-notin">インなし</span>';

      // 進捗ボードビューでは担当名も表示（担当なしは「未設定」）
      var staffLabel = view === 'board'
        ? '<span class="prog-card-staff">' + esc(item.staff || '未設定') + '</span>'
        : '';

      var cnt = S.taskCounts[pn] || 0;
      var taskRow = cnt > 0
        ? '<div class="prog-card-bottom"><span class="prog-task-count">対応 ' + cnt + ' 件</span></div>'
        : '';

      // ステータスボタン
      var statusRow = '<div class="status-row">' +
        '<button class="status-btn' + (status === 'TODO'  ? ' active-todo'  : '') + '" data-status="TODO"  data-prog-prop="' + pnEsc + '">未開始</button>' +
        '<button class="status-btn' + (status === 'DOING' ? ' active-doing' : '') + '" data-status="DOING" data-prog-prop="' + pnEsc + '">清掃中</button>' +
        '<button class="status-btn' + (status === 'DONE'  ? ' active-done'  : '') + '" data-status="DONE"  data-prog-prop="' + pnEsc + '">清掃完了</button>' +
      '</div>';

      // 進捗ボードビュー：リネン・ゴミ・チェック
      var indicatorsHtml = '';
      if (view === 'board') {
        var indicators = '';

        // リネン（常に表示）
        if (pd.linen === 'DONE') {
          indicators += '<span class="prog-ind-btn linen-done">リネン済 ✓</span>';
        } else {
          indicators += '<button class="prog-ind-btn linen-todo" data-linen-prop="' + pnEsc + '">リネン未</button>';
        }

        // ゴミ
        if (pd.trash === 'DONE') {
          indicators += '<span class="prog-ind-btn trash-done">ゴミ回収済 ✓</span>';
        } else if (pd.trash === 'NEED') {
          indicators += '<button class="prog-ind-btn trash-need" data-trash-prop="' + pnEsc + '">ゴミ要回収</button>';
        } else {
          indicators += '<button class="prog-ind-on" data-trash-on-prop="' + pnEsc + '">ゴミ+</button>';
        }

        // チェック
        if (pd.check === 'DONE') {
          indicators += '<span class="prog-ind-btn check-done">チェック済 ✓</span>';
        } else if (pd.check === 'NEED') {
          indicators += '<button class="prog-ind-btn check-need" data-check-prop="' + pnEsc + '">チェック要</button>';
        } else {
          indicators += '<button class="prog-ind-on" data-check-on-prop="' + pnEsc + '">チェック+</button>';
        }

        indicatorsHtml = '<div class="prog-indicators">' + indicators + '</div>';
      }

      // 担当変更セレクト（DONE カードは表示しない）
      var staffSelHtml = '';
      if (status !== 'DONE') {
        var selOpts = '<option value=""' + (!item.staff ? ' selected' : '') + '>未設定</option>';
        if (item.staff && !S.cleaners.some(function(c) { return c.name === item.staff; })) {
          selOpts += '<option value="' + esc(item.staff) + '" selected>' + esc(item.staff) + '</option>';
        }
        S.cleaners.forEach(function(c) {
          selOpts += '<option value="' + esc(c.name) + '"' +
            (c.name === item.staff ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        });
        staffSelHtml = '<div class="prog-staff-row">' +
          '<select class="prog-staff-sel" data-staff-chg-prop="' + pnEsc + '">' + selOpts + '</select>' +
        '</div>';
      }

      // スタッフ別ビュー：並べ替えボタン
      var reorderHtml = '';
      if (view === 'staff' && groupItems) {
        var sameStatusPeers = groupItems.filter(function(it) {
          return getEffectiveProgress(it.propertyName).status === status;
        });
        var posInSameStatus = sameStatusPeers.indexOf(item);
        var canUp   = posInSameStatus > 0;
        var canDown = posInSameStatus < sameStatusPeers.length - 1;
        reorderHtml = '<div class="prog-reorder-row">' +
          '<button class="prog-reorder-btn" data-reorder-up-prop="' + pnEsc + '"' + (canUp ? '' : ' disabled') + '>↑</button>' +
          '<button class="prog-reorder-btn" data-reorder-dn-prop="' + pnEsc + '"' + (canDown ? '' : ' disabled') + '>↓</button>' +
        '</div>';
      }

      return '<div class="' + cardClass + '">' +
        '<div class="prog-card-top">' +
          '<span class="prog-card-name">' + pnEsc + '</span>' +
          staffLabel + label +
        '</div>' +
        taskRow +
        statusRow +
        indicatorsHtml +
        staffSelHtml +
        reorderHtml +
      '</div>';
    }

    // ── 進捗更新 ─────────────────────────────────────────────────────
    function updateProgressField(propName, fields) {
      if (_progressPending[propName]) return;
      _progressPending[propName] = true;

      var pd    = S.progressData[propName] || {};
      var oldPd = Object.assign({}, pd);

      // 楽観的更新：即座に画面を変える
      var newPd = Object.assign({}, pd);
      if (fields.status     !== undefined) newPd.status     = fields.status;
      if (fields.linen      !== undefined) newPd.linen      = fields.linen;
      if (fields.trash      !== undefined) newPd.trash      = fields.trash;
      if (fields.check      !== undefined) newPd.check      = fields.check;
      if (fields.orderIndex !== undefined) newPd.orderIndex = fields.orderIndex;
      S.progressData[propName] = newPd;
      rerenderProgress();

      callApi({
        action:        'updateProgress',
        propertyName:  propName,
        date:          S.progressDate,
        fields:        fields,
        knownUpdatedAt: pd.updatedAt || ''
      }).then(function(r) {
        _progressPending[propName] = false;
        if (r.ok) {
          S.progressData[propName].updatedAt = r.updatedAt;
        } else if (r.error === 'conflict') {
          S.progressData[propName] = oldPd;
          rerenderProgress();
          toast('他の人が更新しました。最新情報を再読込します');
          loadProgress();
        } else {
          S.progressData[propName] = oldPd;
          rerenderProgress();
          toast('更新エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _progressPending[propName] = false;
        S.progressData[propName] = oldPd;
        rerenderProgress();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('更新エラー: ' + e.message);
      });
    }

    function reorderProgressCard(propName, direction) {
      if (_reorderPending) return;

      var pd = getEffectiveProgress(propName);
      var staffName = '';
      S.progressItems.forEach(function(i) { if (i.propertyName === propName) staffName = i.staff || ''; });

      // 同スタッフ・同ステータスのカードを現在の視覚順で取得
      var peers = S.progressItems.filter(function(i) {
        return (i.staff || '') === staffName && getEffectiveProgress(i.propertyName).status === pd.status;
      }).sort(function(a, b) {
        var oa = S.progressData[a.propertyName] ? (S.progressData[a.propertyName].orderIndex || 0) : (a.order || 0);
        var ob = S.progressData[b.propertyName] ? (S.progressData[b.propertyName].orderIndex || 0) : (b.order || 0);
        return oa - ob;
      });

      var pos = peers.findIndex(function(i) { return i.propertyName === propName; });
      var neighborPos = direction === 'up' ? pos - 1 : pos + 1;
      if (neighborPos < 0 || neighborPos >= peers.length) return;

      // スワップ後の配列を作り、全カードに 1..n を振り直す
      var arr = peers.map(function(i) { return i.propertyName; });
      var tmp = arr[pos]; arr[pos] = arr[neighborPos]; arr[neighborPos] = tmp;
      var updates = arr.map(function(pn, idx) { return { propertyName: pn, orderIndex: idx + 1 }; });

      // 楽観的更新：旧状態を保存してから即座に画面を変える
      var oldData = {};
      updates.forEach(function(u) {
        oldData[u.propertyName] = Object.assign({}, S.progressData[u.propertyName] || {});
      });
      _reorderPending = true;
      updates.forEach(function(u) {
        var ex = S.progressData[u.propertyName] || {};
        S.progressData[u.propertyName] = Object.assign({}, ex, { orderIndex: u.orderIndex });
      });
      rerenderProgress();

      callApi({
        action:  'updateProgressOrder',
        date:    S.progressDate,
        updates: updates
      }).then(function(r) {
        _reorderPending = false;
        if (r.ok) {
          updates.forEach(function(u) {
            if (S.progressData[u.propertyName]) S.progressData[u.propertyName].updatedAt = r.updatedAt;
          });
        } else {
          updates.forEach(function(u) { S.progressData[u.propertyName] = oldData[u.propertyName]; });
          rerenderProgress();
          toast('並び替えエラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _reorderPending = false;
        updates.forEach(function(u) { S.progressData[u.propertyName] = oldData[u.propertyName]; });
        rerenderProgress();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('並び替えエラー: ' + e.message);
      });
    }

    function changeProgressStaff(propName, newStaff) {
      if (_staffPendingProgress) return;
      _staffPendingProgress = true;

      // 楽観的更新：先に progressItems の staff を更新して再描画
      var oldStaff = '';
      S.progressItems.forEach(function(i) {
        if (i.propertyName === propName) { oldStaff = i.staff || ''; i.staff = newStaff; }
      });
      var oldUpdatedAt = S.progressAssignUpdatedAt;
      rerenderProgress();

      // rows は更新済み progressItems から構築
      var rows = S.progressItems.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });
      callApi({
        action:         'saveAssignments',
        date:           S.progressDate,
        rows:           rows,
        knownUpdatedAt: oldUpdatedAt || ''
      }).then(function(r) {
        _staffPendingProgress = false;
        if (r.ok) {
          if (r.latestUpdatedAt) S.progressAssignUpdatedAt = r.latestUpdatedAt;
          toast('担当を変更しました。反映まで最大5分かかります');
          return;
        }
        // ロールバック
        S.progressItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        S.progressAssignUpdatedAt = oldUpdatedAt;
        rerenderProgress();
        if (r.error === 'conflict') {
          toast('他の人が先に保存しました。再読込します');
          loadProgress();
        } else {
          toast('担当変更エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _staffPendingProgress = false;
        S.progressItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        S.progressAssignUpdatedAt = oldUpdatedAt;
        rerenderProgress();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('担当変更エラー: ' + e.message);
      });
    }

      propName:      null,

    function openTaskModal(propName) {
      taskModal.propName = propName;
      taskModal.photoRequired = false;

      document.getElementById('task-modal-prop').textContent = propName;

    function setPhotoToggle(val) {
      taskModal.photoRequired = val;
      document.getElementById('photo-no').classList.toggle('selected', !val);
      document.getElementById('photo-yes').classList.toggle('selected', val);
    }

    function setDateMode(mode) {
      taskModal.dateMode = mode;
      ['next', 'tomorrow', 'pick'].forEach(function(id) {
        document.getElementById('mode-' + id).classList.remove('selected');
      });
      if (mode === 'NEXT')      document.getElementById('mode-next').classList.add('selected');
      if (mode === 'DATE')      document.getElementById('mode-tomorrow').classList.add('selected');
      if (mode === 'DATE_PICK') document.getElementById('mode-pick').classList.add('selected');
      document.getElementById('task-date-pick').hidden = (mode !== 'DATE_PICK');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').hidden = true;
    }

    function submitTask() {
      var propName = taskModal.propName;
      var type     = document.getElementById('task-type').value;
      var content  = document.getElementById('task-content').value.trim();
      var mode     = taskModal.dateMode;

      if (!content) { toast('内容を入力してください'); return; }
      if (content.length > 200) { toast('内容は200文字以内にしてください'); return; }

      var targetMode, targetDate;
      if (mode === 'NEXT') {
        targetMode = 'NEXT'; targetDate = '';
      } else if (mode === 'DATE') {
        targetMode = 'DATE';
        targetDate = tomorrow();
      } else {
        targetMode = 'DATE';
        targetDate = document.getElementById('task-date-pick').value;
        if (!targetDate) { toast('日付を選んでください'); return; }
      }

      closeTaskModal();
      setBusy(true);
      callApi({
        action:        'addCleanTask',
        propertyName:  propName,
        type:          type,
        content:       content,
        photoRequired: taskModal.photoRequired,
        targetMode:    targetMode,
        targetDate:    targetDate
      }).then(function(r) {
        setBusy(false);
        if (r.ok) {
          toast('登録しました ✓');
          if (S.scheduleDetailKey) {
            delete S.scheduleTasks[S.scheduleDetailKey.split('\t')[0]];
            openScheduleDetail(S.scheduleDetailKey.split('\t')[0]);
          }
          loadScheduleTab();
        } else {
          toast('登録エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        setBusy(false);
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('登録エラー: ' + e.message);
      });
    }

    // ── タスクドロワー ───────────────────────────────────────────────
    function openTaskDrawer(propName) {
      var drawer = document.getElementById('task-drawer');
      document.getElementById('drawer-title').textContent = propName + ' の対応一覧';
      document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">読み込み中…</div>';
      drawer.hidden = false;

      callApi({ action: 'getCleanTasksForProperty', propertyName: propName })
        .then(function(r) {
          if (!r.ok) {
            document.getElementById('drawer-body').innerHTML =
              '<div class="drawer-empty">取得に失敗しました</div>';
            return;
          }
          renderDrawerBody(r.tasks || [], propName);
        })
        .catch(function(e) {
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          document.getElementById('drawer-body').innerHTML =
            '<div class="drawer-empty">取得エラー: ' + esc(e.message) + '</div>';
        });
    }

    function renderDrawerBody(tasks, propName) {
      if (!tasks.length) {
        document.getElementById('drawer-body').innerHTML =
          '<div class="drawer-empty">OPEN の対応はありません</div>';
        return;
      }
      var todayYmd = today();
      var html = '';
      tasks.forEach(function(t) {
        var dateLabel = t.targetMode === 'NEXT'
          ? '次回清掃' + (t.boundDate ? '（' + t.boundDate + '）' : '')
          : t.targetDate;
        var expired = t.targetMode === 'DATE' && t.targetDate && t.targetDate < todayYmd;
        html += '<div class="task-item">' +
          '<div class="task-item-header">' +
            '<span class="task-type-badge">' + esc(t.type) + '</span>' +
            '<span class="task-date-label">' + esc(dateLabel) + '</span>' +
            (expired ? '<span class="task-expired-label">期限切れ</span>' : '') +
          '</div>' +
          '<div class="task-content">' + esc(t.content) + '</div>' +
          (t.photoRequired ? '<div class="task-photo-tag">📷 写真必要</div>' : '') +
          '<div class="task-actions">' +
            '<button class="btn-task-done"   data-tid="' + esc(t.taskId) + '" data-prop="' + esc(propName) + '">完了</button>' +
            '<button class="btn-task-cancel" data-tid="' + esc(t.taskId) + '" data-prop="' + esc(propName) + '">取消</button>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('drawer-body').innerHTML = html;

      document.querySelectorAll('.btn-task-done, .btn-task-cancel').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tid    = btn.dataset.tid;
          var pn     = btn.dataset.prop;
          var status = btn.classList.contains('btn-task-done') ? 'DONE' : 'CANCELLED';
          btn.disabled = true;
          callApi({ action: 'updateCleanTaskStatus', taskId: tid, status: status })
            .then(function(r) {
              if (r.ok) {
                toast(status === 'DONE' ? '完了にしました ✓' : '取り消しました');
                openTaskDrawer(pn);
                loadScheduleTab();
              } else {
                btn.disabled = false;
                toast('更新エラー: ' + (r.error || '不明'));
              }
            })
            .catch(function(e) {
              btn.disabled = false;
              if (e.isUnauthorized) { handleUnauthorized(); return; }
              toast('更新エラー: ' + e.message);
            });
        });
      });
    }

    function closeTaskDrawer() {
      document.getElementById('task-drawer').hidden = true;
    }

    // ── 「物件を選んで追加」 ─────────────────────────────────────────
    function openBoardAddTask() {
      var drawer = document.getElementById('task-drawer');
      document.getElementById('drawer-title').textContent = '物件を選んで対応追加';
      document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">読み込み中…</div>';
      drawer.hidden = false;

      callApi({ action: 'getActiveProperties' })
        .then(function(r) {
          if (!r.ok) {
            closeTaskDrawer();
            toast('物件一覧の取得に失敗しました: ' + (r.error || '不明'));
            return;
          }
          var props = r.properties || [];
          if (!props.length) {
            document.getElementById('drawer-body').innerHTML =
              '<div class="drawer-empty">有効な物件がありません</div>';
            return;
          }

          var sel = document.createElement('select');
          sel.className = 'drawer-prop-sel';
          var placeholder = document.createElement('option');
          placeholder.value = ''; placeholder.textContent = '物件を選んでください';
          sel.appendChild(placeholder);
          props.forEach(function(p) {
            var opt = document.createElement('option');
            opt.value = p; opt.textContent = p;
            sel.appendChild(opt);
          });

          var body = document.getElementById('drawer-body');
          body.innerHTML = '';
          body.appendChild(sel);

          sel.onchange = function() {
            var p = sel.value;
            if (!p) return;
            closeTaskDrawer();
            openTaskModal(p);
          };
        })
        .catch(function(e) {
          closeTaskDrawer();
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('物件一覧の取得エラー: ' + e.message);
        });
    }
