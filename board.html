<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>担当割り＆ボード</title>
  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:  #00a84f;
      --bg:     #f4f4f4;
      --card:   #fff;
      --border: #e0e0e0;
      --muted:  #888;
    }
    body {
      font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg); color: #222; font-size: 15px; min-height: 100vh;
    }

    /* ── ローディング / エラー ── */
    .fill {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 2rem; text-align: center; gap: 1rem;
    }
    #error { color: #c00; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── アプリ ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── セッション期限切れバナー ── */
    .session-banner {
      background: #c00; color: #fff; text-align: center;
      padding: 0.65rem 1rem; font-size: 0.85rem; font-weight: bold;
    }

    /* ── タブ ── */
    .tabs {
      display: flex; background: var(--card);
      border-bottom: 2px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .tab-btn {
      flex: 1; padding: 0.8rem; border: none; background: transparent;
      font-size: 0.9rem; font-family: inherit; cursor: pointer; color: var(--muted);
    }
    .tab-btn.active {
      color: var(--green); border-bottom: 3px solid var(--green);
      margin-bottom: -2px; font-weight: bold;
    }

    /* ── パネル ── */
    .panel { padding: 0.75rem; }
    .panel[hidden] { display: none; }

    /* ── 日付行 ── */
    .date-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .date-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .date-row input[type="date"] {
      flex: 1; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.92rem; font-family: inherit; background: var(--card);
    }

    /* ── お知らせ / 警告 ── */
    .notice {
      background: #fffde7; border: 1px solid #f9c906; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #555;
      margin-bottom: 0.75rem;
    }
    .warn {
      background: #fff3e0; border: 1px solid #f57c00; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #444;
      margin-bottom: 0.75rem;
    }

    /* ── エリア見出し ── */
    .area-label {
      font-size: 0.78rem; font-weight: bold; color: var(--muted);
      padding: 0.35rem 0; margin-top: 0.6rem; border-bottom: 1px solid var(--border);
    }

    /* ── 物件カード ── */
    .prop-card {
      background: var(--card); border-radius: 8px;
      padding: 0.65rem 0.75rem; margin-top: 0.4rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.07);
    }
    .prop-name { font-weight: bold; font-size: 0.92rem; margin-bottom: 0.4rem; }
    .prop-ctrl { display: flex; align-items: center; gap: 0.4rem; }
    .staff-sel {
      flex: 1; padding: 0.38rem 0.5rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.88rem; font-family: inherit; background: var(--card);
    }
    .ord-btn {
      width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); cursor: pointer; font-size: 0.7rem; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ord-btn:active { background: var(--border); }
    .ord-badge {
      min-width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); font-size: 0.78rem; font-weight: bold; color: var(--muted);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    /* ── ボタン ── */
    .actions { display: flex; gap: 0.6rem; margin-top: 1rem; padding-bottom: 1rem; }
    .btn {
      flex: 1; padding: 0.7rem; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.92rem; font-weight: bold; font-family: inherit; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:active:not(:disabled) { opacity: 0.75; }
    .btn-save   { background: var(--green); color: #fff; }
    .btn-import { background: var(--card); color: var(--green); border: 1.5px solid var(--green); }

    /* ── ボード ── */
    .board-stats {
      display: flex; gap: 0.5rem; background: var(--card); border-radius: 8px;
      padding: 0.7rem 0.5rem; margin-bottom: 0.75rem;
    }
    .bstat { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .bstat-n { font-size: 1.4rem; font-weight: bold; color: var(--green); }
    .bstat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .board-wrap { overflow-x: auto; padding-bottom: 0.75rem; }
    .board-cols { display: flex; gap: 0.55rem; min-width: min-content; }
    .bcol {
      min-width: 130px; max-width: 155px; background: var(--card); border-radius: 8px;
      padding: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.07); flex-shrink: 0;
    }
    .bcol-title {
      font-size: 0.82rem; font-weight: bold; text-align: center;
      background: var(--bg); border-radius: 4px; padding: 0.35rem; margin-bottom: 0.4rem;
    }
    .bprop {
      display: flex; align-items: flex-start; gap: 0.35rem;
      padding: 0.38rem 0; border-bottom: 1px solid var(--bg); font-size: 0.8rem;
    }
    .bprop:last-child { border-bottom: none; }
    .bprop-icon { flex-shrink: 0; font-size: 0.88rem; margin-top: 0.05rem; }
    .no-report { color: #aaa; font-size: 0.74rem; }
    .refresh-note { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 0.5rem; }

    /* ── 共通メッセージ ── */
    .msg { color: var(--muted); text-align: center; padding: 2rem 1rem; font-size: 0.88rem; }

    /* ── 確認モーダル ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-box {
      background: var(--card); border-radius: 12px; padding: 1.5rem 1.25rem;
      max-width: 300px; width: calc(100% - 2rem); text-align: center;
    }
    .modal-box p { margin-bottom: 0.5rem; font-size: 0.92rem; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }

    /* ── トースト ── */
    #toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); color: #fff; padding: 0.65rem 1.1rem;
      border-radius: 8px; font-size: 0.88rem; z-index: 100; white-space: nowrap;
      pointer-events: none; transition: opacity 0.25s;
    }
    #toast[hidden] { display: none; }

    /* ── 対応追加 ── */
    .bprop-bottom {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 0.3rem; gap: 0.3rem;
    }
    .task-badge {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: #fff3e0; color: #e65100; border: 1px solid #ffcc80;
      border-radius: 20px; padding: 0.18rem 0.5rem; font-size: 0.72rem;
      font-weight: bold; cursor: pointer; white-space: nowrap;
    }
    .task-badge:active { opacity: 0.7; }
    .btn-add-task {
      background: var(--green); color: #fff; border: none; border-radius: 4px;
      padding: 0.2rem 0.45rem; font-size: 0.72rem; font-weight: bold;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .btn-add-task:active { opacity: 0.75; }
    .board-add-row {
      margin-bottom: 0.6rem;
    }
    .btn-board-add {
      width: 100%; padding: 0.55rem; border-radius: 7px;
      border: 1.5px dashed var(--green); background: transparent;
      color: var(--green); font-size: 0.88rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-board-add:active { background: #f0faf5; }

    /* ── タスク登録モーダル ── */
    .task-modal-box {
      background: var(--card); border-radius: 14px;
      padding: 1.25rem; max-width: 340px; width: calc(100% - 2rem);
      max-height: 90vh; overflow-y: auto;
    }
    .task-modal-title {
      font-size: 1rem; font-weight: bold; margin-bottom: 0.9rem; text-align: center;
    }
    .task-modal-prop {
      font-size: 0.82rem; color: var(--muted); text-align: center;
      margin-top: -0.5rem; margin-bottom: 0.9rem;
    }
    .form-row { margin-bottom: 0.8rem; }
    .form-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; display: block; }
    .form-sel, .form-input, .form-textarea {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .form-textarea { height: 80px; resize: vertical; }
    .toggle-row { display: flex; gap: 0.5rem; }
    .toggle-btn {
      flex: 1; padding: 0.45rem; border: 1.5px solid var(--border); border-radius: 6px;
      background: var(--bg); font-size: 0.88rem; font-family: inherit; cursor: pointer;
    }
    .toggle-btn.selected {
      border-color: var(--green); background: #e8f5e9; color: var(--green); font-weight: bold;
    }
    .form-date-input {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .char-count { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 0.2rem; }
    .char-count.over { color: #c00; }

    /* ── タスクドロワー ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 40;
    }
    .drawer-overlay[hidden] { display: none; }
    .drawer-box {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-radius: 14px 14px 0 0;
      padding: 1rem; max-height: 75vh; overflow-y: auto; z-index: 45;
    }
    .drawer-title {
      font-size: 0.95rem; font-weight: bold; margin-bottom: 0.75rem;
    }
    .task-item {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 0.75rem; margin-bottom: 0.55rem; background: var(--bg);
    }
    .task-item-header {
      display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem;
    }
    .task-type-badge {
      font-size: 0.7rem; font-weight: bold; padding: 0.15rem 0.45rem;
      border-radius: 10px; background: #e3f2fd; color: #1565c0;
    }
    .task-date-label { font-size: 0.75rem; color: var(--muted); }
    .task-expired-label {
      font-size: 0.7rem; color: #c00; font-weight: bold;
      background: #fce4ec; border-radius: 4px; padding: 0.1rem 0.35rem;
    }
    .task-content { font-size: 0.86rem; margin-bottom: 0.45rem; }
    .task-photo-tag {
      font-size: 0.72rem; color: #e65100; background: #fff3e0;
      border-radius: 4px; padding: 0.1rem 0.35rem; display: inline-block; margin-bottom: 0.45rem;
    }
    .task-actions { display: flex; gap: 0.5rem; }
    .btn-task-done {
      flex: 1; padding: 0.4rem; border: none; border-radius: 6px;
      background: var(--green); color: #fff; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-done:active { opacity: 0.75; }
    .btn-task-cancel {
      flex: 1; padding: 0.4rem; border: 1.5px solid #aaa; border-radius: 6px;
      background: transparent; color: #555; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-cancel:active { opacity: 0.75; }
    .drawer-empty { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 1rem 0; }
    .drawer-prop-sel {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.92rem; font-family: inherit;
      background: var(--card); margin-bottom: 0.9rem;
    }
  </style>
</head>

<body>
  <div id="loading" class="fill">
    <span class="spin" style="font-size:2rem">↻</span>
    <span>読み込み中…</span>
  </div>
  <div id="error" class="fill" hidden></div>

  <div id="app" hidden>
    <div id="session-banner" class="session-banner" hidden>
      ログインの有効期限が切れました。画面を開き直してください
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="assign">担当割り</button>
      <button class="tab-btn"        data-tab="board" >ボード</button>
    </nav>

    <!-- 担当割りタブ -->
    <div id="panel-assign" class="panel">
      <div class="date-row">
        <label for="date-sel">日付</label>
        <input type="date" id="date-sel">
      </div>
      <div id="updating-warn" class="warn" hidden>
        清掃データ更新中のため保存できません。少し待って再読込してください
      </div>
      <div id="assign-notice" class="notice" hidden>
        この日は画面の担当割りが優先されます（最終保存：<span id="notice-time"></span>）
      </div>
      <div id="prop-list"></div>
      <div class="actions">
        <button class="btn btn-import" id="btn-import" disabled>スプシを取り込む</button>
        <button class="btn btn-save"   id="btn-save"   disabled>保存</button>
      </div>
    </div>

    <!-- ボードタブ -->
    <div id="panel-board" class="panel" hidden>
      <div class="date-row">
        <label for="board-date-sel">日付</label>
        <input type="date" id="board-date-sel">
      </div>
      <div class="board-add-row">
        <button class="btn-board-add" id="btn-board-add-task">＋ 物件を選んで対応追加</button>
      </div>
      <div class="board-stats">
        <div class="bstat"><span class="bstat-n" id="b-done">-</span><span class="bstat-l">完了</span></div>
        <div class="bstat"><span class="bstat-n" id="b-total">-</span><span class="bstat-l">全体</span></div>
        <div class="bstat"><span class="bstat-n" id="b-urgent">-</span><span class="bstat-l">当日IN未完了</span></div>
      </div>
      <div class="board-wrap">
        <div id="board-cols" class="board-cols"></div>
      </div>
      <div class="refresh-note" id="refresh-note">30秒ごとに自動更新</div>
    </div>
  </div>

  <!-- タスク登録モーダル -->
  <div id="task-modal" class="modal-overlay" hidden>
    <div class="task-modal-box">
      <div class="task-modal-title">対応追加</div>
      <div class="task-modal-prop" id="task-modal-prop"></div>
      <div class="form-row">
        <label class="form-label">種類</label>
        <select id="task-type" class="form-sel">
          <option value="WORK">作業追加（WORK）</option>
          <option value="TIME">時間変更（TIME）</option>
          <option value="CARRY">持ち込み（CARRY）</option>
          <option value="OTHER">その他（OTHER）</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">内容 <span id="task-char-count" class="char-count">0 / 200</span></label>
        <textarea id="task-content" class="form-textarea" placeholder="内容を入力（必須・200文字以内）" maxlength="200"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">写真</label>
        <div class="toggle-row">
          <button class="toggle-btn" data-val="false" id="photo-no">不要</button>
          <button class="toggle-btn" data-val="true"  id="photo-yes">必要</button>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">日付</label>
        <div class="toggle-row" id="date-mode-row">
          <button class="toggle-btn" data-mode="NEXT" id="mode-next">次回清掃</button>
          <button class="toggle-btn" data-mode="DATE" id="mode-tomorrow">明日</button>
          <button class="toggle-btn" data-mode="DATE_PICK" id="mode-pick">日付指定</button>
        </div>
        <input type="date" id="task-date-pick" class="form-date-input" style="margin-top:0.4rem" hidden>
      </div>
      <div class="modal-actions">
        <button class="btn btn-import" id="task-modal-cancel">キャンセル</button>
        <button class="btn btn-save"   id="task-modal-submit">登録</button>
      </div>
    </div>
  </div>

  <!-- タスク一覧ドロワー -->
  <div id="task-drawer" class="drawer-overlay" hidden>
    <div class="drawer-box">
      <div class="drawer-title" id="drawer-title">対応一覧</div>
      <div id="drawer-body"></div>
    </div>
  </div>

  <!-- 競合確認モーダル -->
  <div id="conflict-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <p>他の人が先に保存しました。</p>
      <p>再読込すると、入力中の内容は消えます。</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-import">キャンセル</button>
        <button id="modal-reload" class="btn btn-save">再読込</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script>
    'use strict';

    var CFG = window.DISPATCH_CONFIG || {};

    // ── 状態 ──────────────────────────────────────────────────────────
    var S = {
      idToken:         null,
      currentDate:     null,   // 担当割りタブの日付（明日を初期値）
      boardDate:       null,   // ボードタブの日付（今日を初期値）
      items:           [],     // [{propertyName,uid,date,area,staff,order,csStaff,csOrder}]
      cleaners:        [],     // [{name,canReport}]
      latestUpdatedAt: null,
      busy:            false,
      updating:        false,  // getSchedule が sr.updating=true のとき保存を禁止
      taskCounts:      {},     // { propertyName: openCount }
      activeProps:     [],     // 全有効物件名リスト（「物件を選んで追加」用）
      sessionExpired:  false,
      activeTab:       'assign',
      boardTimer:      null
    };

    // ── ユーティリティ ─────────────────────────────────────────────────
    function today() {
      var d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function tomorrow() {
      var d = new Date();
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function fmtTime(iso) {
      if (!iso) return '';
      try {
        var d = new Date(iso);
        return d.getHours() + '時' + String(d.getMinutes()).padStart(2, '0') + '分';
      } catch (e) { return ''; }
    }

    var AREA_RANK = { '①': 1, '②': 2, '③': 3, '④': 4, '⑤': 5 };
    function areaRank(a) { return AREA_RANK[String(a || '').trim()] || 99; }

    var toastTimer;
    function toast(msg, ms) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.hidden = true; }, ms || 2500);
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // updating または sessionExpired のときも保存ボタンを無効にする
    function setBusy(v) {
      S.busy = v;
      document.getElementById('btn-save').disabled   = v || S.updating || S.sessionExpired;
      document.getElementById('btn-import').disabled = v || S.sessionExpired;
    }

    function stopBoardTimer() {
      clearInterval(S.boardTimer);
      S.boardTimer = null;
    }

    function startBoardTimer() {
      stopBoardTimer();
      if (!document.hidden && !S.sessionExpired) {
        S.boardTimer = setInterval(loadBoard, 30000);
      }
    }

    function handleUnauthorized() {
      stopBoardTimer();
      S.sessionExpired = true;
      document.getElementById('session-banner').hidden = false;
      document.getElementById('btn-save').disabled   = true;
      document.getElementById('btn-import').disabled = true;
      var msg = '<div class="msg">ログインの有効期限が切れました。画面を開き直してください</div>';
      document.getElementById('prop-list').innerHTML  = msg;
      document.getElementById('board-cols').innerHTML = msg;
    }

    // ── 競合確認モーダル ──────────────────────────────────────────────
    function showConflictModal(onReload) {
      var modal = document.getElementById('conflict-modal');
      modal.hidden = false;
      document.getElementById('modal-cancel').onclick = function() {
        modal.hidden = true;
        setBusy(false);
      };
      document.getElementById('modal-reload').onclick = function() {
        modal.hidden = true;
        onReload();
      };
    }

    // ── API ──────────────────────────────────────────────────────────
    function callApi(body) {
      body.idToken = S.idToken;
      return fetch(CFG.GAS_API_URL + '?api=1', {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify(body)
      }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(data) {
        if (data && data.error === 'unauthorized') {
          var err = new Error('unauthorized');
          err.isUnauthorized = true;
          throw err;
        }
        return data;
      });
    }

    // ── スケジュール読み込み ──────────────────────────────────────────
    function loadSchedule(date) {
      setBusy(true);
      document.getElementById('prop-list').innerHTML =
        '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      return Promise.all([
        callApi({ action: 'getSchedule', date: date }),
        cleanerProm
      ]).then(function(res) {
        var sr = res[0], cr = res[1];
        if (!sr.ok) throw new Error('getSchedule: ' + (sr.error || '不明'));
        if (cr) {
          if (!cr.ok) throw new Error('getCleanerList: ' + (cr.error || '不明'));
          S.cleaners = cr.cleaners;
        }

        // updating フラグ — 清掃データ更新中のとき保存ボタンを無効にする
        S.updating = !!sr.updating;
        document.getElementById('updating-warn').hidden = !S.updating;

        // ヘッダー列インデックス
        var hdr = sr.schedule.header;
        var H = {
          pn:   hdr.indexOf('PropertyName'),
          fd:   hdr.indexOf('Final_CheckoutDate'),
          fs:   hdr.indexOf('Final_AssignedStaff'),
          ord:  hdr.indexOf('Order'),
          area: hdr.indexOf('Area'),
          uid:  hdr.indexOf('UID')
        };

        // PropertyName+date で重複除去（同一物件の複数行は1件に）
        var seen = {}, unique = [];
        sr.schedule.rows.forEach(function(row) {
          var k = String(row[H.pn] || '').trim() + '\t' + String(row[H.fd] || '').trim();
          if (!seen[k]) { seen[k] = true; unique.push(row); }
        });

        // Assignments をキーマップに（UID 優先、次に PropertyName）
        var am = {};
        (sr.assignments || []).forEach(function(a) {
          var pn = String(a.propertyName || '').trim();
          am[pn + '\t' + (a.uid || '')] = a;
          am['pn\t' + pn]               = a;
        });

        S.items = unique.map(function(row) {
          var pn  = String(row[H.pn]  || '').trim();
          var uid = String(row[H.uid] || '').trim();
          var cs  = String(row[H.fs]  || '').trim();
          var co  = Number(row[H.ord]) || 0;
          var ar  = H.area >= 0 ? String(row[H.area] || '').trim() : '';
          var a   = am[pn + '\t' + uid] || am['pn\t' + pn];
          return {
            propertyName: pn, uid: uid, date: date, area: ar,
            staff:   a ? String(a.staff  || '')  : cs,
            order:   a ? (Number(a.order) || 0)  : co,
            csStaff: cs, csOrder: co
          };
        });

        S.latestUpdatedAt = sr.latestUpdatedAt || null;

        // お知らせ表示
        var hasAsgn = (sr.assignments || []).length > 0;
        document.getElementById('assign-notice').hidden = !hasAsgn;
        if (hasAsgn && sr.latestUpdatedAt) {
          document.getElementById('notice-time').textContent = fmtTime(sr.latestUpdatedAt);
        }

        renderAssign();
        setBusy(false);
      });
    }

    // ── 担当割りタブ描画 ──────────────────────────────────────────────
    function renderAssign() {
      var list = document.getElementById('prop-list');
      if (!S.items.length) {
        list.innerHTML = '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      // area rank → order でソート
      var sorted = S.items.slice().sort(function(a, b) {
        var d = areaRank(a.area) - areaRank(b.area);
        if (d !== 0) return d;
        return (a.order || 999) - (b.order || 999);
      });

      // エリアでグループ化
      var groups = [], curArea = null;
      sorted.forEach(function(item) {
        var a = item.area || '';
        if (a !== curArea) { groups.push({ area: a, items: [] }); curArea = a; }
        groups[groups.length - 1].items.push(item);
      });

      var html = '';
      groups.forEach(function(g) {
        html += '<div class="area-label">' +
          esc(g.area ? 'エリア ' + g.area : 'エリア未設定') + '</div>';
        g.items.forEach(function(item) {
          var idx  = S.items.indexOf(item);
          var opts = '<option value=""' + (!item.staff ? ' selected' : '') + '>（未割り当て）</option>';
          // 現在の担当がリストにない場合も選択肢に残す
          if (item.staff && !S.cleaners.some(function(c) { return c.name === item.staff; })) {
            opts += '<option value="' + esc(item.staff) + '" selected>' + esc(item.staff) + '</option>';
          }
          S.cleaners.forEach(function(c) {
            opts += '<option value="' + esc(c.name) + '"' +
              (c.name === item.staff ? ' selected' : '') + '>' + esc(c.name) + '</option>';
          });
          html +=
            '<div class="prop-card">' +
              '<div class="prop-name">' + esc(item.propertyName) + '</div>' +
              '<div class="prop-ctrl">' +
                '<select class="staff-sel" data-idx="' + idx + '">' + opts + '</select>' +
                '<button class="ord-btn" data-action="up"   data-idx="' + idx + '">↑</button>' +
                '<span  class="ord-badge">' + (item.order || '–') + '</span>' +
                '<button class="ord-btn" data-action="down" data-idx="' + idx + '">↓</button>' +
              '</div>' +
            '</div>';
        });
      });

      list.innerHTML = html;

      list.querySelectorAll('.ord-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          syncStaff();
          reorder(parseInt(btn.dataset.idx, 10), btn.dataset.action === 'up' ? -1 : 1);
        });
      });
    }

    // DOM の select 値を state に同期
    function syncStaff() {
      document.querySelectorAll('.staff-sel').forEach(function(sel) {
        var i = parseInt(sel.dataset.idx, 10);
        if (!isNaN(i)) S.items[i].staff = sel.value;
      });
    }

    // 同じ担当の中で順序を入れ替え
    function reorder(idx, delta) {
      var item = S.items[idx];
      var peers = S.items.filter(function(it) { return it.staff === item.staff; })
        .sort(function(a, b) { return (a.order || 999) - (b.order || 999); });
      if (peers.length < 2) return;
      peers.forEach(function(it, i) { it.order = i + 1; });
      var pos = peers.indexOf(item);
      var np  = pos + delta;
      if (np < 0 || np >= peers.length) return;
      var other = peers[np];
      var tmp = item.order; item.order = other.order; other.order = tmp;
      renderAssign();
    }

    // ── ボードタブ描画 ────────────────────────────────────────────────
    function loadBoard() {
      if (S.sessionExpired) return;

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      return Promise.all([
        callApi({ action: 'getSchedule', date: S.boardDate }),
        cleanerProm
      ]).then(function(res) {
        var sr = res[0], cr = res[1];
        if (cr && cr.ok) S.cleaners = cr.cleaners;
        if (!sr.ok) { toast('ボードの読み込みに失敗しました'); return; }
        S.taskCounts = sr.taskCounts || {};

        var hdr = sr.schedule.header;
        var H = {
          pn:  hdr.indexOf('PropertyName'),
          fd:  hdr.indexOf('Final_CheckoutDate'),
          fs:  hdr.indexOf('Final_AssignedStaff'),
          ord: hdr.indexOf('Order'),
          uid: hdr.indexOf('UID')
        };

        var seen = {}, unique = [];
        sr.schedule.rows.forEach(function(row) {
          var k = String(row[H.pn] || '').trim() + '\t' + String(row[H.fd] || '').trim();
          if (!seen[k]) { seen[k] = true; unique.push(row); }
        });

        var am = {};
        (sr.assignments || []).forEach(function(a) {
          var pn = String(a.propertyName || '').trim();
          am[pn + '\t' + (a.uid || '')] = a;
          am['pn\t' + pn]               = a;
        });

        var boardItems = unique.map(function(row) {
          var pn  = String(row[H.pn]  || '').trim();
          var uid = String(row[H.uid] || '').trim();
          var a   = am[pn + '\t' + uid] || am['pn\t' + pn];
          return {
            propertyName: pn,
            staff: a ? String(a.staff || '') : String(row[H.fs] || '').trim(),
            order: a ? (Number(a.order) || 0) : (Number(row[H.ord]) || 0)
          };
        });

        // スタッフマップ（cleanerList の順番で列を並べる）
        var cmap = {};
        S.cleaners.forEach(function(c) { cmap[c.name] = c; });

        var cols = {}, colNames = [];
        boardItems.forEach(function(item) {
          var s = item.staff || '（未割り当て）';
          if (!cols[s]) { cols[s] = []; colNames.push(s); }
          cols[s].push(item);
        });
        colNames.sort(function(a, b) {
          var ia = S.cleaners.findIndex(function(c) { return c.name === a; });
          var ib = S.cleaners.findIndex(function(c) { return c.name === b; });
          return (ia < 0 ? 9999 : ia) - (ib < 0 ? 9999 : ib);
        });

        document.getElementById('b-done').textContent   = 0;
        document.getElementById('b-total').textContent  = boardItems.length;
        document.getElementById('b-urgent').textContent = '–';

        var html = '';
        colNames.forEach(function(name) {
          var info   = cmap[name];
          var canRep = info ? info.canReport : true;
          var props  = cols[name].slice().sort(function(a, b) {
            return (a.order || 999) - (b.order || 999);
          });
          html += '<div class="bcol">';
          html += '<div class="bcol-title">' + esc(name) + '</div>';
          props.forEach(function(p) {
            var icon  = canRep ? '⚪' : '📵';
            var cnt   = S.taskCounts[p.propertyName] || 0;
            var badge = cnt > 0
              ? '<span class="task-badge" data-prop="' + esc(p.propertyName) + '">対応 ' + cnt + ' 件</span>'
              : '';
            html += '<div class="bprop">' +
              '<span class="bprop-icon">' + icon + '</span>' +
              '<span style="flex:1">' + esc(p.propertyName) +
                (canRep ? '' : '<br><span class="no-report">報告なし</span>') +
              '</span>' +
              '<div class="bprop-bottom">' +
                badge +
                '<button class="btn-add-task" data-prop="' + esc(p.propertyName) + '">＋対応</button>' +
              '</div>' +
            '</div>';
          });
          html += '</div>';
        });
        if (!html) html = '<div class="msg">この日の清掃はありません</div>';

        document.getElementById('board-cols').innerHTML = html;
        var now = new Date();
        document.getElementById('refresh-note').textContent =
          '最終更新: ' + now.getHours() + ':' +
          String(now.getMinutes()).padStart(2, '0') + '  ／  30秒ごとに自動更新';
      }).catch(function(e) {
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('ボード読み込みエラー: ' + e.message);
      });
    }

    // ── 対応追加モーダル ──────────────────────────────────────────────

    var taskModal = {
      propName: null,
      photoRequired: false,
      dateMode: 'NEXT'   // 'NEXT' | 'DATE' | 'DATE_PICK'
    };

    function openTaskModal(propName) {
      taskModal.propName = propName;
      taskModal.photoRequired = false;
      taskModal.dateMode = 'NEXT';
      document.getElementById('task-modal-prop').textContent = propName;
      document.getElementById('task-type').value = 'WORK';
      document.getElementById('task-content').value = '';
      document.getElementById('task-char-count').textContent = '0 / 200';
      document.getElementById('task-char-count').classList.remove('over');
      setPhotoToggle(false);
      setDateMode('NEXT');
      document.getElementById('task-modal').hidden = false;
    }

    function setPhotoToggle(val) {
      taskModal.photoRequired = val;
      document.getElementById('photo-no').classList.toggle('selected', !val);
      document.getElementById('photo-yes').classList.toggle('selected', val);
    }

    function setDateMode(mode) {
      taskModal.dateMode = mode;
      ['next', 'tomorrow', 'pick'].forEach(function(id) {
        document.getElementById('mode-' + id).classList.remove('selected');
      });
      if (mode === 'NEXT')      document.getElementById('mode-next').classList.add('selected');
      if (mode === 'DATE')      document.getElementById('mode-tomorrow').classList.add('selected');
      if (mode === 'DATE_PICK') document.getElementById('mode-pick').classList.add('selected');
      document.getElementById('task-date-pick').hidden = (mode !== 'DATE_PICK');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').hidden = true;
    }

    function submitTask() {
      var propName = taskModal.propName;
      var type     = document.getElementById('task-type').value;
      var content  = document.getElementById('task-content').value.trim();
      var mode     = taskModal.dateMode;

      if (!content) { toast('内容を入力してください'); return; }
      if (content.length > 200) { toast('内容は200文字以内にしてください'); return; }

      var targetMode, targetDate;
      if (mode === 'NEXT') {
        targetMode = 'NEXT'; targetDate = '';
      } else if (mode === 'DATE') {
        targetMode = 'DATE';
        targetDate = tomorrow();
      } else {
        targetMode = 'DATE';
        targetDate = document.getElementById('task-date-pick').value;
        if (!targetDate) { toast('日付を選んでください'); return; }
      }

      closeTaskModal();
      setBusy(true);
      callApi({
        action: 'addCleanTask',
        propertyName:  propName,
        type:          type,
        content:       content,
        photoRequired: taskModal.photoRequired,
        targetMode:    targetMode,
        targetDate:    targetDate
      }).then(function(r) {
        setBusy(false);
        if (r.ok) {
          toast('登録しました ✓');
          loadBoard();
        } else {
          toast('登録エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        setBusy(false);
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('登録エラー: ' + e.message);
      });
    }

    // ── タスクドロワー ───────────────────────────────────────────────

    function openTaskDrawer(propName) {
      var drawer = document.getElementById('task-drawer');
      document.getElementById('drawer-title').textContent = propName + ' の対応一覧';
      document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">読み込み中…</div>';
      drawer.hidden = false;

      callApi({ action: 'getCleanTasksForProperty', propertyName: propName })
        .then(function(r) {
          if (!r.ok) { document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">取得に失敗しました</div>'; return; }
          renderDrawerBody(r.tasks || [], propName);
        })
        .catch(function(e) {
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">取得エラー: ' + esc(e.message) + '</div>';
        });
    }

    function renderDrawerBody(tasks, propName) {
      if (!tasks.length) {
        document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">OPEN の対応はありません</div>';
        return;
      }
      var todayYmd = today();
      var html = '';
      tasks.forEach(function(t) {
        var dateLabel = t.targetMode === 'NEXT'
          ? '次回清掃' + (t.boundDate ? '（' + t.boundDate + '）' : '')
          : t.targetDate;
        var expired = t.targetMode === 'DATE' && t.targetDate && t.targetDate < todayYmd;
        html += '<div class="task-item">' +
          '<div class="task-item-header">' +
            '<span class="task-type-badge">' + esc(t.type) + '</span>' +
            '<span class="task-date-label">' + esc(dateLabel) + '</span>' +
            (expired ? '<span class="task-expired-label">期限切れ</span>' : '') +
          '</div>' +
          '<div class="task-content">' + esc(t.content) + '</div>' +
          (t.photoRequired ? '<div class="task-photo-tag">📷 写真必要</div>' : '') +
          '<div class="task-actions">' +
            '<button class="btn-task-done"   data-tid="' + esc(t.taskId) + '" data-prop="' + esc(propName) + '">完了</button>' +
            '<button class="btn-task-cancel" data-tid="' + esc(t.taskId) + '" data-prop="' + esc(propName) + '">取消</button>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('drawer-body').innerHTML = html;

      document.querySelectorAll('.btn-task-done, .btn-task-cancel').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tid    = btn.dataset.tid;
          var pn     = btn.dataset.prop;
          var status = btn.classList.contains('btn-task-done') ? 'DONE' : 'CANCELLED';
          btn.disabled = true;
          callApi({ action: 'updateCleanTaskStatus', taskId: tid, status: status })
            .then(function(r) {
              if (r.ok) {
                toast(status === 'DONE' ? '完了にしました ✓' : '取り消しました');
                openTaskDrawer(pn); // ドロワーを再描画
                loadBoard();        // バッジ件数を更新
              } else {
                btn.disabled = false;
                toast('更新エラー: ' + (r.error || '不明'));
              }
            })
            .catch(function(e) {
              btn.disabled = false;
              if (e.isUnauthorized) { handleUnauthorized(); return; }
              toast('更新エラー: ' + e.message);
            });
        });
      });
    }

    function closeTaskDrawer() {
      document.getElementById('task-drawer').hidden = true;
    }

    // ── 「物件を選んで追加」プロパティ選択 ──────────────────────────

    function openBoardAddTask() {
      // 有効物件リストは getSchedule の taskCounts キー＋ボード表示物件から作る
      // （全物件リストは readActivePropertyNames API がないため board の items から取る）
      var props = [];
      var seen = {};
      document.querySelectorAll('[data-prop]').forEach(function(el) {
        var p = el.dataset.prop;
        if (p && !seen[p]) { seen[p] = true; props.push(p); }
      });
      if (!props.length) { toast('ボードに物件が表示されていません'); return; }

      var sel = document.getElementById('board-prop-sel');
      if (!sel) {
        sel = document.createElement('select');
        sel.id = 'board-prop-sel';
        sel.className = 'drawer-prop-sel';
        var placeholder = document.createElement('option');
        placeholder.value = ''; placeholder.textContent = '物件を選んでください';
        sel.appendChild(placeholder);
      }
      // オプションを更新
      while (sel.options.length > 1) sel.remove(1);
      props.sort().forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      });

      // ドロワーを物件選択モードで開く
      var drawer = document.getElementById('task-drawer');
      document.getElementById('drawer-title').textContent = '物件を選んで対応追加';
      var body = document.getElementById('drawer-body');
      body.innerHTML = '';
      body.appendChild(sel);
      sel.value = '';
      drawer.hidden = false;

      sel.onchange = function() {
        var p = sel.value;
        if (!p) return;
        closeTaskDrawer();
        openTaskModal(p);
      };
    }

    // ── イベント ──────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {

      // タブ切り替え
      document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tab = btn.dataset.tab;
          S.activeTab = tab;
          document.querySelectorAll('.tab-btn').forEach(function(b) {
            b.classList.toggle('active', b === btn);
          });
          document.getElementById('panel-assign').hidden = tab !== 'assign';
          document.getElementById('panel-board').hidden  = tab !== 'board';
          stopBoardTimer();
          if (tab === 'board') {
            loadBoard();
            startBoardTimer();
          }
        });
      });

      // 担当割りタブ：日付変更
      document.getElementById('date-sel').addEventListener('change', function() {
        S.currentDate = this.value;
        loadSchedule(S.currentDate).catch(function(e) {
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('読み込みエラー: ' + e.message);
          setBusy(false);
        });
      });

      // ボードタブ：日付変更
      document.getElementById('board-date-sel').addEventListener('change', function() {
        S.boardDate = this.value;
        loadBoard();
      });

      // スプシを取り込む
      document.getElementById('btn-import').addEventListener('click', function() {
        syncStaff();
        S.items.forEach(function(item) {
          item.staff = item.csStaff;
          item.order = item.csOrder;
        });
        renderAssign();
        toast('スプシの担当を取り込みました');
      });

      // 保存
      document.getElementById('btn-save').addEventListener('click', function() {
        if (S.busy || S.updating || S.sessionExpired) return;
        syncStaff();
        setBusy(true);
        var rows = S.items.map(function(item) {
          return {
            propertyName: item.propertyName,
            uid:          item.uid,
            staff:        item.staff,
            order:        item.order
          };
        });
        callApi({
          action:         'saveAssignments',
          date:           S.currentDate,
          rows:           rows,
          knownUpdatedAt: S.latestUpdatedAt
        }).then(function(r) {
          if (r.ok) {
            toast('保存しました ✓');
            return loadSchedule(S.currentDate);
          }
          if (r.error === 'conflict') {
            showConflictModal(function() {
              loadSchedule(S.currentDate).catch(function(e) {
                if (e.isUnauthorized) { handleUnauthorized(); return; }
                toast('読み込みエラー: ' + e.message);
                setBusy(false);
              });
            });
            return;
          }
          toast('保存エラー: ' + (r.error || '不明'));
          setBusy(false);
        }).catch(function(e) {
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('保存エラー: ' + e.message);
          setBusy(false);
        });
      });

      // タスク登録モーダル：内部イベント
      document.getElementById('task-content').addEventListener('input', function() {
        var len = this.value.length;
        var el  = document.getElementById('task-char-count');
        el.textContent = len + ' / 200';
        el.classList.toggle('over', len > 200);
      });
      document.getElementById('photo-no').addEventListener('click', function() { setPhotoToggle(false); });
      document.getElementById('photo-yes').addEventListener('click', function() { setPhotoToggle(true); });
      document.getElementById('mode-next').addEventListener('click', function() { setDateMode('NEXT'); });
      document.getElementById('mode-tomorrow').addEventListener('click', function() { setDateMode('DATE'); });
      document.getElementById('mode-pick').addEventListener('click', function() { setDateMode('DATE_PICK'); });
      document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
      document.getElementById('task-modal-submit').addEventListener('click', submitTask);
      // モーダル背景タップで閉じる
      document.getElementById('task-modal').addEventListener('click', function(e) {
        if (e.target === this) closeTaskModal();
      });

      // ドロワー背景タップで閉じる
      document.getElementById('task-drawer').addEventListener('click', function(e) {
        if (e.target === this) closeTaskDrawer();
      });

      // 「物件を選んで対応追加」ボタン
      document.getElementById('btn-board-add-task').addEventListener('click', openBoardAddTask);

      // ボード内のボタン委譲（board-cols は再描画されるため、親に委譲）
      document.getElementById('panel-board').addEventListener('click', function(e) {
        var addBtn = e.target.closest('.btn-add-task');
        if (addBtn) { openTaskModal(addBtn.dataset.prop); return; }
        var badge = e.target.closest('.task-badge');
        if (badge) { openTaskDrawer(badge.dataset.prop); return; }
      });

      // 画面が隠れているあいだはボードの自動更新を止める
      document.addEventListener('visibilitychange', function() {
        if (S.activeTab !== 'board') return;
        if (document.hidden) {
          stopBoardTimer();
        } else {
          loadBoard();
          startBoardTimer();
        }
      });
    });

    // ── LIFF 初期化 ──────────────────────────────────────────────────
    liff.init({ liffId: CFG.LIFF_ID }).then(function() {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      S.idToken     = liff.getIDToken();
      S.currentDate = tomorrow();   // 担当割りタブは明日
      S.boardDate   = today();      // ボードタブは今日
      document.getElementById('date-sel').value       = S.currentDate;
      document.getElementById('board-date-sel').value = S.boardDate;
      document.getElementById('loading').hidden = true;
      document.getElementById('app').hidden     = false;

      loadSchedule(S.currentDate).catch(function(e) {
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('読み込みエラー: ' + e.message);
        setBusy(false);
      });
    }).catch(function(e) {
      document.getElementById('loading').hidden = true;
      var el = document.getElementById('error');
      el.hidden = false;
      el.innerHTML =
        '<strong>LIFF の初期化に失敗しました</strong><br>' +
        esc(e.message || '不明なエラー');
    });
  </script>
</body>
</html>
