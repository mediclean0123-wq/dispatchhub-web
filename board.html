<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>管理ボード</title>
  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:  #00a84f;
      --accent: #00a84f;
      --fg:     #222;
      --bg:     #f4f4f4;
      --card:   #fff;
      --border: #e0e0e0;
      --muted:  #888;
    }
    body {
      font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg); color: #222; font-size: 15px; min-height: 100vh;
    }

    /* ── ローディング / エラー ── */
    .fill {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 2rem; text-align: center; gap: 1rem;
    }
    #error { color: #c00; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── アプリ ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── セッション期限切れバナー ── */
    .session-banner {
      background: #c00; color: #fff; text-align: center;
      padding: 0.65rem 1rem; font-size: 0.85rem; font-weight: bold;
    }

    /* ── タブ ── */
    .tabs {
      display: flex; background: var(--card);
      border-bottom: 2px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .tab-btn {
      flex: 1; padding: 0.8rem; border: none; background: transparent;
      font-size: 0.9rem; font-family: inherit; cursor: pointer; color: var(--muted);
    }
    .tab-btn.active {
      color: var(--green); border-bottom: 3px solid var(--green);
      margin-bottom: -2px; font-weight: bold;
    }

    /* ── パネル ── */
    .panel { padding: 0.75rem; }
    .panel[hidden] { display: none; }

    /* ── 日付行 ── */
    .date-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .date-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .date-row input[type="date"] {
      flex: 1; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.92rem; font-family: inherit; background: var(--card);
    }

    /* ── お知らせ / 警告 ── */
    .notice {
      background: #fffde7; border: 1px solid #f9c906; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #555;
      margin-bottom: 0.75rem;
    }
    .warn {
      background: #fff3e0; border: 1px solid #f57c00; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #444;
      margin-bottom: 0.75rem;
    }

    /* ── エリア見出し ── */
    .area-label {
      font-size: 0.78rem; font-weight: bold; color: var(--muted);
      padding: 0.35rem 0; margin-top: 0.6rem; border-bottom: 1px solid var(--border);
    }

    /* ── ボタン（モーダル共通） ── */
    .btn {
      flex: 1; padding: 0.7rem; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.92rem; font-weight: bold; font-family: inherit; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:active:not(:disabled) { opacity: 0.75; }
    .btn-save   { background: var(--green); color: #fff; }
    .btn-import { background: var(--card); color: var(--green); border: 1.5px solid var(--green); }

    /* ── ボード（今後の清掃予定タブ） ── */
    .board-stats {
      display: flex; gap: 0.5rem; background: var(--card); border-radius: 8px;
      padding: 0.7rem 0.5rem; margin-bottom: 0.75rem;
    }
    .bstat { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .bstat-n { font-size: 1.4rem; font-weight: bold; color: var(--green); }
    .bstat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .board-wrap { overflow-x: auto; padding-bottom: 0.75rem; }
    .board-cols { display: flex; gap: 0.55rem; min-width: min-content; }
    .bcol {
      min-width: 130px; max-width: 155px; background: var(--card); border-radius: 8px;
      padding: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.07); flex-shrink: 0;
    }
    .bcol-title {
      font-size: 0.82rem; font-weight: bold; text-align: center;
      background: var(--bg); border-radius: 4px; padding: 0.35rem; margin-bottom: 0.4rem;
    }
    .bprop {
      display: flex; flex-direction: column;
      padding: 0.38rem 0; border-bottom: 1px solid var(--bg); font-size: 0.8rem;
    }
    .bprop:last-child { border-bottom: none; }
    .bprop-top { display: flex; align-items: center; gap: 0.3rem; }
    .bprop-icon { flex-shrink: 0; font-size: 0.88rem; }
    .bprop-name { flex: 1; word-break: break-word; }
    .no-report { color: #aaa; font-size: 0.74rem; }
    .refresh-note { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 0.5rem; }

    /* ── 共通メッセージ ── */
    .msg { color: var(--muted); text-align: center; padding: 2rem 1rem; font-size: 0.88rem; }

    /* ── 確認モーダル ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-box {
      background: var(--card); border-radius: 12px; padding: 1.5rem 1.25rem;
      max-width: 300px; width: calc(100% - 2rem); text-align: center;
    }
    .modal-box p { margin-bottom: 0.5rem; font-size: 0.92rem; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }

    /* ── トースト ── */
    #toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); color: #fff; padding: 0.65rem 1.1rem;
      border-radius: 8px; font-size: 0.88rem; z-index: 100; white-space: nowrap;
      pointer-events: none; transition: opacity 0.25s;
    }
    #toast[hidden] { display: none; }

    /* ── 対応追加 ── */
    .bprop-bottom {
      display: flex; flex-wrap: wrap; align-items: center;
      margin-top: 0.3rem; gap: 0.35rem;
    }
    .task-badge {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: #fff3e0; color: #e65100; border: 1px solid #ffcc80;
      border-radius: 20px; padding: 0 0.55rem; font-size: 0.72rem;
      font-weight: bold; cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .task-badge:active { opacity: 0.7; }
    .btn-add-task {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--green); color: #fff; border: none; border-radius: 4px;
      padding: 0 0.6rem; font-size: 0.72rem; font-weight: bold;
      cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .btn-add-task:active { opacity: 0.75; }
    .btn-resend {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--green); border: 1px solid var(--green);
      border-radius: 4px; padding: 0 0.6rem; font-size: 0.72rem; font-weight: bold;
      cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .btn-resend:active { opacity: 0.75; }
    .board-add-row { margin-bottom: 0.6rem; }
    .btn-board-add {
      width: 100%; padding: 0.55rem; border-radius: 7px;
      border: 1.5px dashed var(--green); background: transparent;
      color: var(--green); font-size: 0.88rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-board-add:active { background: #f0faf5; }

    /* ── タスク登録モーダル ── */
    .task-modal-box {
      background: var(--card); border-radius: 14px;
      padding: 1.25rem; max-width: 340px; width: calc(100% - 2rem);
      max-height: 90vh; overflow-y: auto;
    }
    .task-modal-title {
      font-size: 1rem; font-weight: bold; margin-bottom: 0.9rem; text-align: center;
    }
    .task-modal-prop {
      font-size: 0.82rem; color: var(--muted); text-align: center;
      margin-top: -0.5rem; margin-bottom: 0.9rem;
    }
    .form-row { margin-bottom: 0.8rem; }
    .form-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; display: block; }
    .form-sel, .form-input, .form-textarea {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .form-textarea { height: 80px; resize: vertical; }
    .toggle-row { display: flex; gap: 0.5rem; }
    .toggle-btn {
      flex: 1; padding: 0.45rem; border: 1.5px solid var(--border); border-radius: 6px;
      background: var(--bg); font-size: 0.88rem; font-family: inherit; cursor: pointer;
    }
    .toggle-btn.selected {
      border-color: var(--green); background: #e8f5e9; color: var(--green); font-weight: bold;
    }
    .form-date-input {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .char-count { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 0.2rem; }
    .char-count.over { color: #c00; }

    /* ── タスクドロワー ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 40;
    }
    .drawer-overlay[hidden] { display: none; }
    .drawer-box {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-radius: 14px 14px 0 0;
      padding: 1rem; max-height: 75vh; overflow-y: auto; z-index: 45;
    }
    .drawer-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 0.75rem; }
    .task-item {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 0.75rem; margin-bottom: 0.55rem; background: var(--bg);
    }
    .task-item-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
    .task-type-badge {
      font-size: 0.7rem; font-weight: bold; padding: 0.15rem 0.45rem;
      border-radius: 10px; background: #e3f2fd; color: #1565c0;
    }
    .task-date-label { font-size: 0.75rem; color: var(--muted); }
    .task-date-display { font-size: 0.95rem; font-weight: 600; color: var(--green); padding: 0.15rem 0; }
    .task-expired-label {
      font-size: 0.7rem; color: #c00; font-weight: bold;
      background: #fce4ec; border-radius: 4px; padding: 0.1rem 0.35rem;
    }
    .task-content { font-size: 0.86rem; margin-bottom: 0.45rem; }
    .task-photo-tag {
      font-size: 0.72rem; color: #e65100; background: #fff3e0;
      border-radius: 4px; padding: 0.1rem 0.35rem; display: inline-block; margin-bottom: 0.45rem;
    }
    .task-actions { display: flex; gap: 0.5rem; }
    .btn-task-done {
      flex: 1; padding: 0.4rem; border: none; border-radius: 6px;
      background: var(--green); color: #fff; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-done:active { opacity: 0.75; }
    .btn-task-cancel {
      flex: 1; padding: 0.4rem; border: 1.5px solid #aaa; border-radius: 6px;
      background: transparent; color: #555; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-cancel:active { opacity: 0.75; }
    .drawer-empty { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 1rem 0; }
    .drawer-prop-sel {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.92rem; font-family: inherit;
      background: var(--card); margin-bottom: 0.9rem;
    }

    /* ── 進捗確認タブ ── */
    .progress-stats {
      display: flex; gap: 0.5rem; background: var(--card); border-radius: 8px;
      padding: 0.7rem 0.5rem; margin-bottom: 0.75rem;
    }
    .pstat { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .pstat-n { font-size: 1.05rem; font-weight: bold; color: var(--green); }
    .pstat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .view-btn {
      flex: 1; padding: 0.55rem; border-radius: 6px;
      border: 1.5px solid #bbb; background: #fff;
      font-size: 0.88rem; cursor: pointer; font-family: inherit; color: #333;
    }
    .view-btn.active {
      border-color: var(--green); background: var(--green);
      color: #fff; font-weight: bold;
    }
    .prog-section { margin-bottom: 0.75rem; }
    .prog-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.35rem 0; margin-bottom: 0.4rem; border-bottom: 1px solid var(--border);
    }
    .prog-section-title { font-size: 0.8rem; font-weight: bold; color: var(--muted); }
    .prog-section-remain { font-size: 0.72rem; color: var(--muted); }

    /* ── タイルグリッド ── */
    .prog-tiles-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3rem; }
    .prog-tiles-staff { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.25rem; }
    .prog-tile {
      background: var(--card); border-radius: 6px; padding: 0.4rem 0.45rem;
      min-height: 56px; cursor: pointer; border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      display: flex; flex-direction: column; gap: 0.1rem;
      text-align: left; font-family: inherit; width: 100%;
    }
    /* スタッフ別：横長1行カード */
    .prog-tiles-staff .prog-tile {
      flex-direction: row; align-items: center; min-height: auto;
      padding: 0.2rem 0.4rem; gap: 0.35rem;
      min-width: 0; overflow: hidden;
    }
    .prog-tiles-staff .prog-tile-nameline {
      flex: 1; min-width: 0; align-items: center;
    }
    .prog-tiles-staff .prog-tile-name {
      display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      -webkit-line-clamp: unset; -webkit-box-orient: unset;
      font-size: 0.75rem; font-weight: normal; color: inherit;
    }
    .prog-tiles-staff .prog-tile-stage { display: none; }
    .prog-tiles-staff .prog-tile-staff { flex-shrink: 0; max-width: 5.5em; font-size: 0.62rem; }
    .prog-tiles-staff .prog-tile-marks { margin-top: 0; flex-shrink: 0; flex-wrap: nowrap; }
    /* 進捗確認 タップ順番モード */
    .btn-prog-order {
      font-size: 0.72rem; padding: 0.15rem 0.5rem; border: 1px solid #1976d2;
      border-radius: 5px; background: #e3f2fd; color: #1976d2; cursor: pointer;
      font-family: inherit; flex-shrink: 0;
    }
    .btn-prog-order:active { opacity: 0.75; }
    .prog-order-bar {
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
      padding: 0.3rem 0.4rem; margin-bottom: 0.3rem;
      background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 6px;
      font-size: 0.8rem;
    }
    .prog-order-bar button {
      font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px;
      border: 1px solid #aaa; background: #fff; cursor: pointer; font-family: inherit;
    }
    .prog-order-bar .btn-complete {
      background: #1976d2; color: #fff; border-color: #1565c0; font-weight: bold;
    }
    .prog-tile-orderable { cursor: pointer; }
    .prog-tile-orderable:active { opacity: 0.7; background: #f0f4ff !important; }
    .prog-tile-tap-badge {
      flex-shrink: 0; font-size: 0.58rem; font-weight: bold;
      line-height: 1.7; background: #1976d2; color: #fff;
      border-radius: 2px; padding: 0 0.2rem; margin-top: 0.02rem;
    }
    .prog-tile.doing       { background: #e3f2fd; border-color: #90caf9; }
    .prog-tile.done        { background: #f0f0f0; border-color: #ccc; }
    .prog-tile.linen-stage { background: #fffde7; border-color: #ffe082; }
    .prog-tile:active { opacity: 0.75; }
    .prog-tile-nameline {
      display: flex; align-items: flex-start; gap: 0.18rem; flex: 1; min-width: 0;
    }
    .prog-tile-num {
      flex-shrink: 0; font-size: 0.58rem; font-weight: bold;
      line-height: 1.7; background: rgba(0,0,0,0.09); color: #333;
      border-radius: 2px; padding: 0 0.2rem; margin-top: 0.02rem;
    }
    .prog-tile-stage {
      font-size: 0.6rem; color: #e65100; font-weight: bold; line-height: 1.3;
    }
    .prog-tile-name {
      font-size: 0.78rem; font-weight: bold; word-break: break-word;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      flex: 1; line-height: 1.25;
    }
    .prog-tile.done .prog-tile-name { color: #777; }
    .prog-tile-staff {
      font-size: 0.65rem; color: #1976d2;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .prog-tile-staff.unset { color: #999; font-weight: normal; }
    .prog-tile-marks { display: flex; gap: 0.2rem; flex-wrap: wrap; margin-top: 0.05rem; }
    .prog-mark {
      font-size: 0.6rem; padding: 0.05rem 0.22rem; border-radius: 3px;
      font-weight: bold; line-height: 1.4; white-space: nowrap;
    }
    .prog-mark-linen      { background: #e0e0e0; color: #666; }
    .prog-mark-linen-done { background: #c8e6c9; color: #2e7d32; }
    .prog-mark-trash      { background: #ffcdd2; color: #b71c1c; }
    .prog-mark-trash-done { background: #c8e6c9; color: #2e7d32; }
    .prog-mark-check      { background: #fff9c4; color: #f57f17; }
    .prog-mark-check-done { background: #c8e6c9; color: #2e7d32; }

    /* ── 進捗確認スタッフ別 同日イン／インなしバッジ ── */
    .prog-checkin-badge {
      font-size: 0.6rem; font-weight: bold; padding: 0.05rem 0.22rem;
      border-radius: 3px; flex-shrink: 0; line-height: 1.4; white-space: nowrap;
    }
    .prog-checkin-badge-in  { background: #e3f2fd; color: #1565c0; }
    .prog-checkin-badge-out { background: #eeeeee; color: #888; }

    /* ── 進捗編集ドロワー ── */
    .ped-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 0.9rem; gap: 0.5rem;
    }
    .ped-prop-name { font-size: 0.95rem; font-weight: bold; flex: 1; word-break: break-word; }
    .ped-close-btn {
      width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 50%;
      background: var(--bg); cursor: pointer; font-size: 0.82rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ped-close-btn:active { background: var(--border); }
    .ped-section { margin-bottom: 0.75rem; }
    .ped-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; }
    .ped-status-row { display: flex; gap: 0.4rem; }
    .ped-status-btn {
      flex: 1; padding: 0.45rem 0.2rem; border-radius: 6px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.82rem; font-family: inherit; cursor: pointer; text-align: center; color: #888;
    }
    .ped-status-btn.active-todo  { border-color: #555; background: #fff; color: #333; font-weight: bold; }
    .ped-status-btn.active-doing { border-color: #1976d2; background: #e3f2fd; color: #1565c0; font-weight: bold; }
    .ped-status-btn.active-done  { border-color: #888; background: #e0e0e0; color: #555; font-weight: bold; }
    .ped-ind-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.35rem; }
    .ped-ind-label { font-size: 0.8rem; width: 3.5em; flex-shrink: 0; color: #555; }
    .ped-ind-btn {
      flex: 1; padding: 0.38rem 0.4rem; border-radius: 6px; font-size: 0.8rem;
      border: 1.5px solid var(--border); background: var(--bg);
      font-family: inherit; cursor: pointer; text-align: center;
    }
    .ped-ind-btn.linen-todo { background: var(--bg); color: var(--muted); }
    .ped-ind-btn.linen-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .ped-ind-btn.trash-none { background: var(--bg); color: var(--muted); }
    .ped-ind-btn.trash-need { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
    .ped-ind-btn.trash-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .ped-ind-btn.check-none { background: var(--bg); color: var(--muted); }
    .ped-ind-btn.check-need { background: #fffde7; color: #f57f17; border-color: #fff176; }
    .ped-ind-btn.check-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .ped-ind-back-btn {

    .order-mode-list { background: var(--card); border-radius: 8px; overflow: hidden; margin-bottom: 0.5rem; }
    .order-tap-row {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.75rem;

    .order-tap-badge {
      display: inline-flex; align-items: center; justify-content: center;

    .order-mode-actions { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }

    .sched-list { background: var(--card); border-radius: 8px; overflow: hidden; margin-bottom: 0.75rem; }

    .sched-type-badge-in {
      font-size: 0.68rem; font-weight: bold; color: #1565c0; background: #e3f2fd;

    .sched-type-badge-out {
      font-size: 0.68rem; font-weight: bold; color: var(--muted); background: var(--bg);

    /* 展開エリア */

      padding: 0.6rem 0.65rem 0.65rem; border-top: 1px solid var(--border); background: #fafafa;

    .sched-assign-section {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;

    .sched-default-section {

    .sched-default-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.3rem; }

    /* ── 検索モード：日付ラベル・件数超過 ── */
    .sched-date-label {
      font-size: 0.72rem; color: var(--muted); white-space: nowrap; flex-shrink: 0;

    .sched-search-more {
      text-align: center; padding: 0.55rem; font-size: 0.82rem; color: var(--muted);

    .sched-status-badge {
      display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.4rem;
      border-radius: 3px; margin-left: 0.3rem; vertical-align: middle;

    .sched-status-badge.pending { background: #fff8e1; color: #e65100; }

      border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.45rem;

      padding: 0.35rem 0.9rem; border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--fg); font-size: 0.82rem;
      font-family: inherit; cursor: pointer;

      padding: 0.35rem 0.7rem; border: 1px solid var(--border); border-radius: 6px;
      background: var(--card); color: var(--fg); font-size: 0.82rem;
      font-family: inherit; cursor: pointer;

    .btn-manual-back:active { opacity: 0.75; }
    .manual-title { font-size: 1rem; font-weight: bold; }

    .manual-error { background: #ffebee; color: #c62828; border-radius: 6px; padding: 0.6rem 0.8rem; font-size: 0.85rem; }

    /* ── 手入力予約パネル 段階2 ── */
    .btn-manual-add {

    .manual-badge {
      display: inline-block; font-size: 0.68rem; padding: 0.1rem 0.45rem;
      border-radius: 4px; margin-left: 0.5rem; vertical-align: middle; font-weight: normal;

      padding: 0.35rem 0.9rem; background: #388e3c; color: #fff; border: none;

    }
    .btn-linen-toggle.on { border-color: #ffd54f; background: #fffde7; color: #f57f17; font-weight: bold; }
    .btn-linen-toggle:active { opacity: 0.75; }
    /* リネンバッジを非表示にするクラス（#panel-progress に付与） */
    .linen-hidden .prog-mark-linen,
    .linen-hidden .prog-mark-linen-done,
    .linen-hidden .prog-tile-stage { display: none; }
    /* アルバムURL再送 */
    .album-resend-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .btn-album-resend {
      padding: 0.3rem 0.8rem; border: 1px solid #1976d2; border-radius: 6px;
      background: #e3f2fd; color: #1976d2; font-size: 0.82rem; font-family: inherit; cursor: pointer;
    }
    .btn-album-resend:active { opacity: 0.75; }
    .btn-album-resend:disabled { opacity: 0.5; cursor: default; }

  </style>
</head>

<body>
  <div id="loading" class="fill">
    <span class="spin" style="font-size:2rem">↻</span>
    <span>読み込み中…</span>

  <div id="app" hidden>
    <div id="session-banner" class="session-banner" hidden>

    <nav class="tabs">

    <!-- 今後の清掃予定タブ -->

      <div class="manual-open-row">

      </div>
      <div class="date-row">
        <label for="board-date-sel">日付</label>

      <div class="board-stats">
        <div class="bstat"><span class="bstat-n" id="s-total">-</span><span class="bstat-l">清掃</span></div>
        <div class="bstat"><span class="bstat-n" id="s-samedayin">-</span><span class="bstat-l">同日イン</span></div>
        <div class="bstat"><span class="bstat-n" id="s-notin">-</span><span class="bstat-l">インなし</span></div>

        <div id="order-mode-list" class="order-mode-list"></div>
        <div class="order-mode-actions">
          <button id="btn-order-reset"  class="btn btn-import">やり直し</button>
          <button id="btn-order-cancel" class="btn btn-import">キャンセル</button>

    <!-- 手入力予約パネル -->
    <div id="panel-manual" class="panel" hidden>
      <div class="manual-header-row">
        <button id="btn-manual-back" class="btn-manual-back">← 今後の清掃予定</button>

  <!-- タスク登録モーダル -->
  <div id="task-modal" class="modal-overlay" hidden>

  <!-- 競合確認モーダル -->

    <div class="modal-box">

  <div id="toast" hidden></div>

  <!-- 進捗編集ドロワー -->
  <div id="prog-edit-drawer" class="drawer-overlay" hidden>
    <div class="drawer-box">
      <div class="ped-header">
        <div class="ped-prop-name" id="ped-prop-name">─</div>
        <button id="ped-close" class="ped-close-btn">✕</button>
      </div>

        <div class="ped-label">リネン・ゴミ・チェック</div>
        <div class="ped-ind-row">
          <span class="ped-ind-label">リネン</span>
          <button id="ped-linen-btn" class="ped-ind-btn linen-todo">リネン未</button>

        </div>
        <div class="ped-ind-row">
          <span class="ped-ind-label">ゴミ</span>
          <button id="ped-trash-btn" class="ped-ind-btn trash-none">オフ</button>
          <button id="ped-trash-back" class="ped-ind-back-btn" hidden>戻す</button>
        </div>
        <div class="ped-ind-row">
          <span class="ped-ind-label">チェック</span>
          <button id="ped-check-btn" class="ped-ind-btn check-none">オフ</button>
          <button id="ped-check-back" class="ped-ind-back-btn" hidden>戻す</button>
        </div>
      </div>
      <div class="ped-section">
        <button id="ped-tasks-btn" class="btn-ped-tasks">対応を見る</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    var CFG = window.DISPATCH_CONFIG || {};

    // ── 楽観的更新の二重送信防止フラグ ────────────────────────────────
    var _progressPending      = {};   // { [propName]: true } — updateProgressField 中
    var _staffPendingProgress = false;  // changeProgressStaff 中
    var _staffPendingSchedule = false;  // changeScheduleStaff 中
    var _progOrderPending     = false;  // completeProgOrderMode 中

    // ── 状態 ──────────────────────────────────────────────────────────
    var S = {
      idToken:            null,
      currentDate:        null,
      boardDate:          null,
      progressDate:       null,
      items:              [],
      cleaners:           [],
      latestUpdatedAt:    null,
      busy:               false,
      updating:           false,
      taskCounts:         {},
      activeProps:        [],
      sessionExpired:     false,
      activeTab:          'progress',
      boardTimer:         null,
      progressTimer:      null,
      activeProgressView: 'staff',
      progressItems:          [],   // スケジュール行（isSameDayIn / staff / uid / order）
      progressData:           {},   // { propertyName: { status, linen, trash, check, orderIndex, updatedAt } }
      progressDefaults:       {},   // { propertyName: { checkDefault, trashDefault } }
      progressAssignUpdatedAt: null, // 進捗確認タブで担当変更するときの衝突検知用
      // 今後の清掃予定タブ
      scheduleItems:           [],   // {propertyName, uid, date, staff, order, isSameDayIn, taskCount}
      scheduleAssignUpdatedAt: null, // saveAssignments の衝突検知
      scheduleProgressData:    {},   // boardDate===today のときの progressData（DONE チェック用）
      scheduleExpandedKey:     null, // 展開中の行キー（"propName\tdate"）
      scheduleDetailKey:       null, // 詳細設定が開いている行キー
      scheduleTasks:           {},   // {[propName]: tasks[]} lazy キャッシュ
      scheduleSearchText:      '',   // 検索テキスト
      // 複数日検索
      scheduleSearchFetched:   false, // getScheduleRange フェッチ済みか
      scheduleSearchItems:     [],    // [{date, propertyName, uid, staff, isSameDayIn, order, taskCount}]
      scheduleSearchByDate:    {},    // { [date]: { items: [...], latestUpdatedAt } }
      scheduleSearchLoading:   false,  // フェッチ中
      // 表示モード
      scheduleGrouping:        'area', // 'area' | 'staff'
      orderMode:               false,  // タップ順モード中
      orderModeStaff:          '',     // 選択スタッフ
      orderModeTaps:           [],     // タップした uid 順リスト
      isAdmin:                 false,  // saveAssignments 権限あり
      // 進捗確認タップ順番モード
      progOrderMode:           null,   // null=通常 / string=順番モード中のスタッフ名
      progTapList:             [],     // タップ済み uid のリスト
      // 進捗編集ドロワー
      editDrawerProp: null,   // 編集中の propertyName
      editDrawerView: null,   // 'board' or 'staff'
      progressFetchedAt: 0,
      scheduleFetchedAt: 0,
      lineRequests: [],
      // 手入力予約パネル
      manualReservations: [],
      manualPendingRequests: [],
      manualLocalAdds: [],  // 今のフォームセッションで追加した行（loadManualReservations で消えない）
      manualLoading: false,
      manualCandidates: null,      // getManualPropertyCandidates で取得した候補
      manualAllProperties: [],     // 全物件（すべて表示モード）
      manualCandidatesLoaded: false,
      manualShowAllProps: false,   // true = 全物件表示モード
      manualSameDay: false,        // フォームの同日イン状態
      manualIsSpot: false,         // スポットモード
      manualChangeUid: null,       // インライン変更中の UID
      manualFilterProp: '',        // 絞り込み物件（'' = すべて）
      manualFilterRange: 'all',    // 'all' | 'this-month' | 'next-month'
      bulkRows: []                 // まとめて追加の行データ
    };

    // ── ユーティリティ ─────────────────────────────────────────────────
    function today() {
      var d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function tomorrow() {
      var d = new Date();
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function fmtTime(iso) {
      if (!iso) return '';
      try {
        var d = new Date(iso);
        return d.getHours() + '時' + String(d.getMinutes()).padStart(2, '0') + '分';
      } catch (e) { return ''; }
    }

    function fmtDate(ymd) {
      if (!ymd) return '';
      var parts = ymd.split('-');
      return (parts[1] | 0) + '/' + (parts[2] | 0);
    }

    var AREA_RANK = { '①': 1, '②': 2, '③': 3, '④': 4, '⑤': 5 };
    function areaRank(a) { return AREA_RANK[String(a || '').trim()] || 99; }

    var STATUS_RANK = { 'DONE': 0, 'DOING': 1, 'TODO': 2 };
    function statusRank(s) { return STATUS_RANK[s] !== undefined ? STATUS_RANK[s] : 2; }

    // ── スケジュールタブ：表示バー制御 ───────────────────────────────
    function updateScheduleViewBars() {
      var isSearch = S.scheduleSearchText.trim().length > 0;
      var loaded   = S.scheduleSearchFetched || S.scheduleSearchLoading;
      // グループ切り替えバー: データ読み込み後に表示
      document.getElementById('sched-grouping-bar').hidden = !loaded;
      // 順番を決めるボタン: ADMIN + 単日モード + モード外
      document.getElementById('order-mode-bar').hidden =
        !S.isAdmin || isSearch || S.orderMode;
      // アルバムURL再送バー: ADMIN + 今日の単日表示のときのみ
      document.getElementById('album-resend-bar').hidden =
        !S.isAdmin || isSearch || !loaded || S.boardDate !== today();
    }

    // ── タップ順モード ────────────────────────────────────────────────
    function renderOrderModeList() {
      var staff = S.orderModeStaff;
      var listEl = document.getElementById('order-mode-list');
      if (!staff) { listEl.innerHTML = ''; return; }

      var items = S.scheduleItems.filter(function(i) { return (i.staff || '') === staff; });
      items = items.slice().sort(function(a, b) {
        var ar = areaRank(a.area) - areaRank(b.area);
        if (ar) return ar;
        return (a.order || 999) - (b.order || 999);
      });

      var taps = S.orderModeTaps;
      var html = '';
      var _curArea = null;
      items.forEach(function(item) {
        if (item.area !== _curArea) {
          html += '<div class="area-label">' +
            esc(item.area ? 'エリア ' + item.area : 'エリア未設定') + '</div>';
          _curArea = item.area;
        }
        var tapIdx = taps.indexOf(item.uid);
        var isTapped = tapIdx >= 0;
        html += '<div class="order-tap-row' + (isTapped ? ' tapped' : '') +
          '" data-order-uid="' + esc(item.uid) + '">' +
          '<span class="order-tap-badge">' + (isTapped ? String(tapIdx + 1) : '') + '</span>' +
          '<span class="order-tap-name">' + esc(item.propertyName) + '</span>' +
        '</div>';
      });
      listEl.innerHTML = html;
    }

    function enterOrderMode() {
      S.orderMode = true;
      S.orderModeStaff = '';
      S.orderModeTaps  = [];

      var staffList = [];
      S.scheduleItems.forEach(function(i) {
        if (i.staff && staffList.indexOf(i.staff) < 0) staffList.push(i.staff);
      });
      staffList.sort();
      var sel = document.getElementById('order-mode-staff-sel');
      sel.innerHTML = '<option value="">-- スタッフを選ぶ --</option>' +
        staffList.map(function(s) {
          return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
        }).join('');
      sel.value = '';

      document.getElementById('order-mode-bar').hidden    = true;
      document.getElementById('sched-grouping-bar').hidden = true;
      document.getElementById('order-mode-panel').hidden  = false;
      document.getElementById('sched-list').hidden        = true;
      document.getElementById('board-date-sel').disabled  = true;
      document.getElementById('sched-search').disabled    = true;
      renderOrderModeList();
    }

    function exitOrderMode() {
      S.orderMode      = false;
      S.orderModeStaff = '';
      S.orderModeTaps  = [];

      document.getElementById('order-mode-panel').hidden  = true;
      document.getElementById('sched-list').hidden        = false;
      document.getElementById('board-date-sel').disabled  = false;
      document.getElementById('sched-search').disabled    = false;
      updateScheduleViewBars();
    }

    function confirmOrderMode() {
      var staff = S.orderModeStaff;
      if (!staff) { toast('スタッフを選んでください'); return; }

      var dateData = S.scheduleSearchByDate[S.boardDate];
      if (!dateData) { exitOrderMode(); return; }

      var taps = S.orderModeTaps;
      var staffItems = S.scheduleItems.filter(function(i) { return (i.staff || '') === staff; })
        .slice().sort(function(a, b) {
          var ar = areaRank(a.area) - areaRank(b.area);
          if (ar) return ar;
          return (a.order || 999) - (b.order || 999);
        });

      var tappedItems   = taps.map(function(uid) {
        return staffItems.find(function(i) { return i.uid === uid; });
      }).filter(Boolean);
      var untappedItems = staffItems.filter(function(i) { return taps.indexOf(i.uid) < 0; });

      var newOrders = {};
      tappedItems.forEach(function(item, idx)   { newOrders[item.uid] = idx + 1; });
      untappedItems.forEach(function(item, idx) { newOrders[item.uid] = tappedItems.length + idx + 1; });

      // 楽観的更新
      var oldOrders = {};
      dateData.items.forEach(function(i) { oldOrders[i.uid] = i.order; });
      [S.scheduleSearchItems, dateData.items, S.scheduleItems].forEach(function(arr) {
        arr.forEach(function(i) {
          if (newOrders[i.uid] !== undefined) i.order = newOrders[i.uid];
        });
      });
      applyScheduleDate(S.boardDate);
      exitOrderMode();
      renderScheduleList();

      var oldUpdatedAt = dateData.latestUpdatedAt;
      var rows = dateData.items.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });

      callApi({ action: 'saveAssignments', date: S.boardDate, rows: rows, knownUpdatedAt: oldUpdatedAt || '' })
        .then(function(r) {
          if (r.ok) {
            if (r.latestUpdatedAt) {
              dateData.latestUpdatedAt = r.latestUpdatedAt;
              S.scheduleAssignUpdatedAt = r.latestUpdatedAt;
            }
            toast('順番を保存しました。反映まで最大5分かかります');
            return;
          }
          // ロールバック
          [S.scheduleSearchItems, dateData.items, S.scheduleItems].forEach(function(arr) {
            arr.forEach(function(i) { if (oldOrders[i.uid] !== undefined) i.order = oldOrders[i.uid]; });
          });
          dateData.latestUpdatedAt = oldUpdatedAt;
          applyScheduleDate(S.boardDate);
          renderScheduleList();
          if (r.error === 'conflict') {
            toast('他の人が先に保存しました。再読込します');
            loadScheduleTab();
          } else {
            toast('順番の保存エラー: ' + (r.error || '不明'));
          }
        }).catch(function(e) {
          [S.scheduleSearchItems, dateData.items, S.scheduleItems].forEach(function(arr) {
            arr.forEach(function(i) { if (oldOrders[i.uid] !== undefined) i.order = oldOrders[i.uid]; });
          });
          dateData.latestUpdatedAt = oldUpdatedAt;
          applyScheduleDate(S.boardDate);
          renderScheduleList();
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('順番の保存エラー: ' + e.message);
        });
    }

    // ── 担当別表示 ──────────────────────────────────────────────────
    function renderScheduleListStaff() {
      var search       = S.scheduleSearchText.trim().toLowerCase();
      var isSearchMode = search.length > 0;
      var allItems;

      if (isSearchMode) {
        if (S.scheduleSearchLoading) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索中…</div>';
          return;
        }
        if (!S.scheduleSearchFetched) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索データを読み込み中…</div>';
          return;
        }
        allItems = S.scheduleSearchItems.filter(function(i) {
          return i.propertyName.toLowerCase().indexOf(search) >= 0;
        });
      } else {
        allItems = S.scheduleItems;
      }

      if (!allItems.length) {
        document.getElementById('sched-list').innerHTML = isSearchMode
          ? '<div class="msg">「' + esc(S.scheduleSearchText) + '」に一致する物件はありません</div>'
          : '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var pendingByUid = {};
      (S.lineRequests || []).forEach(function(lr) { if (lr.uid) pendingByUid[lr.uid] = lr; });

      // 日付ごとに担当グループを構成（検索モードは複数日）
      var dateList = [];
      var byDate   = {};
      allItems.forEach(function(item) {
        var d = isSearchMode ? item.date : S.boardDate;
        if (!byDate[d]) { byDate[d] = {}; dateList.push(d); }
        var s = item.staff || '';
        if (!byDate[d][s]) byDate[d][s] = [];
        byDate[d][s].push(item);
      });
      if (isSearchMode) dateList.sort();

      var html = '';
      dateList.forEach(function(dt) {
        if (isSearchMode) {
          html += '<div class="sched-date-label">' + esc(fmtDate(dt)) + '</div>';
        }
        var staffMap  = byDate[dt];
        var staffList = Object.keys(staffMap);
        // 未担当を最後、あとは名前順
        staffList.sort(function(a, b) {
          if (a === '') return 1;
          if (b === '') return -1;
          return a < b ? -1 : a > b ? 1 : 0;
        });

        staffList.forEach(function(staffName) {
          var sItems = staffMap[staffName].slice().sort(function(a, b) {
            return (a.order || 9999) - (b.order || 9999);
          });
          html += '<div class="sched-staff-label">' +
            esc(staffName || '未担当') + '（' + sItems.length + '件）</div>';

          sItems.forEach(function(item) {
            var key = item.propertyName + '\t' + item.date;
            var isExpanded = (S.scheduleExpandedKey === key);
            var isDetail   = (S.scheduleDetailKey   === key);
            var areaInline = item.area
              ? '<span class="sched-area-inline">エリア ' + esc(item.area) + '</span>'
              : '';
            html += buildSchedItemHtml(item, {
              isExpanded: isExpanded, isDetail: isDetail,
              showDateLabel: false,
              showResend: !isSearchMode && (dt === today() || dt === tomorrow()),
              pendingByUid: pendingByUid, areaInline: areaInline
            });
          });
        });
      });

      document.getElementById('sched-list').innerHTML = html;
    }

    var toastTimer;
    var CACHE_TTL_MS = 24 * 60 * 60 * 1000;
    var FRESH_MS     = 30 * 1000;

    function lsGet(key) {
      try {
        var raw = localStorage.getItem(key);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        if (!obj || typeof obj.ts !== 'number') return null;
        if (Date.now() - obj.ts > CACHE_TTL_MS) { localStorage.removeItem(key); return null; }
        return obj.data;
      } catch (e) { return null; }
    }

    function lsSet(key, data) {
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
    }

    function restoreProgressFromCache(c) {
      if (!c || !Array.isArray(c.progressItems)) return;
      S.progressItems           = c.progressItems;
      S.progressData            = c.progressData            || {};
      S.progressDefaults        = c.progressDefaults        || {};
      S.progressAssignUpdatedAt = c.progressAssignUpdatedAt || null;
      S.taskCounts              = c.taskCounts              || {};
      if (c.cleaners && c.cleaners.length) S.cleaners = c.cleaners;
      updateProgressStats();
      renderProgressStaff(S.progressItems);
      renderProgressBoard(S.progressItems);
    }

    function updateScheduleStats() {
      var sameDayN   = S.scheduleItems.filter(function(i) { return i.isSameDayIn; }).length;
      var notInN     = S.scheduleItems.filter(function(i) { return !i.isSameDayIn; }).length;
      var totalTasks = S.scheduleItems.reduce(function(acc, i) { return acc + i.taskCount; }, 0);
      document.getElementById('s-total').textContent     = S.scheduleItems.length;
      document.getElementById('s-samedayin').textContent = sameDayN;
      document.getElementById('s-notin').textContent     = notInN;
      document.getElementById('s-tasks').textContent     = totalTasks;
    }

    function restoreScheduleFromCache(c) {
      if (!c || !Array.isArray(c.scheduleItems)) return;
      S.scheduleItems           = c.scheduleItems;
      S.scheduleAssignUpdatedAt = c.scheduleAssignUpdatedAt || null;
      S.scheduleProgressData    = c.scheduleProgressData    || {};
      S.taskCounts              = c.taskCounts              || {};
      if (c.cleaners && c.cleaners.length) S.cleaners = c.cleaners;
      S.scheduleTasks = {};
      updateScheduleStats();
      renderScheduleList();
    }

    function restoreScheduleRangeFromCache(c) {
      if (!c || !Array.isArray(c.scheduleSearchItems)) return;
      S.scheduleSearchItems   = c.scheduleSearchItems;
      S.scheduleSearchByDate  = c.scheduleSearchByDate  || {};
      S.scheduleProgressData  = c.scheduleProgressData  || {};
      S.scheduleSearchFetched = true;
      S.isAdmin = true;
      if (c.cleaners && c.cleaners.length) S.cleaners = c.cleaners;
      applyScheduleDate(S.boardDate);
      updateScheduleStats();
      updateScheduleViewBars();
      renderScheduleList();
    }

    // byDate から S.scheduleItems・S.scheduleAssignUpdatedAt・S.taskCounts をセットしソートする
    function applyScheduleDate(date) {
      var dateData = S.scheduleSearchByDate[date] || { items: [], latestUpdatedAt: null };
      S.scheduleItems           = (dateData.items || []).slice();
      S.scheduleAssignUpdatedAt = dateData.latestUpdatedAt || null;
      S.taskCounts = {};
      S.scheduleItems.forEach(function(i) { S.taskCounts[i.propertyName] = i.taskCount; });
      S.scheduleTasks = {};
      S.scheduleItems.sort(function(a, b) {
        var ar = areaRank(a.area) - areaRank(b.area);
        if (ar) return ar;
        return (a.order || 999) - (b.order || 999);
      });
    }

    function toast(msg, ms) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.hidden = true; }, ms || 2500);
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function setBusy(v) {
      S.busy = v;
    }

    }

      clearInterval(S.progressTimer);
      S.progressTimer = null;
    }

      modal.hidden = false;

    // ── API ──────────────────────────────────────────────────────────
    function callApi(body) {
      body.idToken = S.idToken;
      return fetch(CFG.GAS_API_URL + '?api=1', {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify(body)
      }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(data) {
        if (data && data.error === 'unauthorized') {
          var err = new Error('unauthorized');
          err.isUnauthorized = true;
          throw err;
        }
        return data;
      });
    }

    // ── 物件名検索：複数日データ取得 ─────────────────────────────────
    function loadScheduleSearchData() {
      // 範囲データは loadScheduleTab が取得済み。未取得なら取得を開始して描画を待つ。
      if (!S.scheduleSearchFetched && !S.scheduleSearchLoading) {
        loadScheduleTab();
      } else {
        renderScheduleList();
      }
    }

    // ── 手入力予約パネル ──────────────────────────────────────────────
    function openManualPanel() {
      document.getElementById('panel-schedule').hidden = true;
      document.getElementById('panel-manual').hidden   = false;
      loadManualReservations();
    }

    function closeManualPanel() {
      document.getElementById('panel-manual').hidden   = true;
      document.getElementById('panel-schedule').hidden = false;
    }

    function loadManualReservations() {
      if (S.sessionExpired) return;
      S.manualLoading = true;
      renderManualList();
      callApi({ action: 'getManualReservations' }).then(function(data) {
        S.manualLoading = false;
        if (!data.ok) { S.manualReservations = null; renderManualList(); return; }
        S.manualReservations     = data.reservations     || [];
        S.manualPendingRequests  = data.pendingRequests  || [];
        renderManualList();
      }).catch(function() {
        S.manualLoading = false;
        S.manualReservations = null;
        renderManualList();
      });
    }

    function loadManualPropertyCandidates() {
      if (S.manualCandidatesLoaded) { renderManualPropSelect(); return; }
      callApi({ action: 'getManualPropertyCandidates' }).then(function(data) {
        if (!data.ok) return;
        S.manualCandidates      = data.candidates     || [];
        S.manualAllProperties   = data.allProperties  || [];
        S.manualCandidatesLoaded = true;
        if (S.manualCandidates.length === 0) S.manualShowAllProps = true;
        renderManualPropSelect();
      }).catch(function() {});
    }

    function renderManualPropSelect() {
      var sel = document.getElementById('manual-form-prop');
      if (!sel) return;
      var list = S.manualShowAllProps ? S.manualAllProperties : (S.manualCandidates || []);
      var cur  = sel.value;
      sel.innerHTML = '<option value="">-- 物件を選ぶ --</option>' +
        list.map(function(p) {
          return '<option value="' + esc(p) + '"' + (p === cur ? ' selected' : '') + '>' + esc(p) + '</option>';
        }).join('');
      var tog = document.getElementById('manual-prop-toggle-all');
      if (tog) tog.textContent = S.manualShowAllProps ? '← 候補のみ表示' : 'すべての物件から選ぶ';
    }

    function manualBadgeHtml(uid) {
      var prs = S.manualPendingRequests || [];
      for (var i = 0; i < prs.length; i++) {
        var pr = prs[i];
        if (pr.uid !== uid) continue;
        var k = String(pr.kind || '').toUpperCase();
        var res = String(pr.result || '').toUpperCase();
        if (res === 'ERROR') return '<span class="manual-badge badge-error">エラー</span>';
        if (k === 'MANUAL_ADD')    return '<span class="manual-badge badge-add-pending">追加待ち</span>';
        if (k === 'MANUAL_CHANGE') return '<span class="manual-badge badge-change-pending">変更待ち</span>';
        if (k === 'MANUAL_CANCEL') return '<span class="manual-badge badge-cancel-pending">キャンセル待ち</span>';
      }
      return '';
    }

    function getFilteredManualList() {
      var all = (S.manualReservations || []).slice();
      if (S.manualFilterProp) {
        all = all.filter(function(r) { return r.propName === S.manualFilterProp; });
      }
      if (S.manualFilterRange === 'this-month' || S.manualFilterRange === 'next-month') {
        var now = new Date();
        // 来月は必ず翌月1日から求める（月末で setMonth すると翌々月になるバグを防ぐ）
        var base = (S.manualFilterRange === 'next-month')
          ? new Date(now.getFullYear(), now.getMonth() + 1, 1)
          : now;
        var ym = base.getFullYear() + '-' + String(base.getMonth() + 1).padStart(2, '0');
        all = all.filter(function(r) { return r.dtend.slice(0, 7) === ym; });
      }
      return all;
    }

    function renderManualFilterBar() {
      var bar = document.getElementById('manual-filter-bar');
      if (!bar) return;
      var reservations = S.manualReservations || [];
      var formOpen = !document.getElementById('manual-add-section').hidden
                  || !document.getElementById('manual-bulk-section').hidden;
      if (!reservations.length || formOpen) { bar.hidden = true; return; }
      bar.hidden = false;

      // まとめて追加ボタン（物件が絞り込まれているときだけ表示）
      var bulkBtn = document.getElementById('btn-manual-bulk');
      if (bulkBtn) bulkBtn.hidden = !S.manualFilterProp;

      // 物件 select を再生成
      var sel = document.getElementById('manual-filter-prop');
      if (sel) {
        var props = [];
        reservations.forEach(function(r) {
          if (props.indexOf(r.propName) < 0) props.push(r.propName);
        });
        props.sort();
        // 選択中の物件が消えた場合はリセット
        if (S.manualFilterProp && props.indexOf(S.manualFilterProp) < 0) {
          S.manualFilterProp = '';
        }
        var cur = S.manualFilterProp;
        sel.innerHTML = '<option value="">すべての物件</option>' +
          props.map(function(p) {
            return '<option value="' + esc(p) + '"' + (p === cur ? ' selected' : '') + '>' + esc(p) + '</option>';
          }).join('');
      }

      // 件数ラベル
      var countEl = document.getElementById('manual-filter-count');
      if (countEl) {
        var filtered = getFilteredManualList();
        var label = S.manualFilterProp ? S.manualFilterProp + ': ' : '全 ';
        countEl.textContent = label + filtered.length + '件';
      }

      // 範囲ボタンの active 状態
      bar.querySelectorAll('.manual-range-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.range === S.manualFilterRange);
      });
    }

    function renderManualList() {
      var el = document.getElementById('manual-list');
      if (!el) return;
      renderManualFilterBar();
      if (S.manualLoading) {
        el.innerHTML = '<div class="manual-loading"><span class="spin">↻</span> 読み込み中…</div>';
        return;
      }
      if (S.manualReservations === null) {
        el.innerHTML = '<div class="manual-error">読み込みに失敗しました</div>';
        return;
      }
      if (!S.manualReservations.length) {
        el.innerHTML = '<div class="manual-empty">手入力予約はありません</div>';
        return;
      }
      var list = getFilteredManualList();
      if (!list.length) {
        el.innerHTML = '<div class="manual-empty">この条件に一致する予約はありません</div>';
        return;
      }
      var html = '';
      list.forEach(function(r) {
        var isSpotRow  = !!(r.note && r.note.startsWith('[SPOT]'));
        var chkin      = (!isSpotRow && r.dtstart) ? 'チェックイン: ' + esc(r.dtstart) : '';
        var chkout     = (isSpotRow ? '清掃日: ' : 'チェックアウト: ') + esc(r.dtend);
        var sameDayStr = (!isSpotRow && r.sameDay) ? ' / 同日イン: あり' : '';
        var meta = [];
        if (!isSpotRow) {
          if (r.guestName) meta.push(esc(r.guestName));
          if (r.note)      meta.push(esc(r.note));
        }
        var spotBadge = isSpotRow ? '<span class="manual-spot-badge">スポット</span>' : '';
        var badge = manualBadgeHtml(r.uid);
        var isChanging = (S.manualChangeUid === r.uid);
        html += '<div class="manual-row" data-uid="' + esc(r.uid) + '">';
        html += '<div class="manual-row-prop">' + esc(r.propName) + spotBadge + badge + '</div>';
        html += '<div class="manual-row-dates">';
        if (chkin) html += chkin + ' / ';
        html += chkout + sameDayStr;
        html += '</div>';
        if (meta.length) html += '<div class="manual-row-meta">' + meta.join(' ／ ') + '</div>';
        if (r.uid) {
          html += '<div class="manual-row-actions">';
          html += '<button class="btn-manual-chg" data-uid="' + esc(r.uid) + '">変更</button>';
          html += '<button class="btn-manual-del" data-uid="' + esc(r.uid) + '" data-prop="' + esc(r.propName) + '">キャンセル</button>';
          html += '</div>';
          if (isChanging) {
            html += '<div class="manual-inline-change" id="manual-change-form-' + esc(r.uid) + '">';
            html += '<label>新しいチェックアウト日</label>';
            html += '<input type="date" id="manual-change-dtend-' + esc(r.uid) + '" value="' + esc(r.dtend) + '">';
            html += '<div class="manual-inline-change-btns">';
            html += '<button class="btn-manual-save btn-manual-change-submit" data-uid="' + esc(r.uid) + '" data-prop="' + esc(r.propName) + '" style="font-size:0.78rem">保存</button>';
            html += '<button class="btn-manual-form-cancel btn-manual-change-close" data-uid="' + esc(r.uid) + '" style="font-size:0.78rem">閉じる</button>';
            html += '</div></div>';
          }
        }
        html += '</div>';
      });
      el.innerHTML = html;

      // イベント委任でボタンを処理
      el.querySelectorAll('.btn-manual-chg').forEach(function(btn) {
        btn.onclick = function() { openManualChangeInline(btn.dataset.uid); };
      });
      el.querySelectorAll('.btn-manual-del').forEach(function(btn) {
        btn.onclick = function() { cancelManualReservation(btn.dataset.uid, btn.dataset.prop); };
      });
      el.querySelectorAll('.btn-manual-change-submit').forEach(function(btn) {
        btn.onclick = function() { submitManualChange(btn.dataset.uid, btn.dataset.prop); };
      });
      el.querySelectorAll('.btn-manual-change-close').forEach(function(btn) {
        btn.onclick = function() { S.manualChangeUid = null; renderManualList(); };
      });
    }

    function setManualType(isSpot) {
      S.manualIsSpot = isSpot;
      document.getElementById('manual-type-normal').classList.toggle('active', !isSpot);
      document.getElementById('manual-type-spot').classList.toggle('active',   isSpot);
      document.getElementById('manual-row-dtstart').hidden  = isSpot;
      document.getElementById('manual-row-title').hidden    = !isSpot;
      document.getElementById('manual-row-preview').hidden  = !isSpot;
      document.getElementById('manual-row-sameday').hidden  = isSpot;

    var BULK_MAX_ROWS = 31;

    function openManualBulkSection() {
      S.manualChangeUid = null;
      S.bulkRows = [
        { dtstart: '', dtend: '', sameDay: false, status: null, includeDup: false },
        { dtstart: '', dtend: '', sameDay: false, status: null, includeDup: false },
        { dtstart: '', dtend: '', sameDay: false, status: null, includeDup: false }
      ];

      if (nameEl) nameEl.textContent = S.manualFilterProp;

      document.getElementById('btn-manual-add').hidden = true;

    function closeManualBulkSection() {

    function syncBulkRowsFromDOM() {
      var container = document.getElementById('bulk-rows-container');
      if (!container) return;
      S.bulkRows.forEach(function(row, i) {
        var rowEl = container.querySelector('.bulk-row[data-row-idx="' + i + '"]');
        if (!rowEl) return;
        row.dtstart = rowEl.querySelector('.bulk-dtstart').value;
        row.dtend   = rowEl.querySelector('.bulk-dtend').value;
        var dupCheck = rowEl.querySelector('.bulk-dup-check');
        if (dupCheck) row.includeDup = dupCheck.checked;
      });
    }

    function computeBulkRowError(row) {
      if (!row.dtend) return null;
      if (row.dtend < today()) return '過去日は登録できません';
      if (row.dtstart && row.dtstart >= row.dtend) return 'チェックイン日はチェックアウト日より前にしてください';
      return null;
    }

    function computeBulkRowDup(row, rowIdx) {
      if (!row.dtend || computeBulkRowError(row)) return false;
      var propName = S.manualFilterProp;
      var reservations = S.manualReservations || [];
      for (var i = 0; i < reservations.length; i++) {
        if (reservations[i].propName === propName && reservations[i].dtend === row.dtend) return true;
      }
      var pending = S.manualPendingRequests || [];
      for (var j = 0; j < pending.length; j++) {
        if (pending[j].kind !== 'MANUAL_ADD') continue;
        if (pending[j].propName === propName && pending[j].dtend === row.dtend) return true;
      }
      for (var k = 0; k < S.bulkRows.length; k++) {
        if (k === rowIdx) continue;
        if (S.bulkRows[k].dtend && S.bulkRows[k].dtend === row.dtend) return true;
      }
      return false;
    }

    function renderBulkRows() {
      var container = document.getElementById('bulk-rows-container');
      if (!container) return;
      var rows = S.bulkRows;
      var html = '';
      rows.forEach(function(row, i) {
        var err    = row.status ? null : computeBulkRowError(row);
        var isDup  = row.status ? false : computeBulkRowDup(row, i);
        var savedClass = (row.status === 'ok') ? ' bulk-row-saved' : '';
        html += '<div class="bulk-row' + savedClass + '" data-row-idx="' + i + '">';
        html += '<div style="font-size:0.76rem;color:var(--muted);margin-bottom:0.3rem;">' + (i + 1) + '件目</div>';
        html += '<div class="bulk-row-inputs">';
        html += '<div style="flex:1 1 110px;min-width:0">';
        html += '<div class="bulk-date-label">チェックイン日（任意）</div>';
        html += '<input type="date" class="bulk-date-input bulk-dtstart" value="' + esc(row.dtstart) + '">';
        html += '</div>';
        html += '<div style="flex:1 1 110px;min-width:0">';
        html += '<div class="bulk-date-label">チェックアウト日 <span style="color:#c62828">*</span></div>';
        html += '<input type="date" class="bulk-date-input bulk-dtend" value="' + esc(row.dtend) + '">';
        html += '</div>';
        html += '<div style="display:flex;gap:0.3rem;align-items:flex-end">';
        html += '<button class="bulk-sameday-btn' + (row.sameDay ? ' on' : '') + '" data-action="sameday">同日: ' + (row.sameDay ? 'YES' : 'NO') + '</button>';
        if (rows.length > 1) {
          html += '<button class="bulk-del-btn" data-action="del">削除</button>';
        }
        html += '</div>';
        html += '</div>';
        if (row.status === 'ok') {
          html += '<div class="bulk-row-status-ok">✓ 保存しました</div>';
        } else if (row.status === 'fail') {
          html += '<div class="bulk-row-status-fail">保存に失敗しました</div>';
        } else if (err) {
          html += '<div class="bulk-row-error" data-bulk-err>' + esc(err) + '</div>';
        } else if (isDup) {
          html += '<div class="bulk-row-warn">';
          html += '<label><input type="checkbox" class="bulk-dup-check"' + (row.includeDup ? ' checked' : '') + '> ';
          html += 'この清掃日に同じ物件の予約が既にあります。保存する</label>';
          html += '</div>';
        }
        html += '</div>';
      });
      container.innerHTML = html;
      var addRowBtn = document.getElementById('btn-bulk-add-row');
      if (addRowBtn) addRowBtn.hidden = (rows.length >= BULK_MAX_ROWS);
    }

    function submitBulkSave() {
      var propName = S.manualFilterProp;
      if (!propName) return;
      syncBulkRowsFromDOM();

      var hasError = false;
      S.bulkRows.forEach(function(row) {
        if (!row.dtend) return;
        if (computeBulkRowError(row)) hasError = true;
      });
      renderBulkRows();
      if (hasError) { toast('入力エラーがあります。確認してください。'); return; }

      var toSave = [];
      S.bulkRows.forEach(function(row, i) {
        if (!row.dtend) return;
        if (computeBulkRowError(row)) return;
        if (computeBulkRowDup(row, i) && !row.includeDup) return;
        if (row.status === 'ok') return;
        toSave.push(i);
      });
      if (!toSave.length) {
        toast('保存する行がありません（重複のある行はチェックを入れてください）');
        return;
      }

      var saveBtn = document.getElementById('btn-bulk-save');
      saveBtn.disabled = true;
      var progress = document.getElementById('bulk-progress');
      progress.hidden = false;
      var total = toSave.length;
      var saved = 0;
      var k = 0;

      function saveNext() {
        if (k >= total) {
          saveBtn.disabled = false;
          progress.textContent = saved + '/' + total + '件 保存しました';
          if (saved === total) {
            setTimeout(function() { closeManualBulkSection(); loadManualReservations(); }, 800);
          } else {
            toast(saved + '件保存済み。失敗した行を確認してください。');
          }
          return;
        }
        progress.textContent = (k + 1) + '/' + total + '件 保存中…';
        var rowIdx = toSave[k];
        var row = S.bulkRows[rowIdx];
        k++;
        callApi({
          action: 'saveManualReservation', kind: 'MANUAL_ADD',
          propertyName: propName, dtstart: row.dtstart, dtend: row.dtend,
          sameDay: row.sameDay ? 'Yes' : 'No', guestName: '', memo: '', isSpot: false
        }).then(function(result) {
          S.bulkRows[rowIdx].status = result.ok ? 'ok' : 'fail';
          if (result.ok) {
            saved++;
            // 成功行を即時重複判定に反映（bulkRows の兄弟行チェックを有効にする）
            if (!S.manualPendingRequests) S.manualPendingRequests = [];
            S.manualPendingRequests.push({ kind: 'MANUAL_ADD', propName: propName, dtend: row.dtend });
          }
          renderBulkRows();
          saveNext();
        }).catch(function() {
          S.bulkRows[rowIdx].status = 'fail';
          renderBulkRows();
          saveNext();
        });
      }
      saveNext();
    }

    function updateSameDayToggle() {
      var btn = document.getElementById('manual-form-sameday');
      if (!btn) return;
      btn.textContent = S.manualSameDay ? 'YES' : 'NO';
      btn.classList.toggle('on', S.manualSameDay);
    }

    function hasDuplicateManual(propName, dtend, excludeUid) {
      var reservations = S.manualReservations || [];
      for (var i = 0; i < reservations.length; i++) {
        var r = reservations[i];
        if (excludeUid && r.uid === excludeUid) continue;
        if (r.propName === propName && r.dtend === dtend) return true;
      }
      var pending = S.manualPendingRequests || [];
      for (var j = 0; j < pending.length; j++) {
        var p = pending[j];
        if (p.kind !== 'MANUAL_ADD') continue;
        if (p.propName === propName && p.dtend === dtend) return true;
      }
      // 今のセッションで保存成功した行（loadManualReservations で消えない）
      var localAdds = S.manualLocalAdds || [];
      for (var k = 0; k < localAdds.length; k++) {
        if (localAdds[k].propName === propName && localAdds[k].dtend === dtend) return true;
      }
      return false;
    }

    function submitManualAdd(continueAdding) {
      var basePropName = document.getElementById('manual-form-prop').value.trim();
      var dtend        = document.getElementById('manual-form-dtend').value.trim();
      var isSpot       = S.manualIsSpot;

      if (!basePropName) { toast('物件名を選んでください'); return; }
      if (!dtend)        { toast('チェックアウト日（清掃日）を入力してください'); return; }
      if (dtend < today()) { toast('チェックアウト日は今日以降にしてください'); return; }

      var propName, dtstart, sameDay, guestName, memo;
      if (isSpot) {
        var content = document.getElementById('manual-form-title').value.trim();
        if (!content) { toast('対応内容を入力してください'); return; }
        propName  = basePropName + content;
        dtstart   = '';
        sameDay   = 'No';
        guestName = '';
        memo      = '[SPOT]';
      } else {
        propName  = basePropName;
        dtstart   = document.getElementById('manual-form-dtstart').value.trim();
        sameDay   = S.manualSameDay ? 'Yes' : 'No';
        guestName = document.getElementById('manual-form-guest').value.trim();
        memo      = document.getElementById('manual-form-memo').value.trim();
      }

      var dupWarnId = continueAdding ? 'manual-dup-warning-cont' : 'manual-dup-warning';
      var dupMsgId  = continueAdding ? 'manual-dup-msg-cont'     : 'manual-dup-msg';
      var forceId   = continueAdding ? 'btn-dup-force-save-cont' : 'btn-dup-force-save';

      document.getElementById('manual-dup-warning').hidden      = true;
      document.getElementById('manual-dup-warning-cont').hidden = true;

      if (hasDuplicateManual(propName, dtend, null)) {
        var dupLabel = isSpot ? 'スポット' : '予約';
        document.getElementById(dupMsgId).textContent =
          'この清掃日に同じ物件の' + dupLabel + 'が既にあります。それでも保存しますか？';
        document.getElementById(dupWarnId).hidden = false;
        document.getElementById(forceId).onclick = function() {
          document.getElementById(dupWarnId).hidden = true;
          doSaveManualAdd(propName, dtstart, dtend, sameDay, guestName, memo, continueAdding, isSpot);
        };
        return;
      }
      doSaveManualAdd(propName, dtstart, dtend, sameDay, guestName, memo, continueAdding, isSpot);
    }

    function doSaveManualAdd(propName, dtstart, dtend, sameDay, guestName, memo, continueAdding, isSpot) {
      callApi({
        action: 'saveManualReservation', kind: 'MANUAL_ADD',
        propertyName: propName, dtstart: dtstart, dtend: dtend,
        sameDay: sameDay, guestName: guestName, memo: memo,
        isSpot: !!isSpot
      }).then(function(data) {
        if (!data.ok) {
          if (continueAdding) {
            appendManualAddLog('✗ 保存に失敗しました: ' + (data.error || '不明'), true);
          } else {
            toast('保存エラー: ' + (data.error || '不明'));
          }
          return;
        }
        // 保存成功直後にローカルリストに追加して重複判定をすぐ有効にする（loadManualReservations で消えない）
        if (!S.manualLocalAdds) S.manualLocalAdds = [];
        S.manualLocalAdds.push({ propName: propName, dtend: dtend });

        if (continueAdding) {
          var dateLabel = dtend.slice(5, 10).replace('-', '/');
          appendManualAddLog('✓ ' + propName + ' ' + dateLabel + ' を追加しました（反映待ち）');
          // 物件名以外をすべてクリア
          document.getElementById('manual-form-dtstart').value = '';
          document.getElementById('manual-form-dtend').value   = '';
          document.getElementById('manual-form-title').value   = '';
          document.getElementById('manual-form-guest').value   = '';
          document.getElementById('manual-form-memo').value    = '';
          S.manualSameDay = false;
          updateSameDayToggle();
          document.getElementById('manual-dup-warning-cont').hidden = true;
        } else {
          toast('登録しました。この一覧への反映には最大5分かかります。清掃スケジュールへの反映には最大1時間かかります。', 5000);
          closeManualAddSection();
        }
        loadManualReservations();
      }).catch(function(e) {
        if (continueAdding) {
          appendManualAddLog('✗ 保存エラー: ' + e.message, true);
        } else {
          toast('保存エラー: ' + e.message);
        }
      });
    }

    function submitManualChange(uid, propName) {

      });
