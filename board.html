    // ── 今後の清掃予定タブ ────────────────────────────────────────────
    // getScheduleRange(today〜+90) を一度取得して S.scheduleSearchItems/ByDate に保持する。
    // 日付切り替えは保持データから applyScheduleDate() でノーコスト切替。
    function loadScheduleTab(silent) {
      if (S.sessionExpired) return;
      if (silent) {
        if (_staffPendingSchedule || S.scheduleDetailKey ||
            !document.getElementById('task-modal').hidden ||
            !document.getElementById('task-drawer').hidden) return;
      } else {
        var _sc = lsGet('dh_schedule_range');
        if (_sc) {
          restoreScheduleRangeFromCache(_sc);
        } else {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';
        }
      }

      S.scheduleSearchLoading = true;

      var fromDate = today();
      var _d90 = new Date();
      _d90.setDate(_d90.getDate() + 90);
      var toDate = _d90.getFullYear() + '-' +
        String(_d90.getMonth() + 1).padStart(2, '0') + '-' +
        String(_d90.getDate()).padStart(2, '0');

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      var progressProm = callApi({ action: 'getProgress', date: fromDate });

      return Promise.all([
        callApi({ action: 'getScheduleRange', fromDate: fromDate, toDate: toDate }),
        cleanerProm,
        progressProm
      ]).then(function(res) {
        var sr = res[0], cr = res[1], pr = res[2];
        S.scheduleSearchLoading = false;
        if (cr && cr.ok) S.cleaners = cr.cleaners;
        if (!sr.ok) { toast('スケジュールの読み込みに失敗しました'); return; }

        S.scheduleSearchItems   = sr.items  || [];
        S.scheduleSearchByDate  = sr.byDate || {};
        S.scheduleSearchFetched = true;
        S.isAdmin = true;
        S.lineRequests = sr.lineRequests || [];

        // 今日の DONE チェック用
        S.scheduleProgressData = {};
        if (pr && pr.ok) {
          (pr.progress || []).forEach(function(p) {
            S.scheduleProgressData[String(p.property || '').trim()] = p;
          });
          S.progressDefaults = pr.defaults || {};
        }

        applyScheduleDate(S.boardDate);
        updateScheduleStats();

        var now = new Date();
        document.getElementById('refresh-note').textContent =
          '最終更新: ' + now.getHours() + ':' +
          String(now.getMinutes()).padStart(2, '0') + '  ／  30秒ごとに自動更新';

        S.scheduleFetchedAt = Date.now();
        lsSet('dh_schedule_range', {
          scheduleSearchItems:  S.scheduleSearchItems,
          scheduleSearchByDate: S.scheduleSearchByDate,
          scheduleProgressData: S.scheduleProgressData,
          cleaners:             S.cleaners
        });

        updateScheduleViewBars();
        renderScheduleList();
      }).catch(function(e) {
        S.scheduleSearchLoading = false;
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('スケジュール読み込みエラー: ' + e.message);
      });
    }

    var SEARCH_MAX = 30;

    function renderScheduleList() {
      if (S.scheduleGrouping === 'staff') { renderScheduleListStaff(); return; }
      var search       = S.scheduleSearchText.trim().toLowerCase();
      var isSearchMode = search.length > 0;
      var items;

      if (isSearchMode) {
        if (S.scheduleSearchLoading) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索中…</div>';
          return;
        }
        if (!S.scheduleSearchFetched) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索データを読み込み中…</div>';
          return;
        }
        items = S.scheduleSearchItems.filter(function(i) {
          return i.propertyName.toLowerCase().indexOf(search) >= 0;
        }).sort(function(a, b) {
          if (a.date < b.date) return -1;
          if (a.date > b.date) return 1;
          var ar = areaRank(a.area) - areaRank(b.area);
          if (ar) return ar;
          return (a.order || 999) - (b.order || 999);
        });
      } else {
        items = S.scheduleItems;
      }

      if (!items.length) {
        document.getElementById('sched-list').innerHTML = isSearchMode
          ? '<div class="msg">「' + esc(S.scheduleSearchText) + '」に一致する物件はありません</div>'
          : '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var moreCount   = isSearchMode ? Math.max(0, items.length - SEARCH_MAX) : 0;
      var displayItems = isSearchMode ? items.slice(0, SEARCH_MAX) : items;
      var showResend  = isSearchMode ? false : (S.boardDate === today() || S.boardDate === tomorrow());

      var pendingByUid = {};
      (S.lineRequests || []).forEach(function(lr) { if (lr.uid) pendingByUid[lr.uid] = lr; });

      var html = '';
      var _curArea = null, _curAreaDate = null;
      displayItems.forEach(function(item) {
        var pn     = item.propertyName;
        var key    = pn + '\t' + item.date;
        var isExpanded = (S.scheduleExpandedKey === key);
        var isDetail   = (S.scheduleDetailKey   === key);

        var itemDate = isSearchMode ? item.date : null;
        if (item.area !== _curArea || itemDate !== _curAreaDate) {
          html += '<div class="area-label">' +
            esc(item.area ? 'エリア ' + item.area : 'エリア未設定') + '</div>';
          _curArea = item.area;
          _curAreaDate = itemDate;
        }

        html += buildSchedItemHtml(item, {
          isExpanded: isExpanded, isDetail: isDetail,
          showDateLabel: isSearchMode, showResend: showResend,
          pendingByUid: pendingByUid, areaInline: ''
        });
      });

      if (moreCount > 0) {
        html += '<div class="sched-search-more">他にも ' + moreCount + ' 件あります</div>';
      }

      document.getElementById('sched-list').innerHTML = html;
    }

    function buildSchedItemHtml(item, opts) {
      var isExpanded    = opts.isExpanded;
      var isDetail      = opts.isDetail;
      var showDateLabel = opts.showDateLabel;
      var showResend    = opts.showResend;
      var pendingByUid  = opts.pendingByUid || {};
      var areaInline    = opts.areaInline   || '';

      var pn     = item.propertyName;
      var key    = pn + '\t' + item.date;
      var keyEsc = esc(key);
      var pnEsc  = esc(pn);
      var uid    = item.uid || '';

        var typeBadge = item.isSameDayIn
          ? '<span class="sched-type-badge-in">同日イン</span>'
          : '<span class="sched-type-badge-out">インなし</span>';

        var staffLabel = item.staff || '';
        var staffCls   = staffLabel ? 'sched-staff' : 'sched-staff unassigned';
        var staffText  = staffLabel || '未担当';

        var taskBadge = item.taskCount > 0
          ? '<span class="sched-task-cnt">対応' + item.taskCount + '件</span>'
          : '';

        var dateBadge = '';
        var pendingLr = uid ? pendingByUid[uid] : null;
        if (pendingLr) {
          if (pendingLr.result === 'PENDING') dateBadge = '<span class="sched-status-badge pending">反映待ち（最大5分）</span>';
          else if (pendingLr.result === 'ERROR') dateBadge = '<span class="sched-status-badge error">反映に失敗</span>';
        } else if (item.source === 'MANUAL') {
          dateBadge = '<span class="sched-status-badge manual">手入力</span>';
        } else if (item.finalReason === '手動で清掃日変更'
                   || (item.manualDate && item.manualDate !== item.autoDate)) {
          dateBadge = '<span class="sched-status-badge changed">変更済み</span>';
        }

        var dateLabel = showDateLabel
          ? '<span class="sched-date-label">' + esc(fmtDate(item.date)) + '</span>'
          : '';

        var orderNum = (item.order > 0)
          ? '<span class="sched-order-num">' + item.order + '</span>'
          : '';

      var h = '<div class="sched-row' + (isExpanded ? ' expanded' : '') + '" data-sched-key="' + keyEsc + '">';
      h += '<div class="sched-row-main" data-sched-toggle="' + keyEsc + '">' +
          dateLabel +
          orderNum +
          '<span class="sched-prop-name">' + pnEsc + '</span>' +
          areaInline +
          typeBadge +
          '<span class="' + staffCls + '">' + esc(staffText) + '</span>' +
          taskBadge +
          dateBadge +
          '<span class="sched-chevron">▼</span>' +
        '</div>';

        if (isExpanded) {
          // 担当変更セレクト
          var isDone = S.scheduleProgressData[pn] && S.scheduleProgressData[pn].status === 'DONE';
          var selOpts = '<option value=""' + (!item.staff ? ' selected' : '') + '>未担当</option>';
          S.cleaners.forEach(function(c) {
            selOpts += '<option value="' + esc(c.name) + '"' +
              (item.staff === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>';
          });

          h += '<div class="sched-expand">';
          h += '<div class="sched-assign-section">' +
            '<span class="sched-assign-label">担当：</span>' +
            '<select class="sched-staff-sel" data-sched-assign-key="' + keyEsc + '"' +
              (isDone ? ' disabled' : '') + '>' + selOpts + '</select>' +
          '</div>';
          h += '<button class="sched-detail-btn" data-sched-detail-key="' + keyEsc + '">' +
            (isDetail ? '▲ 詳細設定を閉じる' : '▼ 詳細設定') +
          '</button>';

          if (isDetail) {
            h += '<div class="sched-tasks-section">';
            var tasks = S.scheduleTasks[pn];
            if (!tasks) {
              h += '<div class="sched-tasks-empty">読み込み中…</div>';
            } else if (!tasks.length) {
              h += '<div class="sched-tasks-empty">OPEN の対応はありません</div>';
            } else {
              var todayYmd = today();
              tasks.forEach(function(t) {
                var dateLabel = t.targetMode === 'NEXT'
                  ? '次回清掃' + (t.boundDate ? '（' + t.boundDate + '）' : '')
                  : (t.targetDate || '');
                var expired = t.targetMode === 'DATE' && t.targetDate && t.targetDate < todayYmd;
                h += '<div class="sched-task-item">' +
                  '<div class="task-item-header">' +
                    '<span class="task-type-badge">' + esc(t.type) + '</span>' +
                    '<span class="task-date-label">' + esc(dateLabel) + '</span>' +
                    (expired ? '<span class="task-expired-label">期限切れ</span>' : '') +
                  '</div>' +
                  '<div class="task-content">' + esc(t.content) + '</div>' +
                  (t.photoRequired ? '<div class="task-photo-tag">📷 写真必要</div>' : '') +
                  '<div class="task-actions">' +
                    '<button class="btn-task-done" data-sched-tid="' + esc(t.taskId) + '" data-sched-prop="' + pnEsc + '">完了</button>' +
                    '<button class="btn-task-cancel" data-sched-tid="' + esc(t.taskId) + '" data-sched-prop="' + pnEsc + '">取消</button>' +
                  '</div>' +
                '</div>';
              });
            }
            h += '<button class="btn-sched-add-task" data-sched-add-prop="' + pnEsc + '" data-sched-add-date="' + esc(item.date) + '">＋ 対応追加</button>';
            if (showResend) {
              h += '<button class="btn-sched-resend" data-sched-resend-prop="' + pnEsc + '">再送</button>';
            }
            var defs = S.progressDefaults[pn] || {};
            var checkIsOn = defs.checkDefault === 'NEED';
            var trashIsOn = defs.trashDefault === 'NEED';
            h += '<div class="sched-default-section">' +
              '<div class="sched-default-label">初期値（清掃開始時の既定）</div>' +
              '<div class="sched-default-row">' +
                '<span class="sched-default-name">チェック要</span>' +
                '<button class="btn-sched-default' + (checkIsOn ? ' is-on' : '') + '"' +
                  ' data-sched-default-prop="' + pnEsc + '" data-sched-default-field="checkDefault"' +
                  ' data-sched-default-val="' + (checkIsOn ? 'NEED' : '') + '">' +
                  (checkIsOn ? 'ON' : 'OFF') +
                '</button>' +
              '</div>' +
              '<div class="sched-default-row">' +
                '<span class="sched-default-name">ゴミ要回収</span>' +
                '<button class="btn-sched-default' + (trashIsOn ? ' is-on' : '') + '"' +
                  ' data-sched-default-prop="' + pnEsc + '" data-sched-default-field="trashDefault"' +
                  ' data-sched-default-val="' + (trashIsOn ? 'NEED' : '') + '">' +
                  (trashIsOn ? 'ON' : 'OFF') +
                '</button>' +
              '</div>' +
            '</div>';
            // 日程変更セクション（iCal 予約のみ）
            if (item.source !== 'MANUAL') {
              var tomorrowYmd = tomorrow();
              var canChange = item.autoDate && item.autoDate >= tomorrowYmd;
              h += '<div class="sched-date-change-section">' +
                '<div class="sched-date-change-label">日程変更</div>';
              if (canChange) {
                h += '<div class="sched-date-change-row">' +
                  '<label>ICS 日付</label>' +
                  '<span>' + esc(fmtDate(item.autoDate)) + '</span>' +
                '</div>';
                if (item.manualDate) {
                  h += '<div class="sched-date-change-row">' +
                    '<label>現在の設定</label>' +
                    '<span>' + esc(fmtDate(item.manualDate)) + '</span>' +
                    '<button class="btn-sched-clear-date"' +
                      ' data-sched-uid="' + esc(uid) + '"' +
                      ' data-sched-pn="' + pnEsc + '"' +
                      ' data-sched-old="' + esc(item.manualDate) + '">' +
                      '元に戻す' +
                    '</button>' +
                  '</div>';
                }
                h += '<div class="sched-date-change-row">' +
                  '<label>変更後の日付</label>' +
                  '<input type="date" class="sched-new-date-input"' +
                    ' data-sched-uid="' + esc(uid) + '"' +
                    ' min="' + esc(tomorrowYmd) + '">' +
                  '<button class="btn-sched-change-date"' +
                    ' data-sched-uid="' + esc(uid) + '"' +
                    ' data-sched-pn="' + pnEsc + '"' +
                    ' data-sched-old="' + esc(item.autoDate) + '">' +
                    '変更する' +
                  '</button>' +
                '</div>';
              } else {
                h += '<div class="sched-date-change-row">' +
                  '<span style="font-size:0.8rem;color:var(--muted)">日程変更は明日以降の清掃のみ可能です</span>' +
                '</div>';
              }
              h += '</div>';
            }
            h += '</div>';
          }
          h += '</div>';
        }
        h += '</div>';
        return h;
    }

    function changeScheduleStaff(key, newStaff) {
      if (_staffPendingSchedule) return;
      _staffPendingSchedule = true;

      var parts    = key.split('\t');
      var propName = parts[0];
      var date     = parts[1];

      // 検索モード・通常モード共通：scheduleSearchByDate[date] を使う
      var dateData = S.scheduleSearchByDate[date];
      if (!dateData) { _staffPendingSchedule = false; return; }

      var oldStaff = null;
      // scheduleSearchItems・dateData.items・scheduleItems は同一オブジェクトを参照するが明示的に更新
      S.scheduleSearchItems.forEach(function(i) {
        if (i.propertyName === propName && i.date === date) {
          if (oldStaff === null) oldStaff = i.staff || '';
          i.staff = newStaff;
        }
      });
      dateData.items.forEach(function(i) {
        if (i.propertyName === propName) i.staff = newStaff;
      });
      if (date === S.boardDate) {
        S.scheduleItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = newStaff;
        });
      }
      if (oldStaff === null) oldStaff = '';
      var oldUpdatedAt = dateData.latestUpdatedAt;
      renderScheduleList();

      var rows = dateData.items.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });
      callApi({
        action: 'saveAssignments', date: date, rows: rows, knownUpdatedAt: oldUpdatedAt || ''
      }).then(function(r) {
        _staffPendingSchedule = false;
        if (r.ok) {
          if (r.latestUpdatedAt) {
            dateData.latestUpdatedAt = r.latestUpdatedAt;
            if (date === S.boardDate) S.scheduleAssignUpdatedAt = r.latestUpdatedAt;
          }
          toast('担当を変更しました。反映まで最大5分かかります');
          return;
        }
        // ロールバック
        S.scheduleSearchItems.forEach(function(i) {
          if (i.propertyName === propName && i.date === date) i.staff = oldStaff;
        });
        dateData.items.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        if (date === S.boardDate) {
          S.scheduleItems.forEach(function(i) {
            if (i.propertyName === propName) i.staff = oldStaff;
          });
        }
        dateData.latestUpdatedAt = oldUpdatedAt;
        renderScheduleList();
        if (r.error === 'conflict') {
          toast('他の人が先に保存しました。再読込します');
          loadScheduleTab();
        } else {
          toast('担当変更エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _staffPendingSchedule = false;
        S.scheduleSearchItems.forEach(function(i) {
          if (i.propertyName === propName && i.date === date) i.staff = oldStaff;
        });
        dateData.items.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        if (date === S.boardDate) {
          S.scheduleItems.forEach(function(i) {
            if (i.propertyName === propName) i.staff = oldStaff;
          });
        }
        dateData.latestUpdatedAt = oldUpdatedAt;
        renderScheduleList();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('担当変更エラー: ' + e.message);
      });
    }

    function openScheduleDetail(propName) {
      if (S.scheduleTasks[propName]) { renderScheduleList(); return; }
      callApi({ action: 'getCleanTasksForProperty', propertyName: propName })
        .then(function(r) {
          S.scheduleTasks[propName] = r.ok ? (r.tasks || []) : [];
          renderScheduleList();
        })
        .catch(function(e) {
          S.scheduleTasks[propName] = [];
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          renderScheduleList();
        });
    }

    // ── 進捗確認タブ ────────────────────────────────────────────────
    function loadProgress(silent) {
      if (S.sessionExpired) return;
      if (silent) {
        var _anyPend = Object.keys(_progressPending).some(function(k) { return _progressPending[k]; });
        if (_anyPend || _progOrderPending || _staffPendingProgress || S.progOrderMode ||
            S.editDrawerProp ||
            !document.getElementById('task-modal').hidden ||
            !document.getElementById('task-drawer').hidden) return;
      } else {
        var _pc = lsGet('dh_progress_' + S.progressDate);
        if (_pc) {
          restoreProgressFromCache(_pc);
        } else {
          document.getElementById('progress-staff-view').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';
          document.getElementById('progress-board-view').innerHTML = '';
        }
      }

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      Promise.all([
        callApi({ action: 'getSchedule', date: S.progressDate }),
        callApi({ action: 'getProgress',  date: S.progressDate }),
        cleanerProm
      ]).then(function(res) {
        var sr = res[0], pr = res[1], cr = res[2];
        if (cr && cr.ok) S.cleaners = cr.cleaners;
        if (!sr.ok) { toast('進捗確認の読み込みに失敗しました'); return; }
        S.isAdmin = true;
        S.taskCounts = sr.taskCounts || {};

        // CleanProgress データをキーマップに
        S.progressData    = {};
        S.progressDefaults = {};
        if (pr && pr.ok) {
          (pr.progress || []).forEach(function(p) {
            S.progressData[p.property] = {
              status:     p.status     || 'TODO',
              linen:      p.linen      || '',
              trash:      p.trash      || '',
              check:      p.check      || '',
              orderIndex: p.orderIndex || 0,
              updatedAt:  p.updatedAt  || ''
            };
          });
          S.progressDefaults = pr.defaults || {};
        }

        var hdr = sr.schedule.header;
        var H = {
          pn:  hdr.indexOf('PropertyName'),
          fd:  hdr.indexOf('Final_CheckoutDate'),
          fs:  hdr.indexOf('Final_AssignedStaff'),
          ord: hdr.indexOf('Order'),
          uid: hdr.indexOf('UID'),
          sdc: hdr.indexOf('Auto_SameDayCheckout')
        };

        var seen = {}, unique = [];
        sr.schedule.rows.forEach(function(row) {
          var k = String(row[H.pn] || '').trim() + '\t' + String(row[H.fd] || '').trim();
          if (!seen[k]) { seen[k] = true; unique.push(row); }
        });

        var am = {};
        (sr.assignments || []).forEach(function(a) {
          var pn = String(a.propertyName || '').trim();
          am[pn + '\t' + (a.uid || '')] = a;
          am['pn\t' + pn]               = a;
        });

        S.progressAssignUpdatedAt = sr.latestUpdatedAt || null;

        S.progressItems = unique.map(function(row) {
          var pn  = String(row[H.pn]  || '').trim();
          var uid = String(row[H.uid] || '').trim();
          var a   = am[pn + '\t' + uid] || am['pn\t' + pn];
          var sdc = H.sdc >= 0 ? String(row[H.sdc] || '').trim() : '';
          return {
            propertyName: pn,
            uid:          uid,
            staff:        a ? String(a.staff || '') : String(row[H.fs] || '').trim(),
            order:        a ? (Number(a.order) || 0) : (Number(row[H.ord]) || 0),
            isSameDayIn:  sdc === 'Yes'
          };
        });

        updateProgressStats();
        renderProgressStaff(S.progressItems);
        renderProgressBoard(S.progressItems);

        var now = new Date();
        document.getElementById('progress-refresh-note').textContent =
          '最終更新: ' + now.getHours() + ':' +
          String(now.getMinutes()).padStart(2, '0') + '  ／  30秒ごとに自動更新';

        S.progressFetchedAt = Date.now();
        lsSet('dh_progress_' + S.progressDate, {
          progressItems:           S.progressItems,
          progressData:            S.progressData,
          progressDefaults:        S.progressDefaults,
          progressAssignUpdatedAt: S.progressAssignUpdatedAt,
          taskCounts:              S.taskCounts,
          cleaners:                S.cleaners
        });
      }).catch(function(e) {
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('進捗確認読み込みエラー: ' + e.message);
      });
    }

    function updateProgressStats() {
      var items = S.progressItems;
      var totalN   = items.length;
      var sameDayN = items.filter(function(i) { return i.isSameDayIn; }).length;
      var notInN   = totalN - sameDayN;

      function isDone(item) {
        var pd = S.progressData[item.propertyName];
        return pd && pd.status === 'DONE';
      }
      var doneN        = items.filter(isDone).length;
      var doneSameDayN = items.filter(function(i) { return i.isSameDayIn && isDone(i); }).length;
      var doneNotInN   = items.filter(function(i) { return !i.isSameDayIn && isDone(i); }).length;

      document.getElementById('ps-done').textContent      = doneN        + '/' + totalN;
      document.getElementById('ps-samedayin').textContent = doneSameDayN + '/' + sameDayN;
      document.getElementById('ps-notin').textContent     = doneNotInN   + '/' + notInN;
    }

    function rerenderProgress() {
      updateProgressStats();
      renderProgressStaff(S.progressItems);
      renderProgressBoard(S.progressItems);
      if (S.editDrawerProp) updateEditDrawer();
    }

    function getEffectiveProgress(propertyName) {
      if (S.progressData[propertyName]) return S.progressData[propertyName];
      var def = S.progressDefaults[propertyName] || {};
      return {
        status:     'TODO',
        linen:      '',
        trash:      def.trashDefault === 'NEED' ? 'NEED' : '',
        check:      def.checkDefault === 'NEED' ? 'NEED' : '',
        orderIndex: 0,
        updatedAt:  ''
      };
    }

    function buildProgTileMarks(pd) {
      var marks = '';
      if (pd.linen === 'DONE') {
        marks += '<span class="prog-mark prog-mark-linen-done">リ✓</span>';
      } else {
        marks += '<span class="prog-mark prog-mark-linen">リ</span>';
      }
      if (pd.trash === 'DONE') {
        marks += '<span class="prog-mark prog-mark-trash-done">ゴ✓</span>';
      } else if (pd.trash === 'NEED') {
        marks += '<span class="prog-mark prog-mark-trash">ゴ</span>';
      }
      if (pd.check === 'DONE') {
        marks += '<span class="prog-mark prog-mark-check-done">チ✓</span>';
      } else if (pd.check === 'NEED') {
        marks += '<span class="prog-mark prog-mark-check">チ</span>';
      }
      return marks;
    }

    function buildProgTile(item, view, num) {
      var pd     = getEffectiveProgress(item.propertyName);
      var status = pd.status || 'TODO';
      var pn     = item.propertyName;
      var pnEsc  = esc(pn);
      var isLinenStage = (status === 'TODO' && pd.linen === 'DONE');

      var tileCls = 'prog-tile' +
        (status === 'DOING' ? ' doing' : status === 'DONE' ? ' done' : isLinenStage ? ' linen-stage' : '');

      var staffText = item.staff || '';
      var staffCls  = staffText ? 'prog-tile-staff' : 'prog-tile-staff unset';
      var staffDisp = staffText || '未設定';

      var marks = '';
      if (pd.linen === 'DONE') {
        marks += '<span class="prog-mark prog-mark-linen-done">リ✓</span>';
      } else {
        marks += '<span class="prog-mark prog-mark-linen">リ</span>';
      }
      if (pd.trash === 'DONE') {
        marks += '<span class="prog-mark prog-mark-trash-done">ゴ✓</span>';
      } else if (pd.trash === 'NEED') {
        marks += '<span class="prog-mark prog-mark-trash">ゴ</span>';
      }
      if (pd.check === 'DONE') {
        marks += '<span class="prog-mark prog-mark-check-done">チ✓</span>';
      } else if (pd.check === 'NEED') {
        marks += '<span class="prog-mark prog-mark-check">チ</span>';
      }

      var numBadge = (typeof num !== 'undefined') ? '<span class="prog-tile-num">' + num + '</span>' : '';
      var stageLbl = isLinenStage ? '<div class="prog-tile-stage">リネン搬入済み</div>' : '';

      var checkinBadge = '';
      if (view === 'staff') {
        if (item.isSameDayIn) {
          checkinBadge = '<span class="prog-checkin-badge prog-checkin-badge-in">イン</span>';
        } else {
          checkinBadge = '<span class="prog-checkin-badge prog-checkin-badge-out">イン無</span>';
        }
      }

      return '<button class="' + tileCls + '" data-tile-prop="' + pnEsc + '" data-tile-view="' + view + '" data-tile-uid="' + esc(item.uid || '') + '" data-tile-staff="' + esc(item.staff || '') + '">' +
        '<div class="prog-tile-nameline">' + numBadge + '<div class="prog-tile-name">' + pnEsc + '</div></div>' +
        stageLbl +
        checkinBadge +
        '<div class="' + staffCls + '">' + esc(staffDisp) + '</div>' +
        '<div class="prog-tile-marks">' + marks + '</div>' +
      '</button>';
    }

    function renderProgressStaff(items) {
      var container = document.getElementById('progress-staff-view');
      if (!items.length) {
        container.innerHTML = '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var groups = {}, staffOrder = [];
      items.forEach(function(item) {
        var s = item.staff || '';
        if (!groups[s]) { groups[s] = []; staffOrder.push(s); }
        groups[s].push(item);
      });
      staffOrder.sort(function(a, b) {
        if (a === '') return 1;   // 未担当（未設定）は最後
        if (b === '') return -1;
        return a < b ? -1 : a > b ? 1 : 0;
      });

      var html = '';
      var inOrderMode  = !!S.progOrderMode;
      var orderStaff   = S.progOrderMode || '';
      staffOrder.forEach(function(staffName) {
        var sItems = groups[staffName].slice().sort(function(a, b) {
          return (a.order || 9999) - (b.order || 9999);
        });

        var total  = sItems.length;
        var done   = sItems.filter(function(i) {
          return getEffectiveProgress(i.propertyName).status === 'DONE';
        }).length;
        var remain = total - done;
        var undone = total - done;

        // 「順番を決める」ボタン: ADMIN、スタッフ担当あり、順番モード中は他スタッフへ非表示
        var showOrderBtn = S.isAdmin && staffName && (!inOrderMode || orderStaff === staffName);
        var orderBtnHtml = showOrderBtn
          ? '<button class="btn-prog-order" onclick="enterProgOrderMode(\'' + staffName.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')">順番を決める</button>'
          : '';

        html += '<div class="prog-section">' +
          '<div class="prog-section-header">' +
            '<span class="prog-section-title">' + esc(staffName || '未担当') + '</span>' +
            '<span class="prog-section-remain">残り' + remain + '件（完了 ' + done + '/' + total + '）</span>' +
            orderBtnHtml +
          '</div>';

        // 順番モード中のスタッフに操作バーを表示
        if (inOrderMode && orderStaff === staffName) {
          var tapped = S.progTapList.length;
          html += '<div class="prog-order-bar">' +
            '<button onclick="resetProgOrderMode()">全部やり直し</button>' +
            '<span>' + tapped + ' / ' + undone + ' 件</span>' +
            '<button onclick="cancelProgOrderMode()">キャンセル</button>' +
            '<button class="btn-complete" onclick="completeProgOrderMode()"' + (_progOrderPending ? ' disabled' : '') + '>完了</button>' +
          '</div>';
        }

        html += '<div class="prog-tiles prog-tiles-staff">';

        // 清掃順（item.order）で番号を割り当て
        var numMap = {};
        sItems.forEach(function(it, i) { numMap[it.propertyName] = i + 1; });

        var isThisOrderMode = inOrderMode && orderStaff === staffName;
        sItems.forEach(function(item) {
          var isDone = getEffectiveProgress(item.propertyName).status === 'DONE';
          var uid    = item.uid || '';

          if (isThisOrderMode && !isDone) {
            // タップ順番モード: バッジを tap 番号 or 空、タイルをタップ可能に
            var tapIdx = S.progTapList.indexOf(uid);
            var isTapped = tapIdx >= 0;
            var badgeHtml = isTapped
              ? '<span class="prog-tile-tap-badge">' + (tapIdx + 1) + '</span>'
              : '<span class="prog-tile-tap-badge" style="background:#ccc;color:#555">·</span>';
            var pd = getEffectiveProgress(item.propertyName);
            var status = pd.status || 'TODO';
            var isLinenStage = (status === 'TODO' && pd.linen === 'DONE');
            var tileCls = 'prog-tile prog-tile-orderable' +
              (isTapped ? ' doing' : isLinenStage ? ' linen-stage' : '');
            var staffText = item.staff || '';
            var staffCls  = staffText ? 'prog-tile-staff' : 'prog-tile-staff unset';
            var staffDisp = staffText || '未設定';
            var marks = buildProgTileMarks(pd);
            var checkinBadgeOm = item.isSameDayIn
              ? '<span class="prog-checkin-badge prog-checkin-badge-in">イン</span>'
              : '<span class="prog-checkin-badge prog-checkin-badge-out">イン無</span>';
            html += '<button class="' + tileCls + '" data-tile-prop="' + esc(item.propertyName) + '" data-tile-view="staff" data-tile-uid="' + esc(uid) + '" data-tile-staff="' + esc(staffName) + '">' +
              '<div class="prog-tile-nameline">' + badgeHtml + '<div class="prog-tile-name">' + esc(item.propertyName) + '</div></div>' +
              (isLinenStage ? '<div class="prog-tile-stage">リネン搬入済み</div>' : '') +
              checkinBadgeOm +
              '<div class="' + staffCls + '">' + esc(staffDisp) + '</div>' +
              '<div class="prog-tile-marks">' + marks + '</div>' +
            '</button>';
          } else {
            html += buildProgTile(item, 'staff', numMap[item.propertyName]);
          }
        });
        html += '</div></div>';
      });

      container.innerHTML = html;
    }

    function renderProgressBoard(items) {
      var container = document.getElementById('progress-board-view');
      if (!items.length) {
        container.innerHTML = '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      // スタッフ別表示と同じ順: 担当者をアルファベット順・未設定を最後
      var staffSet = {}, staffOrder = [];
      items.forEach(function(item) {
        var s = item.staff || '';
        if (!staffSet[s]) { staffSet[s] = true; staffOrder.push(s); }
      });
      staffOrder.sort(function(a, b) {
        if (a === '') return 1;
        if (b === '') return -1;
        return a < b ? -1 : a > b ? 1 : 0;
      });

      // 担当順→同担当内は item.order 順でソート
      var sorted = items.slice().sort(function(a, b) {
        var ai = staffOrder.indexOf(a.staff || '');
        var bi = staffOrder.indexOf(b.staff || '');
        if (ai !== bi) return ai - bi;
        return (a.order || 9999) - (b.order || 9999);
      });

      var html = '<div class="prog-tiles prog-tiles-board">';
      sorted.forEach(function(item) { html += buildProgTile(item, 'board'); });
      html += '</div>';
      container.innerHTML = html;
    }

    function updateEditDrawer() {
      var pn   = S.editDrawerProp;
      var view = S.editDrawerView;
      if (!pn) return;

      var pd     = getEffectiveProgress(pn);
      var status = pd.status || 'TODO';

      // ステータスボタンの active 状態を更新
      document.querySelectorAll('.ped-status-btn').forEach(function(btn) {
        var s = btn.dataset.pedStatus;
        btn.classList.remove('active-todo', 'active-doing', 'active-done');
        if (s === status) {
          btn.classList.add(
            s === 'TODO' ? 'active-todo' : s === 'DOING' ? 'active-doing' : 'active-done'
          );
        }
      });

      // 担当変更セレクト（DONE は非表示）
      var staffSection = document.getElementById('ped-staff-section');
      staffSection.hidden = (status === 'DONE');
      if (status !== 'DONE') {
        var currentItem = null;
        S.progressItems.forEach(function(i) { if (i.propertyName === pn) currentItem = i; });
        var curStaff = currentItem ? (currentItem.staff || '') : '';
        var opts = '<option value=""' + (!curStaff ? ' selected' : '') + '>未設定</option>';
        if (curStaff && !S.cleaners.some(function(c) { return c.name === curStaff; })) {
          opts += '<option value="' + esc(curStaff) + '" selected>' + esc(curStaff) + '</option>';
        }
        S.cleaners.forEach(function(c) {
          opts += '<option value="' + esc(c.name) + '"' +
            (c.name === curStaff ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        });
        document.getElementById('ped-staff-sel').innerHTML = opts;
      }

      // リネン・ゴミ・チェック（進捗ボードのみ）
      var indSection = document.getElementById('ped-indicators-section');
      indSection.hidden = (view !== 'board');
      if (view === 'board') {
        var linenBtn  = document.getElementById('ped-linen-btn');
        var linenBack = document.getElementById('ped-linen-back');
        linenBtn.className = 'ped-ind-btn ' + (pd.linen === 'DONE' ? 'linen-done' : 'linen-todo');
        linenBtn.textContent = pd.linen === 'DONE' ? 'リネン済 ✓' : 'リネン未 → 済に';
        linenBack.hidden = (pd.linen !== 'DONE');

        var trashBtn  = document.getElementById('ped-trash-btn');
        var trashBack = document.getElementById('ped-trash-back');
        if (pd.trash === 'DONE') {
          trashBtn.className = 'ped-ind-btn trash-done'; trashBtn.textContent = 'ゴミ回収済 ✓';
        } else if (pd.trash === 'NEED') {
          trashBtn.className = 'ped-ind-btn trash-need'; trashBtn.textContent = 'ゴミ要回収 → 回収済に';
        } else {
          trashBtn.className = 'ped-ind-btn trash-none'; trashBtn.textContent = 'オフ → ゴミ要回収に';
        }
        trashBack.hidden = !pd.trash;

        var checkBtn  = document.getElementById('ped-check-btn');
        var checkBack = document.getElementById('ped-check-back');
        if (pd.check === 'DONE') {
          checkBtn.className = 'ped-ind-btn check-done'; checkBtn.textContent = 'チェック済 ✓';
        } else if (pd.check === 'NEED') {
          checkBtn.className = 'ped-ind-btn check-need'; checkBtn.textContent = 'チェック要 → 済に';
        } else {
          checkBtn.className = 'ped-ind-btn check-none'; checkBtn.textContent = 'オフ → チェック要に';
        }
        checkBack.hidden = !pd.check;
      }

      // 追加対応ボタン
      var cnt = S.taskCounts[pn] || 0;
      document.getElementById('ped-tasks-btn').textContent =
        cnt > 0 ? '対応を見る（' + cnt + '件）' : '対応を見る';
    }

    // ── 進捗更新 ─────────────────────────────────────────────────────
    function updateProgressField(propName, fields) {
      if (_progressPending[propName]) return;
      _progressPending[propName] = true;

      var hasSavedRow = !!S.progressData[propName];
      var pd    = hasSavedRow ? S.progressData[propName] : getEffectiveProgress(propName);
      var oldPd = Object.assign({}, pd);

      // 楽観的更新：即座に画面を変える
      var newPd = Object.assign({}, pd);
      if (fields.status !== undefined) newPd.status = fields.status;
      if (fields.linen  !== undefined) newPd.linen  = fields.linen;
      if (fields.trash  !== undefined) newPd.trash  = fields.trash;
      if (fields.check  !== undefined) newPd.check  = fields.check;
      S.progressData[propName] = newPd;
      rerenderProgress();

      callApi({
        action:        'updateProgress',
        propertyName:  propName,
        date:          S.progressDate,
        fields:        fields,
        knownUpdatedAt: hasSavedRow ? (pd.updatedAt || '') : ''
      }).then(function(r) {
        _progressPending[propName] = false;
        if (r.ok) {
          S.progressData[propName].updatedAt = r.updatedAt;
        } else if (r.error === 'conflict') {
          S.progressData[propName] = oldPd;
          rerenderProgress();
          toast('他の人が更新しました。最新情報を再読込します');
          loadProgress();
        } else {
          S.progressData[propName] = oldPd;
          rerenderProgress();
          toast('更新エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _progressPending[propName] = false;
        S.progressData[propName] = oldPd;
        rerenderProgress();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('更新エラー: ' + e.message);
      });
    }

    function saveScheduleChange(kind, uid, propName, oldDate, newDate) {
      callApi({ action: 'saveScheduleChange', kind: kind, uid: uid,
                propertyName: propName, oldDate: oldDate, newDate: newDate })
        .then(function(r) {
          if (!r.ok) { toast('送信エラー: ' + (r.error || '不明')); return; }
          S.lineRequests.push({ uid: uid, kind: kind, propertyName: propName,
                                oldDate: oldDate, newDate: newDate, result: 'PENDING' });
          renderScheduleList();
          toast('変更を送信しました（最大5分で反映）');
        })
        .catch(function(e) {
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('送信エラー: ' + e.message);
        });
    }

    function savePropertyDefaultField(propName, field, currentVal) {
      var newVal = currentVal === 'NEED' ? '' : 'NEED';

        }
      }).catch(function(e) {
        S.progressDefaults[propName] = oldDef;
        renderScheduleList();
        if (e.isUnauthorized) { handleUnauthorized(); return; }

    function changeProgressStaff(propName, newStaff) {
      if (_staffPendingProgress) return;
      _staffPendingProgress = true;

      // 楽観的更新：先に progressItems の staff を更新して再描画
      var oldStaff = '';
      S.progressItems.forEach(function(i) {
        if (i.propertyName === propName) { oldStaff = i.staff || ''; i.staff = newStaff; }
      });
      var oldUpdatedAt = S.progressAssignUpdatedAt;
      rerenderProgress();

      // rows は更新済み progressItems から構築
      var rows = S.progressItems.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });
      callApi({
        action:         'saveAssignments',
        date:           S.progressDate,
        rows:           rows,
        knownUpdatedAt: oldUpdatedAt || ''
      }).then(function(r) {
        _staffPendingProgress = false;
        if (r.ok) {
          if (r.latestUpdatedAt) S.progressAssignUpdatedAt = r.latestUpdatedAt;
          toast('担当を変更しました。反映まで最大5分かかります');
          return;
        }
        // ロールバック
        S.progressItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        S.progressAssignUpdatedAt = oldUpdatedAt;
        rerenderProgress();
        if (r.error === 'conflict') {
          toast('他の人が先に保存しました。再読込します');
          loadProgress();
        } else {
          toast('担当変更エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _staffPendingProgress = false;
        S.progressItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        S.progressAssignUpdatedAt = oldUpdatedAt;
        rerenderProgress();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('担当変更エラー: ' + e.message);
      });
    }

    function enterProgOrderMode(staffName) {

      S.progOrderMode = staffName;
      S.progTapList   = [];

    function cancelProgOrderMode() {
      S.progOrderMode = null;
      S.progTapList   = [];
      rerenderProgress();

      S.progTapList = [];

    function onProgTileTap(uid, staffName) {
      if (S.progOrderMode !== staffName) return;
      var item = null;
      S.progressItems.forEach(function(i) { if (i.uid === uid) item = i; });
      if (!item) return;
      if (getEffectiveProgress(item.propertyName).status === 'DONE') return;
      var idx = S.progTapList.indexOf(uid);
      if (idx >= 0) {
        S.progTapList.splice(idx, 1);
      } else {
        S.progTapList.push(uid);
      }
      rerenderProgress();
    }

    function completeProgOrderMode() {
      if (_progOrderPending) return;
      var staffName = S.progOrderMode;
      if (!staffName) return;

      var unfinished = S.progressItems.filter(function(i) {
        return (i.staff || '') === staffName && getEffectiveProgress(i.propertyName).status !== 'DONE';
      });
      var finished = S.progressItems.filter(function(i) {
        return (i.staff || '') === staffName && getEffectiveProgress(i.propertyName).status === 'DONE';
      });

      var tapped   = S.progTapList.map(function(uid) {
        return unfinished.find(function(i) { return i.uid === uid; });
      }).filter(Boolean);
      var untapped = unfinished.filter(function(i) {
        return S.progTapList.indexOf(i.uid) < 0;
      }).sort(function(a, b) {
        return (a.order || 9999) - (b.order || 9999);
      });

      var ordered = tapped.concat(untapped);

      // ロールバック用バックアップ
      var origOrders = {};
      S.progressItems.forEach(function(i) { origOrders[i.uid] = i.order || 0; });

      // 未完了行に 1,2,3... を割り当て。完了済みは末尾に続く
      ordered.forEach(function(i, k) { i.order = k + 1; });
      finished.forEach(function(i, k) { i.order = ordered.length + k + 1; });

      var oldUpdatedAt = S.progressAssignUpdatedAt;
      S.progOrderMode = null;
      S.progTapList   = [];
      _progOrderPending = true;
      rerenderProgress();

      var rows = S.progressItems.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });

      callApi({
        action: 'saveAssignments',
        date: S.progressDate,
        rows: rows,
        knownUpdatedAt: oldUpdatedAt || ''
      }).then(function(r) {
        _progOrderPending = false;
        if (r.ok) {
          if (r.latestUpdatedAt) S.progressAssignUpdatedAt = r.latestUpdatedAt;
          toast('順番を保存しました。反映まで最大5分かかります');
          return;
        }
        // ロールバック
        S.progressItems.forEach(function(i) {
          if (origOrders[i.uid] !== undefined) i.order = origOrders[i.uid];
        });
        S.progressAssignUpdatedAt = oldUpdatedAt;
        rerenderProgress();
        if (r.error === 'conflict') {
          toast('他の人が先に保存しました。再読込します');
          loadProgress();
        } else {
          toast('順番の保存エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _progOrderPending = false;
        S.progressItems.forEach(function(i) {
          if (origOrders[i.uid] !== undefined) i.order = origOrders[i.uid];
        });
        S.progressAssignUpdatedAt = oldUpdatedAt;
        rerenderProgress();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('順番の保存エラー: ' + e.message);
      });
    }

    function openTaskModal(propName, date) {
      taskModal.propName = propName;
      taskModal.boundDate = date || '';
      taskModal.photoRequired = false;
      document.getElementById('task-modal-prop').textContent = propName;
      document.getElementById('task-modal-date').textContent = fmtDate(date) + 'の清掃に対応';
      document.getElementById('task-type').value = 'WORK';
      document.getElementById('task-content').value = '';
      document.getElementById('task-char-count').textContent = '0 / 200';

    function setPhotoToggle(val) {
      taskModal.photoRequired = val;
      document.getElementById('photo-no').classList.toggle('selected', !val);
      document.getElementById('photo-yes').classList.toggle('selected', val);
    }

    function closeTaskModal() {
      document.getElementById('task-modal').hidden = true;
    }

    function submitTask() {
      var propName   = taskModal.propName;
      var boundDate  = taskModal.boundDate;
      var type       = document.getElementById('task-type').value;
      var content    = document.getElementById('task-content').value.trim();

      if (!content) { toast('内容を入力してください'); return; }
      if (content.length > 200) { toast('内容は200文字以内にしてください'); return; }
      if (!boundDate) { toast('日付が設定されていません'); return; }

      closeTaskModal();
      setBusy(true);
      callApi({
        action:        'addCleanTask',
        propertyName:  propName,
        type:          type,
        content:       content,
        photoRequired: taskModal.photoRequired,
        targetMode:    'DATE',
        targetDate:    boundDate
      }).then(function(r) {
        setBusy(false);
        if (r.ok) {
          toast('登録しました ✓');
          // 保持データの taskCount をローカル更新（全取得なし）
          S.scheduleSearchItems.forEach(function(i) {
            if (i.propertyName === propName && i.date === boundDate) i.taskCount++;
          });
          if (S.scheduleSearchByDate[boundDate]) {
            S.scheduleSearchByDate[boundDate].items.forEach(function(i) {
              if (i.propertyName === propName) i.taskCount++;
            });
          }
          if (S.boardDate === boundDate) {
            S.scheduleItems.forEach(function(i) {
              if (i.propertyName === propName) { i.taskCount++; S.taskCounts[propName] = (S.taskCounts[propName] || 0) + 1; }
            });
          }
          if (S.scheduleDetailKey) {
            delete S.scheduleTasks[S.scheduleDetailKey.split('\t')[0]];
            openScheduleDetail(S.scheduleDetailKey.split('\t')[0]);
          }
          renderScheduleList();
        } else {
          toast('登録エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        setBusy(false);
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('登録エラー: ' + e.message);
      });
    }

    // ── タスクドロワー ───────────────────────────────────────────────
    function openTaskDrawer(propName) {
      var drawer = document.getElementById('task-drawer');
      document.getElementById('drawer-title').textContent = propName + ' の対応一覧';
      document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">読み込み中…</div>';
      drawer.hidden = false;

      callApi({ action: 'getCleanTasksForProperty', propertyName: propName })
        .then(function(r) {
          if (!r.ok) {
            document.getElementById('drawer-body').innerHTML =
              '<div class="drawer-empty">取得に失敗しました</div>';
            return;
          }
          renderDrawerBody(r.tasks || [], propName);
        })
        .catch(function(e) {
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          document.getElementById('drawer-body').innerHTML =
            '<div class="drawer-empty">取得エラー: ' + esc(e.message) + '</div>';
        });
    }

    function renderDrawerBody(tasks, propName) {
      if (!tasks.length) {
        document.getElementById('drawer-body').innerHTML =
          '<div class="drawer-empty">OPEN の対応はありません</div>';
        return;
      }
      var todayYmd = today();
      var html = '';
      tasks.forEach(function(t) {
        var dateLabel = t.targetMode === 'NEXT'
          ? '次回清掃' + (t.boundDate ? '（' + t.boundDate + '）' : '')
          : t.targetDate;
        var expired = t.targetMode === 'DATE' && t.targetDate && t.targetDate < todayYmd;
        html += '<div class="task-item">' +
          '<div class="task-item-header">' +
            '<span class="task-type-badge">' + esc(t.type) + '</span>' +
            '<span class="task-date-label">' + esc(dateLabel) + '</span>' +
            (expired ? '<span class="task-expired-label">期限切れ</span>' : '') +
          '</div>' +
          '<div class="task-content">' + esc(t.content) + '</div>' +
          (t.photoRequired ? '<div class="task-photo-tag">📷 写真必要</div>' : '') +
          '<div class="task-actions">' +
            '<button class="btn-task-done"   data-tid="' + esc(t.taskId) + '" data-prop="' + esc(propName) + '">完了</button>' +
            '<button class="btn-task-cancel" data-tid="' + esc(t.taskId) + '" data-prop="' + esc(propName) + '">取消</button>' +
          '</div>' +
        '</div>';
      });
      document.getElementById('drawer-body').innerHTML = html;

      document.querySelectorAll('.btn-task-done, .btn-task-cancel').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tid    = btn.dataset.tid;
          var pn     = btn.dataset.prop;
          var status = btn.classList.contains('btn-task-done') ? 'DONE' : 'CANCELLED';
          btn.disabled = true;
          callApi({ action: 'updateCleanTaskStatus', taskId: tid, status: status })
            .then(function(r) {
              if (r.ok) {
                toast(status === 'DONE' ? '完了にしました ✓' : '取り消しました');
                openTaskDrawer(pn);
                loadScheduleTab(true);
              } else {
                btn.disabled = false;
                toast('更新エラー: ' + (r.error || '不明'));
              }
            })
            .catch(function(e) {
              btn.disabled = false;
              if (e.isUnauthorized) { handleUnauthorized(); return; }
              toast('更新エラー: ' + e.message);
            });
        });
      });
    }

      document.getElementById('task-drawer').hidden = true;
    }

    function openBoardAddTask() {

      document.getElementById('drawer-body').innerHTML = '<div class="drawer-empty">読み込み中…</div>';
      drawer.hidden = false;

      callApi({ action: 'getActiveProperties' })
        .then(function(r) {
          if (!r.ok) {
            closeTaskDrawer();
            toast('物件一覧の取得に失敗しました: ' + (r.error || '不明'));
            return;
          }
          var props = r.properties || [];
          if (!props.length) {
            document.getElementById('drawer-body').innerHTML =
              '<div class="drawer-empty">有効な物件がありません</div>';
            return;
          }

          var sel = document.createElement('select');
          sel.className = 'drawer-prop-sel';
          var placeholder = document.createElement('option');
          placeholder.value = ''; placeholder.textContent = '物件を選んでください';
          sel.appendChild(placeholder);
          props.forEach(function(p) {
            var opt = document.createElement('option');
            opt.value = p; opt.textContent = p;
            sel.appendChild(opt);
          });

          var body = document.getElementById('drawer-body');
          body.innerHTML = '';
          body.appendChild(sel);

          sel.onchange = function() {
            var p = sel.value;
            if (!p) return;
            closeTaskDrawer();
            openTaskModal(p, S.boardDate);
          };
        })
        .catch(function(e) {
          closeTaskDrawer();
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('物件一覧の取得エラー: ' + e.message);
        });
    }

    // ── 再送 ─────────────────────────────────────────────────────────
    function resendBlock(propName) {
      if (!confirm('この物件の今の担当と対応を、全体グループに送ります。よろしいですか')) return;
      var RESEND_ERRORS = {
        already_pending:  '再送は既に依頼済みです（最大5分で届きます）',
        invalid_property: '物件名が無効です',
        invalid_date:     '今日か明日の日付のみ再送できます'
      };
      callApi({ action: 'resendPropertyBlock', propertyName: propName, date: S.boardDate })
        .then(function(r) {
          if (!r.ok) {
            toast(RESEND_ERRORS[r.error] || ('エラー: ' + (r.error || '不明')));
            return;
          }
          toast('再送を依頼しました。最大5分で届きます');
        })
        .catch(function(e) {
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('再送エラー: ' + e.message);
        });
    }

    // ── イベント ──────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {

      // タブ切り替え
      document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tab = btn.dataset.tab;
          S.activeTab = tab;
          document.querySelectorAll('.tab-btn').forEach(function(b) {
            b.classList.toggle('active', b === btn);
          });
          document.getElementById('panel-progress').hidden = (tab !== 'progress');
          document.getElementById('panel-schedule').hidden = (tab !== 'schedule');
          document.getElementById('panel-manual').hidden   = true;
          stopBoardTimer();
          stopProgressTimer();
          if (tab === 'progress') {
            if (Date.now() - S.progressFetchedAt >= FRESH_MS) loadProgress();
            startProgressTimer();
          }
          if (tab === 'schedule') {
            if (Date.now() - S.scheduleFetchedAt >= FRESH_MS) loadScheduleTab();
            startBoardTimer();
          }
        });
      });

      // 進捗確認：日付変更
      document.getElementById('progress-date-sel').addEventListener('change', function() {
        S.progressDate = this.value;
        loadProgress();
      });

      // 進捗確認：ビュー切り替え
      document.getElementById('vbtn-staff').addEventListener('click', function() {
        S.activeProgressView = 'staff';
        document.getElementById('vbtn-staff').classList.add('active');
        document.getElementById('vbtn-board').classList.remove('active');
        document.getElementById('progress-staff-view').hidden = false;
        document.getElementById('progress-board-view').hidden = true;
      });
      document.getElementById('vbtn-board').addEventListener('click', function() {
        S.activeProgressView = 'board';
        document.getElementById('vbtn-board').classList.add('active');
        document.getElementById('vbtn-staff').classList.remove('active');
        document.getElementById('progress-board-view').hidden = false;
        document.getElementById('progress-staff-view').hidden = true;
      });

      // リネン表示トグル
      document.getElementById('btn-linen-toggle').addEventListener('click', function() {
        var panel = document.getElementById('panel-progress');
        var on = panel.classList.toggle('linen-hidden');
        // toggle() returns true if added; we want "on" = NOT hidden
        var showing = !on;
        this.textContent = showing ? 'リネン非表示' : 'リネン表示';
        this.classList.toggle('on', showing);
      });

      // 進捗確認パネル：タイルタップで編集ドロワー or 順番モードのタップ処理
      document.getElementById('panel-progress').addEventListener('click', function(e) {
        var tile = e.target.closest('[data-tile-prop]');
        if (!tile) return;
        var tileUid   = tile.dataset.tileUid   || '';
        var tileStaff = tile.dataset.tileStaff || '';
        if (S.progOrderMode && S.progOrderMode === tileStaff) {
          onProgTileTap(tileUid, tileStaff);
          return;
        }
        if (!S.progOrderMode) {
          openEditDrawer(tile.dataset.tileProp, tile.dataset.tileView);
        }
      });

      // 進捗編集ドロワーのイベント
      document.getElementById('prog-edit-drawer').addEventListener('click', function(e) {
        if (e.target === this) { closeEditDrawer(); return; }

        if (e.target.closest('#ped-close')) { closeEditDrawer(); return; }

        var statusBtn = e.target.closest('.ped-status-btn');
        if (statusBtn && S.editDrawerProp) {
          updateProgressField(S.editDrawerProp, { status: statusBtn.dataset.pedStatus });
          return;
        }

        if (e.target.closest('#ped-linen-btn') && S.editDrawerProp) {
          var linenPd = getEffectiveProgress(S.editDrawerProp);
          if (linenPd.linen !== 'DONE') updateProgressField(S.editDrawerProp, { linen: 'DONE' });
          return;
        }

        if (e.target.closest('#ped-linen-back') && S.editDrawerProp) {
          updateProgressField(S.editDrawerProp, { linen: '' });
          return;
        }

        if (e.target.closest('#ped-trash-btn') && S.editDrawerProp) {
          var trashPd = getEffectiveProgress(S.editDrawerProp);
          var newTrash = trashPd.trash === '' ? 'NEED' : trashPd.trash === 'NEED' ? 'DONE' : trashPd.trash;
          if (newTrash !== trashPd.trash) updateProgressField(S.editDrawerProp, { trash: newTrash });
          return;
        }

        if (e.target.closest('#ped-trash-back') && S.editDrawerProp) {
          var trashBackPd = getEffectiveProgress(S.editDrawerProp);
          var prevTrash = trashBackPd.trash === 'DONE' ? 'NEED' : '';
          updateProgressField(S.editDrawerProp, { trash: prevTrash });
          return;
        }

        if (e.target.closest('#ped-check-btn') && S.editDrawerProp) {
          var checkPd = getEffectiveProgress(S.editDrawerProp);
          var newCheck = checkPd.check === '' ? 'NEED' : checkPd.check === 'NEED' ? 'DONE' : checkPd.check;
          if (newCheck !== checkPd.check) updateProgressField(S.editDrawerProp, { check: newCheck });
          return;
        }

        if (e.target.closest('#ped-check-back') && S.editDrawerProp) {
          var checkBackPd = getEffectiveProgress(S.editDrawerProp);
          var prevCheck = checkBackPd.check === 'DONE' ? 'NEED' : '';
          updateProgressField(S.editDrawerProp, { check: prevCheck });
          return;
        }

        if (e.target.closest('#ped-tasks-btn') && S.editDrawerProp) {
          var taskProp = S.editDrawerProp;
          closeEditDrawer();
          openTaskDrawer(taskProp);
          return;
        }
      });

      // 進捗編集ドロワー：担当変更
      document.getElementById('ped-staff-sel').addEventListener('change', function() {
        if (S.editDrawerProp) {
          changeProgressStaff(S.editDrawerProp, this.value);
        }
      });

      // 手入力予約パネル：開く / 戻る
      document.getElementById('btn-open-manual').addEventListener('click', openManualPanel);
      document.getElementById('btn-manual-back').addEventListener('click', closeManualPanel);

      // 追加フォーム
      document.getElementById('btn-manual-add').addEventListener('click', openManualAddSection);
      document.getElementById('btn-manual-form-cancel').addEventListener('click', closeManualAddSection);
      document.getElementById('btn-manual-save').addEventListener('click', function() { submitManualAdd(false); });
      document.getElementById('btn-manual-save-cont').addEventListener('click', function() { submitManualAdd(true); });
      document.getElementById('btn-manual-bulk').addEventListener('click', openManualBulkSection);
      document.getElementById('btn-bulk-cancel').addEventListener('click', closeManualBulkSection);
      document.getElementById('btn-bulk-save').addEventListener('click', submitBulkSave);
      document.getElementById('btn-bulk-add-row').addEventListener('click', function() {
        if (S.bulkRows.length >= BULK_MAX_ROWS) return;
        S.bulkRows.push({ dtstart: '', dtend: '', sameDay: false, status: null, includeDup: false });
        renderBulkRows();
      });
      document.getElementById('bulk-rows-container').addEventListener('change', function(e) {
        var rowEl = e.target.closest('.bulk-row');
        if (!rowEl) return;
        var idx = parseInt(rowEl.dataset.rowIdx, 10);
        if (isNaN(idx) || !S.bulkRows[idx]) return;
        if (e.target.classList.contains('bulk-dtstart')) { S.bulkRows[idx].dtstart = e.target.value; renderBulkRows(); }
        if (e.target.classList.contains('bulk-dtend'))   { S.bulkRows[idx].dtend   = e.target.value; renderBulkRows(); }
        if (e.target.classList.contains('bulk-dup-check')) { S.bulkRows[idx].includeDup = e.target.checked; }
      });
      document.getElementById('bulk-rows-container').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var rowEl = btn.closest('.bulk-row');
        if (!rowEl) return;
        var idx = parseInt(rowEl.dataset.rowIdx, 10);
        if (isNaN(idx) || !S.bulkRows[idx]) return;
        if (btn.dataset.action === 'sameday') {
          S.bulkRows[idx].sameDay = !S.bulkRows[idx].sameDay;
          renderBulkRows();
        }
        if (btn.dataset.action === 'del') {
          S.bulkRows.splice(idx, 1);
          renderBulkRows();
        }
      });
      document.getElementById('manual-form-sameday').addEventListener('click', function() {
        S.manualSameDay = !S.manualSameDay;
        updateSameDayToggle();
      });
      document.getElementById('manual-prop-toggle-all').addEventListener('click', function() {
        S.manualShowAllProps = !S.manualShowAllProps;
        renderManualPropSelect();
      });
      document.getElementById('manual-type-normal').addEventListener('click', function() { setManualType(false); });
      document.getElementById('manual-type-spot').addEventListener('click',   function() { setManualType(true); });
      document.getElementById('manual-form-prop').addEventListener('change', updateSpotPreview);
      document.getElementById('manual-form-title').addEventListener('input',  updateSpotPreview);
      document.getElementById('manual-filter-prop').addEventListener('change', function() {
        S.manualFilterProp = this.value;
        renderManualList();
      });
      document.getElementById('manual-filter-bar').querySelectorAll('.manual-range-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          S.manualFilterRange = this.dataset.range;
          renderManualList();
        });
      });
      document.getElementById('btn-dup-cancel').addEventListener('click', function() {
        document.getElementById('manual-dup-warning').hidden = true;
      });
      document.getElementById('btn-dup-cancel-cont').addEventListener('click', function() {
        document.getElementById('manual-dup-warning-cont').hidden = true;
      });

      // 今後の清掃予定タブ：日付変更
      document.getElementById('board-date-sel').addEventListener('change', function() {
        if (S.orderMode) exitOrderMode();
        S.boardDate = this.value;
        S.scheduleExpandedKey = null;
        S.scheduleDetailKey   = null;
        if (S.scheduleSearchFetched) {
          // 範囲データ取得済み：API コールなしに切替
          applyScheduleDate(S.boardDate);
          updateScheduleStats();
          renderScheduleList();
        } else {
          loadScheduleTab();
        }
      });

      // タスク登録モーダル内部イベント
      document.getElementById('task-content').addEventListener('input', function() {
        var len = this.value.length;
        var el  = document.getElementById('task-char-count');
        el.textContent = len + ' / 200';
        el.classList.toggle('over', len > 200);
      });
      document.getElementById('photo-no').addEventListener('click',  function() { setPhotoToggle(false); });
      document.getElementById('photo-yes').addEventListener('click', function() { setPhotoToggle(true); });
      document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
      document.getElementById('task-modal-submit').addEventListener('click', submitTask);
      document.getElementById('task-modal').addEventListener('click', function(e) {
        if (e.target === this) closeTaskModal();
      });

      // ドロワー背景タップで閉じる
      document.getElementById('task-drawer').addEventListener('click', function(e) {
        if (e.target === this) closeTaskDrawer();
      });

      // 今後の清掃予定タブ：検索
      document.getElementById('sched-search').addEventListener('input', function() {
        S.scheduleSearchText = this.value;
        updateScheduleViewBars();
        if (S.scheduleSearchText.trim().length > 0 && !S.scheduleSearchFetched && !S.scheduleSearchLoading) {
          loadScheduleSearchData();
        } else {
          renderScheduleList();
        }
      });

      // 今後の清掃予定タブ：グループ切り替え（エリア別 / 担当別）
      document.getElementById('btn-group-area').addEventListener('click', function() {
        if (S.scheduleGrouping === 'area') return;
        S.scheduleGrouping = 'area';
        document.getElementById('btn-group-area').classList.add('active');
        document.getElementById('btn-group-staff').classList.remove('active');
        renderScheduleList();
      });
      document.getElementById('btn-group-staff').addEventListener('click', function() {
        if (S.scheduleGrouping === 'staff') return;
        S.scheduleGrouping = 'staff';
        document.getElementById('btn-group-staff').classList.add('active');
        document.getElementById('btn-group-area').classList.remove('active');
        renderScheduleList();
      });

      // 今後の清掃予定タブ：順番を決めるモード
      document.getElementById('btn-order-mode').addEventListener('click', enterOrderMode);
      document.getElementById('order-mode-staff-sel').addEventListener('change', function() {
        S.orderModeStaff = this.value;
        S.orderModeTaps  = [];
        renderOrderModeList();
      });
      document.getElementById('order-mode-list').addEventListener('click', function(e) {
        var row = e.target.closest('.order-tap-row');
        if (!row) return;
        var uid = row.dataset.orderUid;
        if (!uid) return;
        var idx = S.orderModeTaps.indexOf(uid);
        if (idx >= 0) {
          S.orderModeTaps.splice(idx, 1);
        } else {
          S.orderModeTaps.push(uid);
        }
        renderOrderModeList();
      });
      document.getElementById('btn-order-reset').addEventListener('click', function() {
        S.orderModeTaps = [];
        renderOrderModeList();
      });
      document.getElementById('btn-order-cancel').addEventListener('click', exitOrderMode);
      document.getElementById('btn-order-confirm').addEventListener('click', confirmOrderMode);

      // 今後の清掃予定タブ：行の展開・タスク操作（click 委譲）
      document.getElementById('panel-schedule').addEventListener('click', function(e) {
        // 行メインタップ → 展開切替
        var toggle = e.target.closest('[data-sched-toggle]');
        if (toggle) {
          var k = toggle.dataset.schedToggle;
          if (S.scheduleExpandedKey === k) {
            S.scheduleExpandedKey = null;
            S.scheduleDetailKey   = null;
          } else {
            S.scheduleExpandedKey = k;
            S.scheduleDetailKey   = null;
          }
          renderScheduleList();
          return;
        }
        // 詳細設定ボタン
        var detailBtn = e.target.closest('[data-sched-detail-key]');
        if (detailBtn) {
          var dk = detailBtn.dataset.schedDetailKey;
          if (S.scheduleDetailKey === dk) {
            S.scheduleDetailKey = null;
            renderScheduleList();
          } else {
            S.scheduleDetailKey = dk;
            openScheduleDetail(dk.split('\t')[0]);
          }
          return;
        }
        // タスク完了・取消
        var taskBtn = e.target.closest('[data-sched-tid]');
        if (taskBtn) {
          var tid   = taskBtn.dataset.schedTid;
          var propN = taskBtn.dataset.schedProp;
          var st    = taskBtn.classList.contains('btn-task-done') ? 'DONE' : 'CANCELLED';
          taskBtn.disabled = true;
          callApi({ action: 'updateCleanTaskStatus', taskId: tid, status: st })
            .then(function(r) {
              if (r.ok) {
                toast(st === 'DONE' ? '完了にしました ✓' : '取り消しました');
                delete S.scheduleTasks[propN];
                S.taskCounts[propN] = Math.max(0, (S.taskCounts[propN] || 1) - 1);
                S.scheduleItems.forEach(function(i) {
                  if (i.propertyName === propN) i.taskCount = S.taskCounts[propN];
                });
                openScheduleDetail(propN);
              } else {
                taskBtn.disabled = false;
                toast('更新エラー: ' + (r.error || '不明'));
              }
            })
            .catch(function(e2) {
              taskBtn.disabled = false;
              if (e2.isUnauthorized) { handleUnauthorized(); return; }
              toast('更新エラー: ' + e2.message);
            });
          return;
        }
        // 対応追加
        var addBtn = e.target.closest('[data-sched-add-prop]');
        if (addBtn) { openTaskModal(addBtn.dataset.schedAddProp, addBtn.dataset.schedAddDate); return; }
        // 再送
        var resendBtn = e.target.closest('[data-sched-resend-prop]');
        if (resendBtn) { resendBlock(resendBtn.dataset.schedResendProp); return; }
        // 既定値トグル
        var defBtn = e.target.closest('[data-sched-default-prop]');
        if (defBtn) {
          savePropertyDefaultField(
            defBtn.dataset.schedDefaultProp,
            defBtn.dataset.schedDefaultField,
            defBtn.dataset.schedDefaultVal
          );
          return;
        }
        // 日程変更「変更する」ボタン
        var changeDateBtn = e.target.closest('.btn-sched-change-date');
        if (changeDateBtn) {
          var sect  = changeDateBtn.closest('.sched-date-change-section');
          var inp   = sect ? sect.querySelector('.sched-new-date-input') : null;
          if (!inp || !inp.value) { toast('変更後の日付を入力してください'); return; }
          var uidC  = changeDateBtn.dataset.schedUid;
          var propC = changeDateBtn.dataset.schedPn;
          var oldC  = changeDateBtn.dataset.schedOld;
          var newC  = inp.value;
          var tomorrowVal = tomorrow();
          if (newC < tomorrowVal) { toast('変更後の日付は明日以降にしてください'); return; }
          var daysAhead    = Math.ceil((new Date(newC) - new Date(today())) / 86400000);
          var daysOldAhead = Math.ceil((new Date(oldC) - new Date(today())) / 86400000);
          var confirmMsg = fmtDate(oldC) + ' → ' + fmtDate(newC) + ' に変更しますか？';
          if (daysAhead <= 3 || daysOldAhead <= 3) confirmMsg += '\n\n間近の変更です。担当スタッフへの連絡を確認してください。';
          if (!confirm(confirmMsg)) return;
          saveScheduleChange('CHANGE', uidC, propC, oldC, newC);
          return;
        }
        // 日程変更「元に戻す」ボタン
        var clearDateBtn = e.target.closest('.btn-sched-clear-date');
        if (clearDateBtn) {
          var uidCl  = clearDateBtn.dataset.schedUid;
          var propCl = clearDateBtn.dataset.schedPn;
          var oldCl  = clearDateBtn.dataset.schedOld;
          if (!confirm(fmtDate(oldCl) + ' の変更を元に戻しますか？')) return;
          saveScheduleChange('CLEAR', uidCl, propCl, oldCl, '');
          return;
        }
      });

      // 今後の清掃予定タブ：担当変更セレクト（change 委譲）
      document.getElementById('panel-schedule').addEventListener('change', function(e) {
        var sel = e.target.closest('[data-sched-assign-key]');
        if (sel) { changeScheduleStaff(sel.dataset.schedAssignKey, sel.value); }
      });

      document.getElementById('btn-album-resend').addEventListener('click', function() {
        if (!confirm('今日担当の全清掃員に、アルバムURLを再送します。よろしいですか？')) return;
        var btn = document.getElementById('btn-album-resend');
        btn.disabled = true;
        callApi({ action: 'enqueueAlbumResendAll' }).then(function(data) {
          btn.disabled = false;
          if (!data.ok) {
            if (data.error === 'already_pending') {
              toast('10分以内に再送済みです。しばらく待ってから再度お試しください。');
            } else {
              toast('再送エラー: ' + (data.error || '不明'));
            }
            return;
          }
          toast('再送をリクエストしました。5分以内に送信されます。');
        }).catch(function(e) {
          btn.disabled = false;
          toast('再送エラー: ' + e.message);
        });
      });

      // 画面が隠れているあいだは自動更新を止める
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          stopBoardTimer();
          stopProgressTimer();
        } else {
          if (S.activeTab === 'schedule') {
            loadScheduleTab(true);
            startBoardTimer();
          }
          if (S.activeTab === 'progress') {
            loadProgress(true);
            startProgressTimer();
          }
        }
      });
    });

    // ── LIFF 初期化 ──────────────────────────────────────────────────
    liff.init({ liffId: CFG.LIFF_ID }).then(function() {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      S.idToken      = liff.getIDToken();
      S.boardDate    = today();
      S.progressDate = today();
      document.getElementById('board-date-sel').value    = S.boardDate;
      document.getElementById('progress-date-sel').value = S.progressDate;
      document.getElementById('loading').hidden = true;
      document.getElementById('app').hidden     = false;

      loadProgress();
      startProgressTimer();
    }).catch(function(e) {
      document.getElementById('loading').hidden = true;
      var el = document.getElementById('error');
      el.hidden = false;
      el.innerHTML =
        '<strong>LIFF の初期化に失敗しました</strong><br>' +
        esc(e.message || '不明なエラー');
    });
  </script>
</body>
</html>
