<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>管理ボード</title>
  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:  #00a84f;
      --bg:     #f4f4f4;
      --card:   #fff;
      --border: #e0e0e0;
      --muted:  #888;
    }
    body {
      font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg); color: #222; font-size: 15px; min-height: 100vh;
    }

    /* ── ローディング / エラー ── */
    .fill {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 2rem; text-align: center; gap: 1rem;
    }
    #error { color: #c00; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── アプリ ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── セッション期限切れバナー ── */
    .session-banner {
      background: #c00; color: #fff; text-align: center;
      padding: 0.65rem 1rem; font-size: 0.85rem; font-weight: bold;
    }

    /* ── タブ ── */
    .tabs {
      display: flex; background: var(--card);
      border-bottom: 2px solid var(--border);
      position: sticky; top: 0; z-index: 20;
    }
    .tab-btn {
      flex: 1; padding: 0.8rem; border: none; background: transparent;
      font-size: 0.9rem; font-family: inherit; cursor: pointer; color: var(--muted);
    }
    .tab-btn.active {
      color: var(--green); border-bottom: 3px solid var(--green);
      margin-bottom: -2px; font-weight: bold;
    }

    /* ── パネル ── */
    .panel { padding: 0.75rem; }
    .panel[hidden] { display: none; }

    /* ── 日付行 ── */
    .date-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .date-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
    .date-row input[type="date"] {
      flex: 1; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.92rem; font-family: inherit; background: var(--card);
    }

    /* ── お知らせ / 警告 ── */
    .notice {
      background: #fffde7; border: 1px solid #f9c906; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #555;
      margin-bottom: 0.75rem;
    }
    .warn {
      background: #fff3e0; border: 1px solid #f57c00; border-radius: 6px;
      padding: 0.55rem 0.75rem; font-size: 0.82rem; color: #444;
      margin-bottom: 0.75rem;
    }

    /* ── エリア見出し ── */
    .area-label {
      font-size: 0.78rem; font-weight: bold; color: var(--muted);
      padding: 0.35rem 0; margin-top: 0.6rem; border-bottom: 1px solid var(--border);
    }

    /* ── ボタン（モーダル共通） ── */
    .btn {
      flex: 1; padding: 0.7rem; border-radius: 8px; border: none; cursor: pointer;
      font-size: 0.92rem; font-weight: bold; font-family: inherit; transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:active:not(:disabled) { opacity: 0.75; }
    .btn-save   { background: var(--green); color: #fff; }
    .btn-import { background: var(--card); color: var(--green); border: 1.5px solid var(--green); }

    /* ── ボード（今後の清掃予定タブ） ── */
    .board-stats {
      display: flex; gap: 0.5rem; background: var(--card); border-radius: 8px;
      padding: 0.7rem 0.5rem; margin-bottom: 0.75rem;
    }
    .bstat { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .bstat-n { font-size: 1.4rem; font-weight: bold; color: var(--green); }
    .bstat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .board-wrap { overflow-x: auto; padding-bottom: 0.75rem; }
    .board-cols { display: flex; gap: 0.55rem; min-width: min-content; }
    .bcol {
      min-width: 130px; max-width: 155px; background: var(--card); border-radius: 8px;
      padding: 0.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.07); flex-shrink: 0;
    }
    .bcol-title {
      font-size: 0.82rem; font-weight: bold; text-align: center;
      background: var(--bg); border-radius: 4px; padding: 0.35rem; margin-bottom: 0.4rem;
    }
    .bprop {
      display: flex; flex-direction: column;
      padding: 0.38rem 0; border-bottom: 1px solid var(--bg); font-size: 0.8rem;
    }
    .bprop:last-child { border-bottom: none; }
    .bprop-top { display: flex; align-items: center; gap: 0.3rem; }
    .bprop-icon { flex-shrink: 0; font-size: 0.88rem; }
    .bprop-name { flex: 1; word-break: break-word; }
    .no-report { color: #aaa; font-size: 0.74rem; }
    .refresh-note { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 0.5rem; }

    /* ── 共通メッセージ ── */
    .msg { color: var(--muted); text-align: center; padding: 2rem 1rem; font-size: 0.88rem; }

    /* ── 確認モーダル ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-box {
      background: var(--card); border-radius: 12px; padding: 1.5rem 1.25rem;
      max-width: 300px; width: calc(100% - 2rem); text-align: center;
    }
    .modal-box p { margin-bottom: 0.5rem; font-size: 0.92rem; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }

    /* ── トースト ── */
    #toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); color: #fff; padding: 0.65rem 1.1rem;
      border-radius: 8px; font-size: 0.88rem; z-index: 100; white-space: nowrap;
      pointer-events: none; transition: opacity 0.25s;
    }
    #toast[hidden] { display: none; }

    /* ── 対応追加 ── */
    .bprop-bottom {
      display: flex; flex-wrap: wrap; align-items: center;
      margin-top: 0.3rem; gap: 0.35rem;
    }
    .task-badge {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: #fff3e0; color: #e65100; border: 1px solid #ffcc80;
      border-radius: 20px; padding: 0 0.55rem; font-size: 0.72rem;
      font-weight: bold; cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .task-badge:active { opacity: 0.7; }
    .btn-add-task {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--green); color: #fff; border: none; border-radius: 4px;
      padding: 0 0.6rem; font-size: 0.72rem; font-weight: bold;
      cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .btn-add-task:active { opacity: 0.75; }
    .btn-resend {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--green); border: 1px solid var(--green);
      border-radius: 4px; padding: 0 0.6rem; font-size: 0.72rem; font-weight: bold;
      cursor: pointer; white-space: nowrap; min-height: 44px;
    }
    .btn-resend:active { opacity: 0.75; }
    .board-add-row { margin-bottom: 0.6rem; }
    .btn-board-add {
      width: 100%; padding: 0.55rem; border-radius: 7px;
      border: 1.5px dashed var(--green); background: transparent;
      color: var(--green); font-size: 0.88rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-board-add:active { background: #f0faf5; }

    /* ── タスク登録モーダル ── */
    .task-modal-box {
      background: var(--card); border-radius: 14px;
      padding: 1.25rem; max-width: 340px; width: calc(100% - 2rem);
      max-height: 90vh; overflow-y: auto;
    }
    .task-modal-title {
      font-size: 1rem; font-weight: bold; margin-bottom: 0.9rem; text-align: center;
    }
    .task-modal-prop {
      font-size: 0.82rem; color: var(--muted); text-align: center;
      margin-top: -0.5rem; margin-bottom: 0.9rem;
    }
    .form-row { margin-bottom: 0.8rem; }
    .form-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; display: block; }
    .form-sel, .form-input, .form-textarea {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .form-textarea { height: 80px; resize: vertical; }
    .toggle-row { display: flex; gap: 0.5rem; }
    .toggle-btn {
      flex: 1; padding: 0.45rem; border: 1.5px solid var(--border); border-radius: 6px;
      background: var(--bg); font-size: 0.88rem; font-family: inherit; cursor: pointer;
    }
    .toggle-btn.selected {
      border-color: var(--green); background: #e8f5e9; color: var(--green); font-weight: bold;
    }
    .form-date-input {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.9rem; font-family: inherit; background: var(--card);
    }
    .char-count { font-size: 0.75rem; color: var(--muted); text-align: right; margin-top: 0.2rem; }
    .char-count.over { color: #c00; }

    /* ── タスクドロワー ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 40;
    }
    .drawer-overlay[hidden] { display: none; }
    .drawer-box {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-radius: 14px 14px 0 0;
      padding: 1rem; max-height: 75vh; overflow-y: auto; z-index: 45;
    }
    .drawer-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 0.75rem; }
    .task-item {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 0.75rem; margin-bottom: 0.55rem; background: var(--bg);
    }
    .task-item-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
    .task-type-badge {
      font-size: 0.7rem; font-weight: bold; padding: 0.15rem 0.45rem;
      border-radius: 10px; background: #e3f2fd; color: #1565c0;
    }
    .task-date-label { font-size: 0.75rem; color: var(--muted); }
    .task-date-display { font-size: 0.95rem; font-weight: 600; color: var(--green); padding: 0.15rem 0; }
    .task-expired-label {
      font-size: 0.7rem; color: #c00; font-weight: bold;
      background: #fce4ec; border-radius: 4px; padding: 0.1rem 0.35rem;
    }
    .task-content { font-size: 0.86rem; margin-bottom: 0.45rem; }
    .task-photo-tag {
      font-size: 0.72rem; color: #e65100; background: #fff3e0;
      border-radius: 4px; padding: 0.1rem 0.35rem; display: inline-block; margin-bottom: 0.45rem;
    }
    .task-actions { display: flex; gap: 0.5rem; }
    .btn-task-done {
      flex: 1; padding: 0.4rem; border: none; border-radius: 6px;
      background: var(--green); color: #fff; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-done:active { opacity: 0.75; }
    .btn-task-cancel {
      flex: 1; padding: 0.4rem; border: 1.5px solid #aaa; border-radius: 6px;
      background: transparent; color: #555; font-size: 0.82rem; font-weight: bold;
      font-family: inherit; cursor: pointer;
    }
    .btn-task-cancel:active { opacity: 0.75; }
    .drawer-empty { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 1rem 0; }
    .drawer-prop-sel {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.92rem; font-family: inherit;
      background: var(--card); margin-bottom: 0.9rem;
    }

    /* ── 進捗確認タブ ── */
    .progress-stats {
      display: flex; gap: 0.5rem; background: var(--card); border-radius: 8px;
      padding: 0.7rem 0.5rem; margin-bottom: 0.75rem;
    }
    .pstat { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .pstat-n { font-size: 1.05rem; font-weight: bold; color: var(--green); }
    .pstat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .view-toggle { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .view-btn {
      flex: 1; padding: 0.55rem; border-radius: 6px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.88rem; cursor: pointer; font-family: inherit;
    }
    .view-btn.active {
      border-color: var(--green); color: var(--green);
      background: #e8f5e9; font-weight: bold;
    }
    .prog-section { margin-bottom: 0.75rem; }
    .prog-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.35rem 0; margin-bottom: 0.4rem; border-bottom: 1px solid var(--border);
    }
    .prog-section-title { font-size: 0.8rem; font-weight: bold; color: var(--muted); }
    .prog-section-remain { font-size: 0.72rem; color: var(--muted); }

    /* ── タイルグリッド ── */
    .prog-tiles-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3rem; }
    .prog-tiles-staff { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.3rem; }
    .prog-tile {
      background: var(--card); border-radius: 6px; padding: 0.4rem 0.45rem;
      min-height: 56px; cursor: pointer; border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      display: flex; flex-direction: column; gap: 0.1rem;
      text-align: left; font-family: inherit; width: 100%;
    }
    .prog-tile.doing       { background: #e3f2fd; border-color: #90caf9; }
    .prog-tile.done        { background: #f0f0f0; border-color: #ccc; }
    .prog-tile.linen-stage { background: #fffde7; border-color: #ffe082; }
    .prog-tile:active { opacity: 0.75; }
    .prog-tile-nameline {
      display: flex; align-items: flex-start; gap: 0.18rem; flex: 1; min-width: 0;
    }
    .prog-tile-num {
      flex-shrink: 0; font-size: 0.58rem; font-weight: bold;
      line-height: 1.7; background: rgba(0,0,0,0.09); color: #333;
      border-radius: 2px; padding: 0 0.2rem; margin-top: 0.02rem;
    }
    .prog-tile-stage {
      font-size: 0.6rem; color: #e65100; font-weight: bold; line-height: 1.3;
    }
    .prog-tile-name {
      font-size: 0.78rem; font-weight: bold; word-break: break-word;
      overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      flex: 1; line-height: 1.25;
    }
    .prog-tile.done .prog-tile-name { color: #777; }
    .prog-tile-staff {
      font-size: 0.65rem; color: var(--muted);
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .prog-tile-staff.unset { color: #c62828; font-weight: bold; }
    .prog-tile-marks { display: flex; gap: 0.2rem; flex-wrap: wrap; margin-top: 0.05rem; }
    .prog-mark {
      font-size: 0.6rem; padding: 0.05rem 0.22rem; border-radius: 3px;
      font-weight: bold; line-height: 1.4; white-space: nowrap;
    }
    .prog-mark-linen      { background: #e0e0e0; color: #666; }
    .prog-mark-linen-done { background: #c8e6c9; color: #2e7d32; }
    .prog-mark-trash      { background: #ffcdd2; color: #b71c1c; }
    .prog-mark-trash-done { background: #c8e6c9; color: #2e7d32; }
    .prog-mark-check      { background: #fff9c4; color: #f57f17; }
    .prog-mark-check-done { background: #c8e6c9; color: #2e7d32; }

    /* ── 進捗編集ドロワー ── */
    .ped-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 0.9rem; gap: 0.5rem;
    }
    .ped-prop-name { font-size: 0.95rem; font-weight: bold; flex: 1; word-break: break-word; }
    .ped-close-btn {
      width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 50%;
      background: var(--bg); cursor: pointer; font-size: 0.82rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ped-close-btn:active { background: var(--border); }
    .ped-section { margin-bottom: 0.75rem; }
    .ped-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; }
    .ped-status-row { display: flex; gap: 0.4rem; }
    .ped-status-btn {
      flex: 1; padding: 0.45rem 0.2rem; border-radius: 6px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.82rem; font-family: inherit; cursor: pointer; text-align: center; color: #888;
    }
    .ped-status-btn.active-todo  { border-color: #555; background: #fff; color: #333; font-weight: bold; }
    .ped-status-btn.active-doing { border-color: #1976d2; background: #e3f2fd; color: #1565c0; font-weight: bold; }
    .ped-status-btn.active-done  { border-color: #888; background: #e0e0e0; color: #555; font-weight: bold; }
    .ped-ind-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.35rem; }
    .ped-ind-label { font-size: 0.8rem; width: 3.5em; flex-shrink: 0; color: #555; }
    .ped-ind-btn {
      flex: 1; padding: 0.38rem 0.4rem; border-radius: 6px; font-size: 0.8rem;
      border: 1.5px solid var(--border); background: var(--bg);
      font-family: inherit; cursor: pointer; text-align: center;
    }
    .ped-ind-btn.linen-todo { background: var(--bg); color: var(--muted); }
    .ped-ind-btn.linen-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .ped-ind-btn.trash-none { background: var(--bg); color: var(--muted); }
    .ped-ind-btn.trash-need { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
    .ped-ind-btn.trash-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .ped-ind-btn.check-none { background: var(--bg); color: var(--muted); }
    .ped-ind-btn.check-need { background: #fffde7; color: #f57f17; border-color: #fff176; }
    .ped-ind-btn.check-done { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .ped-ind-back-btn {
      padding: 0.3rem 0.5rem; border-radius: 6px; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--bg);
      font-size: 0.72rem; font-family: inherit; cursor: pointer; color: var(--muted);
    }
    .ped-ind-back-btn:active { background: var(--border); }
    .btn-ped-tasks {
      width: 100%; padding: 0.5rem; border-radius: 6px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.85rem; font-family: inherit; cursor: pointer; text-align: center; color: #555;
    }
    .btn-ped-tasks:active { background: var(--border); }

    /* ── 今後の清掃予定タブ：検索 ── */
    .sched-search {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.92rem; font-family: inherit; background: var(--card);
      margin-bottom: 0.65rem; display: block;
    }

    /* ── 今後の清掃予定タブ：行リスト ── */
    /* ── 担当別 / エリア別 切り替え ── */
    .sched-grouping-bar { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; }
    .sched-grouping-btn {
      flex: 1; padding: 0.35rem 0; border-radius: 6px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.82rem; font-family: inherit; cursor: pointer; text-align: center; color: var(--muted);
    }
    .sched-grouping-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sched-grouping-btn:active:not(.active) { background: var(--border); }
    .sched-staff-label {
      padding: 0.3rem 0.75rem; font-size: 0.8rem; font-weight: bold;
      color: #555; background: #e8eaf6; border-bottom: 1px solid var(--border);
    }
    .sched-area-inline {
      font-size: 0.7rem; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 0 0.25rem; margin-left: 0.2rem; flex-shrink: 0;
    }
    /* ── タップ順モード ── */
    .btn-order-mode {
      width: 100%; padding: 0.45rem; border-radius: 6px;
      border: 1.5px solid var(--accent); background: var(--bg);
      font-size: 0.85rem; font-family: inherit; cursor: pointer; color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .btn-order-mode:active { background: #e8eaf6; }
    .order-mode-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .order-mode-title { font-weight: bold; font-size: 0.9rem; flex-shrink: 0; }
    .order-mode-staff-sel {
      flex: 1; padding: 0.3rem 0.4rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.85rem; font-family: inherit; background: var(--card);
    }
    .order-mode-list { background: var(--card); border-radius: 8px; overflow: hidden; margin-bottom: 0.5rem; }
    .order-tap-row {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .order-tap-row:last-child { border-bottom: none; }
    .order-tap-row:active { background: #f0f4ff; }
    .order-tap-row.tapped { background: #e8f5e9; }
    .order-tap-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 1.4rem; height: 1.4rem; border-radius: 50%;
      font-size: 0.75rem; font-weight: bold; flex-shrink: 0;
      border: 1.5px solid var(--border); background: var(--bg); color: var(--muted);
    }
    .order-tap-row.tapped .order-tap-badge {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .order-tap-name { font-size: 0.88rem; flex: 1; }
    .order-mode-actions { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .order-mode-actions .btn { flex: 1; }
    .sched-list { background: var(--card); border-radius: 8px; overflow: hidden; margin-bottom: 0.75rem; }
    .sched-row { border-bottom: 1px solid var(--border); }
    .sched-row:last-child { border-bottom: none; }
    .sched-row-main {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 0.65rem; min-height: 44px; cursor: pointer;
    }
    .sched-row-main:active { background: var(--bg); }
    .sched-prop-name { flex: 1; font-size: 0.88rem; font-weight: 600; word-break: break-word; }
    .sched-order-num {
      font-size: 0.72rem; font-weight: bold; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      padding: 0 0.3rem; margin-right: 0.3rem; flex-shrink: 0;
    }
    .sched-type-badge-in {
      font-size: 0.68rem; font-weight: bold; color: #1565c0; background: #e3f2fd;
      border-radius: 8px; padding: 0.12rem 0.4rem; white-space: nowrap; flex-shrink: 0;
    }
    .sched-type-badge-out {
      font-size: 0.68rem; font-weight: bold; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 0.12rem 0.4rem;
      white-space: nowrap; flex-shrink: 0;
    }
    .sched-staff {
      font-size: 0.75rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; max-width: 80px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .sched-staff.unassigned { color: #c62828; font-weight: bold; }
    .sched-task-cnt {
      font-size: 0.68rem; font-weight: bold; color: #e65100; background: #fff3e0;
      border: 1px solid #ffcc80; border-radius: 10px; padding: 0.1rem 0.4rem;
      white-space: nowrap; flex-shrink: 0;
    }
    .sched-chevron { font-size: 0.65rem; color: var(--muted); flex-shrink: 0; transition: transform 0.15s; }
    .sched-row.expanded .sched-chevron { transform: rotate(180deg); }

    /* 展開エリア */
    .sched-expand {
      padding: 0.6rem 0.65rem 0.65rem; border-top: 1px solid var(--border); background: #fafafa;
    }
    .sched-assign-section {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .sched-assign-label { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    .sched-staff-sel {
      flex: 1; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 5px;
      font-size: 0.82rem; font-family: inherit; background: var(--card); color: #333;
    }
    .sched-staff-sel:disabled { background: var(--bg); color: var(--muted); }
    .sched-detail-btn {
      background: transparent; border: none; color: var(--green); font-size: 0.82rem;
      font-family: inherit; cursor: pointer; padding: 0.3rem 0; font-weight: bold;
      display: block; width: 100%; text-align: left;
    }
    .sched-detail-btn:active { opacity: 0.7; }

    /* 詳細設定エリア（タスク） */
    .sched-tasks-section { padding-top: 0.55rem; border-top: 1px solid var(--border); margin-top: 0.4rem; }
    .sched-task-item {
      border: 1px solid var(--border); border-radius: 7px;
      padding: 0.55rem 0.65rem; margin-bottom: 0.45rem; background: var(--card);
    }
    .sched-tasks-empty { font-size: 0.82rem; color: var(--muted); padding: 0.4rem 0; }
    .btn-sched-add-task {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--green); color: #fff; border: none; border-radius: 5px;
      padding: 0.4rem 0.7rem; font-size: 0.8rem; font-weight: bold;
      font-family: inherit; cursor: pointer; margin-top: 0.4rem;
    }
    .btn-sched-add-task:active { opacity: 0.75; }
    .btn-sched-resend {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--green); border: 1px solid var(--green);
      border-radius: 5px; padding: 0.4rem 0.7rem; font-size: 0.8rem; font-weight: bold;
      font-family: inherit; cursor: pointer; margin-top: 0.4rem; margin-left: 0.4rem;
    }
    .btn-sched-resend:active { opacity: 0.75; }
    .sched-default-section {
      border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.45rem;
    }
    .sched-default-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.3rem; }
    .sched-default-row { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.25rem; }
    .sched-default-name { font-size: 0.78rem; width: 5.5em; flex-shrink: 0; }
    .btn-sched-default {
      padding: 0.28rem 0.6rem; border-radius: 5px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 0.78rem; font-family: inherit; cursor: pointer; color: var(--muted);
    }
    .btn-sched-default.is-on { background: #fffde7; color: #f57f17; border-color: #fff176; }
    .btn-sched-default:active { opacity: 0.75; }

    /* ── 検索モード：日付ラベル・件数超過 ── */
    .sched-date-label {
      font-size: 0.72rem; color: var(--muted); white-space: nowrap; flex-shrink: 0;
    }
    .sched-search-more {
      text-align: center; padding: 0.55rem; font-size: 0.82rem; color: var(--muted);
    }
    .sched-status-badge {
      display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.4rem;
      border-radius: 3px; margin-left: 0.3rem; vertical-align: middle;
    }
    .sched-status-badge.changed { background: #e3f2fd; color: #1565c0; }
    .sched-status-badge.manual  { background: #f3e5f5; color: #6a1b9a; }
    .sched-status-badge.pending { background: #fff8e1; color: #e65100; }
    .sched-status-badge.error   { background: #ffebee; color: #c62828; }
    .sched-date-change-section {
      border-top: 1px solid var(--border); margin-top: 0.5rem; padding-top: 0.45rem;
    }
    .sched-date-change-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.3rem; }
    .sched-date-change-row {
      display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem;
      font-size: 0.82rem;
    }
    .sched-date-change-row label { color: var(--muted); flex-shrink: 0; }
    .sched-date-change-row input[type="date"] {
      flex: 1; padding: 0.3rem 0.4rem; border: 1px solid var(--border); border-radius: 5px;
      font-size: 0.82rem; font-family: inherit;
    }
    .btn-sched-change-date {
      background: var(--green); color: #fff; border: none; border-radius: 5px;
      padding: 0.3rem 0.6rem; font-size: 0.78rem; font-family: inherit; cursor: pointer;
    }
    .btn-sched-change-date:active { opacity: 0.75; }
    .btn-sched-clear-date {
      background: transparent; color: #c00; border: 1px solid #c00; border-radius: 5px;
      padding: 0.3rem 0.6rem; font-size: 0.78rem; font-family: inherit; cursor: pointer;
    }
    .btn-sched-clear-date:active { opacity: 0.75; }
  </style>
</head>

<body>
  <div id="loading" class="fill">
    <span class="spin" style="font-size:2rem">↻</span>
    <span>読み込み中…</span>
  </div>
  <div id="error" class="fill" hidden></div>

  <div id="app" hidden>
    <div id="session-banner" class="session-banner" hidden>
      ログインの有効期限が切れました。画面を開き直してください
    </div>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="progress">進捗確認</button>
      <button class="tab-btn"        data-tab="schedule">今後の清掃予定</button>
    </nav>

    <!-- 進捗確認タブ -->
    <div id="panel-progress" class="panel">
      <div class="date-row">
        <label for="progress-date-sel">日付</label>
        <input type="date" id="progress-date-sel">
      </div>
      <div class="progress-stats" id="progress-stats">
        <div class="pstat">
          <span class="pstat-n" id="ps-done">─/─</span>
          <span class="pstat-l">完了</span>
        </div>
        <div class="pstat">
          <span class="pstat-n" id="ps-samedayin">─/─</span>
          <span class="pstat-l">同日イン</span>
        </div>
        <div class="pstat">
          <span class="pstat-n" id="ps-notin">─/─</span>
          <span class="pstat-l">インなし</span>
        </div>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="vbtn-staff" data-view="staff">スタッフ別</button>
        <button class="view-btn"        id="vbtn-board" data-view="board">進捗ボード</button>
      </div>
      <div id="progress-staff-view"></div>
      <div id="progress-board-view" hidden></div>
      <div class="refresh-note" id="progress-refresh-note">30秒ごとに自動更新</div>
    </div>

    <!-- 今後の清掃予定タブ -->
    <div id="panel-schedule" class="panel" hidden>
      <div class="date-row">
        <label for="board-date-sel">日付</label>
        <input type="date" id="board-date-sel">
      </div>
      <input type="search" id="sched-search" class="sched-search" placeholder="物件名で絞り込み">
      <div class="board-stats">
        <div class="bstat"><span class="bstat-n" id="s-total">-</span><span class="bstat-l">清掃</span></div>
        <div class="bstat"><span class="bstat-n" id="s-samedayin">-</span><span class="bstat-l">同日イン</span></div>
        <div class="bstat"><span class="bstat-n" id="s-notin">-</span><span class="bstat-l">インなし</span></div>
        <div class="bstat"><span class="bstat-n" id="s-tasks">-</span><span class="bstat-l">対応予定</span></div>
      </div>
      <div class="sched-grouping-bar" id="sched-grouping-bar" hidden>
        <button class="sched-grouping-btn active" id="btn-group-area">エリア別</button>
        <button class="sched-grouping-btn"        id="btn-group-staff">担当別</button>
      </div>
      <div id="order-mode-bar" hidden>
        <button id="btn-order-mode" class="btn-order-mode">順番を決める</button>
      </div>
      <div id="order-mode-panel" hidden>
        <div class="order-mode-header">
          <span class="order-mode-title">順番を決める</span>
          <select id="order-mode-staff-sel" class="order-mode-staff-sel">
            <option value="">-- スタッフを選ぶ --</option>
          </select>
        </div>
        <div id="order-mode-list" class="order-mode-list"></div>
        <div class="order-mode-actions">
          <button id="btn-order-reset"  class="btn btn-import">やり直し</button>
          <button id="btn-order-cancel" class="btn btn-import">キャンセル</button>
          <button id="btn-order-confirm" class="btn btn-save">確定</button>
        </div>
      </div>
      <div id="sched-list" class="sched-list"></div>
      <div class="refresh-note" id="refresh-note">30秒ごとに自動更新</div>
    </div>
  </div>

  <!-- タスク登録モーダル -->
  <div id="task-modal" class="modal-overlay" hidden>
    <div class="task-modal-box">
      <div class="task-modal-title">対応追加</div>
      <div class="task-modal-prop" id="task-modal-prop"></div>
      <div class="form-row">
        <label class="form-label">種類</label>
        <select id="task-type" class="form-sel">
          <option value="WORK">作業追加（WORK）</option>
          <option value="TIME">時間変更（TIME）</option>
          <option value="CARRY">持ち込み（CARRY）</option>
          <option value="OTHER">その他（OTHER）</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">内容 <span id="task-char-count" class="char-count">0 / 200</span></label>
        <textarea id="task-content" class="form-textarea" placeholder="内容を入力（必須・200文字以内）" maxlength="200"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">写真</label>
        <div class="toggle-row">
          <button class="toggle-btn" data-val="false" id="photo-no">不要</button>
          <button class="toggle-btn" data-val="true"  id="photo-yes">必要</button>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">日付</label>
        <div class="task-date-display" id="task-modal-date"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-import" id="task-modal-cancel">キャンセル</button>
        <button class="btn btn-save"   id="task-modal-submit">登録</button>
      </div>
    </div>
  </div>

  <!-- タスク一覧ドロワー -->
  <div id="task-drawer" class="drawer-overlay" hidden>
    <div class="drawer-box">
      <div class="drawer-title" id="drawer-title">対応一覧</div>
      <div id="drawer-body"></div>
    </div>
  </div>

  <!-- 競合確認モーダル -->
  <div id="conflict-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <p>他の人が先に保存しました。</p>
      <p>再読込すると、入力中の内容は消えます。</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-import">キャンセル</button>
        <button id="modal-reload" class="btn btn-save">再読込</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <!-- 進捗編集ドロワー -->
  <div id="prog-edit-drawer" class="drawer-overlay" hidden>
    <div class="drawer-box">
      <div class="ped-header">
        <div class="ped-prop-name" id="ped-prop-name">─</div>
        <button id="ped-close" class="ped-close-btn">✕</button>
      </div>
      <div class="ped-section">
        <div class="ped-label">清掃の状況</div>
        <div class="ped-status-row">
          <button class="ped-status-btn" data-ped-status="TODO">未開始</button>
          <button class="ped-status-btn" data-ped-status="DOING">清掃中</button>
          <button class="ped-status-btn" data-ped-status="DONE">清掃完了</button>
        </div>
      </div>
      <div id="ped-staff-section" class="ped-section">
        <div class="ped-label">担当</div>
        <select id="ped-staff-sel" class="form-sel"></select>
      </div>
      <div id="ped-indicators-section" class="ped-section" hidden>
        <div class="ped-label">リネン・ゴミ・チェック</div>
        <div class="ped-ind-row">
          <span class="ped-ind-label">リネン</span>
          <button id="ped-linen-btn" class="ped-ind-btn linen-todo">リネン未</button>
          <button id="ped-linen-back" class="ped-ind-back-btn" hidden>戻す</button>
        </div>
        <div class="ped-ind-row">
          <span class="ped-ind-label">ゴミ</span>
          <button id="ped-trash-btn" class="ped-ind-btn trash-none">オフ</button>
          <button id="ped-trash-back" class="ped-ind-back-btn" hidden>戻す</button>
        </div>
        <div class="ped-ind-row">
          <span class="ped-ind-label">チェック</span>
          <button id="ped-check-btn" class="ped-ind-btn check-none">オフ</button>
          <button id="ped-check-back" class="ped-ind-back-btn" hidden>戻す</button>
        </div>
      </div>
      <div class="ped-section">
        <button id="ped-tasks-btn" class="btn-ped-tasks">対応を見る</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    var CFG = window.DISPATCH_CONFIG || {};

    // ── 楽観的更新の二重送信防止フラグ ────────────────────────────────
    var _progressPending      = {};   // { [propName]: true } — updateProgressField 中
    var _staffPendingProgress = false;  // changeProgressStaff 中
    var _staffPendingSchedule = false;  // changeScheduleStaff 中

    // ── 状態 ──────────────────────────────────────────────────────────
    var S = {
      idToken:            null,
      currentDate:        null,
      boardDate:          null,
      progressDate:       null,
      items:              [],
      cleaners:           [],
      latestUpdatedAt:    null,
      busy:               false,
      updating:           false,
      taskCounts:         {},
      activeProps:        [],
      sessionExpired:     false,
      activeTab:          'progress',
      boardTimer:         null,
      progressTimer:      null,
      activeProgressView: 'staff',
      progressItems:          [],   // スケジュール行（isSameDayIn / staff / uid / order）
      progressData:           {},   // { propertyName: { status, linen, trash, check, orderIndex, updatedAt } }
      progressDefaults:       {},   // { propertyName: { checkDefault, trashDefault } }
      progressAssignUpdatedAt: null, // 進捗確認タブで担当変更するときの衝突検知用
      // 今後の清掃予定タブ
      scheduleItems:           [],   // {propertyName, uid, date, staff, order, isSameDayIn, taskCount}
      scheduleAssignUpdatedAt: null, // saveAssignments の衝突検知
      scheduleProgressData:    {},   // boardDate===today のときの progressData（DONE チェック用）
      scheduleExpandedKey:     null, // 展開中の行キー（"propName\tdate"）
      scheduleDetailKey:       null, // 詳細設定が開いている行キー
      scheduleTasks:           {},   // {[propName]: tasks[]} lazy キャッシュ
      scheduleSearchText:      '',   // 検索テキスト
      // 複数日検索
      scheduleSearchFetched:   false, // getScheduleRange フェッチ済みか
      scheduleSearchItems:     [],    // [{date, propertyName, uid, staff, isSameDayIn, order, taskCount}]
      scheduleSearchByDate:    {},    // { [date]: { items: [...], latestUpdatedAt } }
      scheduleSearchLoading:   false,  // フェッチ中
      // 表示モード
      scheduleGrouping:        'area', // 'area' | 'staff'
      orderMode:               false,  // タップ順モード中
      orderModeStaff:          '',     // 選択スタッフ
      orderModeTaps:           [],     // タップした uid 順リスト
      isAdmin:                 false,  // saveAssignments 権限あり
      // 進捗編集ドロワー
      editDrawerProp: null,   // 編集中の propertyName
      editDrawerView: null,   // 'board' or 'staff'
      progressFetchedAt: 0,
      scheduleFetchedAt: 0,
      lineRequests: []
    };

    // ── ユーティリティ ─────────────────────────────────────────────────
    function today() {
      var d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function tomorrow() {
      var d = new Date();
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function fmtTime(iso) {
      if (!iso) return '';
      try {
        var d = new Date(iso);
        return d.getHours() + '時' + String(d.getMinutes()).padStart(2, '0') + '分';
      } catch (e) { return ''; }
    }

    function fmtDate(ymd) {
      if (!ymd) return '';
      var parts = ymd.split('-');
      return (parts[1] | 0) + '/' + (parts[2] | 0);
    }

    var AREA_RANK = { '①': 1, '②': 2, '③': 3, '④': 4, '⑤': 5 };
    function areaRank(a) { return AREA_RANK[String(a || '').trim()] || 99; }

    var STATUS_RANK = { 'DONE': 0, 'DOING': 1, 'TODO': 2 };
    function statusRank(s) { return STATUS_RANK[s] !== undefined ? STATUS_RANK[s] : 2; }

    // ── スケジュールタブ：表示バー制御 ───────────────────────────────
    function updateScheduleViewBars() {
      var isSearch = S.scheduleSearchText.trim().length > 0;
      var loaded   = S.scheduleSearchFetched || S.scheduleSearchLoading;
      // グループ切り替えバー: データ読み込み後に表示
      document.getElementById('sched-grouping-bar').hidden = !loaded;
      // 順番を決めるボタン: ADMIN + 単日モード + モード外
      document.getElementById('order-mode-bar').hidden =
        !S.isAdmin || isSearch || S.orderMode;
    }

    // ── タップ順モード ────────────────────────────────────────────────
    function renderOrderModeList() {
      var staff = S.orderModeStaff;
      var listEl = document.getElementById('order-mode-list');
      if (!staff) { listEl.innerHTML = ''; return; }

      var items = S.scheduleItems.filter(function(i) { return (i.staff || '') === staff; });
      items = items.slice().sort(function(a, b) {
        var ar = areaRank(a.area) - areaRank(b.area);
        if (ar) return ar;
        return (a.order || 999) - (b.order || 999);
      });

      var taps = S.orderModeTaps;
      var html = '';
      var _curArea = null;
      items.forEach(function(item) {
        if (item.area !== _curArea) {
          html += '<div class="area-label">' +
            esc(item.area ? 'エリア ' + item.area : 'エリア未設定') + '</div>';
          _curArea = item.area;
        }
        var tapIdx = taps.indexOf(item.uid);
        var isTapped = tapIdx >= 0;
        html += '<div class="order-tap-row' + (isTapped ? ' tapped' : '') +
          '" data-order-uid="' + esc(item.uid) + '">' +
          '<span class="order-tap-badge">' + (isTapped ? String(tapIdx + 1) : '') + '</span>' +
          '<span class="order-tap-name">' + esc(item.propertyName) + '</span>' +
        '</div>';
      });
      listEl.innerHTML = html;
    }

    function enterOrderMode() {
      S.orderMode = true;
      S.orderModeStaff = '';
      S.orderModeTaps  = [];

      var staffList = [];
      S.scheduleItems.forEach(function(i) {
        if (i.staff && staffList.indexOf(i.staff) < 0) staffList.push(i.staff);
      });
      staffList.sort();
      var sel = document.getElementById('order-mode-staff-sel');
      sel.innerHTML = '<option value="">-- スタッフを選ぶ --</option>' +
        staffList.map(function(s) {
          return '<option value="' + esc(s) + '">' + esc(s) + '</option>';
        }).join('');
      sel.value = '';

      document.getElementById('order-mode-bar').hidden    = true;
      document.getElementById('sched-grouping-bar').hidden = true;
      document.getElementById('order-mode-panel').hidden  = false;
      document.getElementById('sched-list').hidden        = true;
      document.getElementById('board-date-sel').disabled  = true;
      document.getElementById('sched-search').disabled    = true;
      renderOrderModeList();
    }

    function exitOrderMode() {
      S.orderMode      = false;
      S.orderModeStaff = '';
      S.orderModeTaps  = [];

      document.getElementById('order-mode-panel').hidden  = true;
      document.getElementById('sched-list').hidden        = false;
      document.getElementById('board-date-sel').disabled  = false;
      document.getElementById('sched-search').disabled    = false;
      updateScheduleViewBars();
    }

    function confirmOrderMode() {
      var staff = S.orderModeStaff;
      if (!staff) { toast('スタッフを選んでください'); return; }

      var dateData = S.scheduleSearchByDate[S.boardDate];
      if (!dateData) { exitOrderMode(); return; }

      var taps = S.orderModeTaps;
      var staffItems = S.scheduleItems.filter(function(i) { return (i.staff || '') === staff; })
        .slice().sort(function(a, b) {
          var ar = areaRank(a.area) - areaRank(b.area);
          if (ar) return ar;
          return (a.order || 999) - (b.order || 999);
        });

      var tappedItems   = taps.map(function(uid) {
        return staffItems.find(function(i) { return i.uid === uid; });
      }).filter(Boolean);
      var untappedItems = staffItems.filter(function(i) { return taps.indexOf(i.uid) < 0; });

      var newOrders = {};
      tappedItems.forEach(function(item, idx)   { newOrders[item.uid] = idx + 1; });
      untappedItems.forEach(function(item, idx) { newOrders[item.uid] = tappedItems.length + idx + 1; });

      // 楽観的更新
      var oldOrders = {};
      dateData.items.forEach(function(i) { oldOrders[i.uid] = i.order; });
      [S.scheduleSearchItems, dateData.items, S.scheduleItems].forEach(function(arr) {
        arr.forEach(function(i) {
          if (newOrders[i.uid] !== undefined) i.order = newOrders[i.uid];
        });
      });
      applyScheduleDate(S.boardDate);
      exitOrderMode();
      renderScheduleList();

      var oldUpdatedAt = dateData.latestUpdatedAt;
      var rows = dateData.items.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });

      callApi({ action: 'saveAssignments', date: S.boardDate, rows: rows, knownUpdatedAt: oldUpdatedAt || '' })
        .then(function(r) {
          if (r.ok) {
            if (r.latestUpdatedAt) {
              dateData.latestUpdatedAt = r.latestUpdatedAt;
              S.scheduleAssignUpdatedAt = r.latestUpdatedAt;
            }
            toast('順番を保存しました。反映まで最大5分かかります');
            return;
          }
          // ロールバック
          [S.scheduleSearchItems, dateData.items, S.scheduleItems].forEach(function(arr) {
            arr.forEach(function(i) { if (oldOrders[i.uid] !== undefined) i.order = oldOrders[i.uid]; });
          });
          dateData.latestUpdatedAt = oldUpdatedAt;
          applyScheduleDate(S.boardDate);
          renderScheduleList();
          if (r.error === 'conflict') {
            toast('他の人が先に保存しました。再読込します');
            loadScheduleTab();
          } else {
            toast('順番の保存エラー: ' + (r.error || '不明'));
          }
        }).catch(function(e) {
          [S.scheduleSearchItems, dateData.items, S.scheduleItems].forEach(function(arr) {
            arr.forEach(function(i) { if (oldOrders[i.uid] !== undefined) i.order = oldOrders[i.uid]; });
          });
          dateData.latestUpdatedAt = oldUpdatedAt;
          applyScheduleDate(S.boardDate);
          renderScheduleList();
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          toast('順番の保存エラー: ' + e.message);
        });
    }

    // ── 担当別表示 ──────────────────────────────────────────────────
    function renderScheduleListStaff() {
      var search       = S.scheduleSearchText.trim().toLowerCase();
      var isSearchMode = search.length > 0;
      var allItems;

      if (isSearchMode) {
        if (S.scheduleSearchLoading) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索中…</div>';
          return;
        }
        if (!S.scheduleSearchFetched) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索データを読み込み中…</div>';
          return;
        }
        allItems = S.scheduleSearchItems.filter(function(i) {
          return i.propertyName.toLowerCase().indexOf(search) >= 0;
        });
      } else {
        allItems = S.scheduleItems;
      }

      if (!allItems.length) {
        document.getElementById('sched-list').innerHTML = isSearchMode
          ? '<div class="msg">「' + esc(S.scheduleSearchText) + '」に一致する物件はありません</div>'
          : '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var pendingByUid = {};
      (S.lineRequests || []).forEach(function(lr) { if (lr.uid) pendingByUid[lr.uid] = lr; });

      // 日付ごとに担当グループを構成（検索モードは複数日）
      var dateList = [];
      var byDate   = {};
      allItems.forEach(function(item) {
        var d = isSearchMode ? item.date : S.boardDate;
        if (!byDate[d]) { byDate[d] = {}; dateList.push(d); }
        var s = item.staff || '';
        if (!byDate[d][s]) byDate[d][s] = [];
        byDate[d][s].push(item);
      });
      if (isSearchMode) dateList.sort();

      var html = '';
      dateList.forEach(function(dt) {
        if (isSearchMode) {
          html += '<div class="sched-date-label">' + esc(fmtDate(dt)) + '</div>';
        }
        var staffMap  = byDate[dt];
        var staffList = Object.keys(staffMap);
        // 未担当を最後、あとは名前順
        staffList.sort(function(a, b) {
          if (a === '') return 1;
          if (b === '') return -1;
          return a < b ? -1 : a > b ? 1 : 0;
        });

        staffList.forEach(function(staffName) {
          var sItems = staffMap[staffName].slice().sort(function(a, b) {
            return (a.order || 9999) - (b.order || 9999);
          });
          html += '<div class="sched-staff-label">' +
            esc(staffName || '未担当') + '（' + sItems.length + '件）</div>';

          sItems.forEach(function(item) {
            var key = item.propertyName + '\t' + item.date;
            var isExpanded = (S.scheduleExpandedKey === key);
            var isDetail   = (S.scheduleDetailKey   === key);
            var areaInline = item.area
              ? '<span class="sched-area-inline">エリア ' + esc(item.area) + '</span>'
              : '';
            html += buildSchedItemHtml(item, {
              isExpanded: isExpanded, isDetail: isDetail,
              showDateLabel: false,
              showResend: !isSearchMode && (dt === today() || dt === tomorrow()),
              pendingByUid: pendingByUid, areaInline: areaInline
            });
          });
        });
      });

      document.getElementById('sched-list').innerHTML = html;
    }

    var toastTimer;
    var CACHE_TTL_MS = 24 * 60 * 60 * 1000;
    var FRESH_MS     = 30 * 1000;

    function lsGet(key) {
      try {
        var raw = localStorage.getItem(key);
        if (!raw) return null;
        var obj = JSON.parse(raw);
        if (!obj || typeof obj.ts !== 'number') return null;
        if (Date.now() - obj.ts > CACHE_TTL_MS) { localStorage.removeItem(key); return null; }
        return obj.data;
      } catch (e) { return null; }
    }

    function lsSet(key, data) {
      try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
    }

    function restoreProgressFromCache(c) {
      if (!c || !Array.isArray(c.progressItems)) return;
      S.progressItems           = c.progressItems;
      S.progressData            = c.progressData            || {};
      S.progressDefaults        = c.progressDefaults        || {};
      S.progressAssignUpdatedAt = c.progressAssignUpdatedAt || null;
      S.taskCounts              = c.taskCounts              || {};
      if (c.cleaners && c.cleaners.length) S.cleaners = c.cleaners;
      updateProgressStats();
      renderProgressStaff(S.progressItems);
      renderProgressBoard(S.progressItems);
    }

    function updateScheduleStats() {
      var sameDayN   = S.scheduleItems.filter(function(i) { return i.isSameDayIn; }).length;
      var notInN     = S.scheduleItems.filter(function(i) { return !i.isSameDayIn; }).length;
      var totalTasks = S.scheduleItems.reduce(function(acc, i) { return acc + i.taskCount; }, 0);
      document.getElementById('s-total').textContent     = S.scheduleItems.length;
      document.getElementById('s-samedayin').textContent = sameDayN;
      document.getElementById('s-notin').textContent     = notInN;
      document.getElementById('s-tasks').textContent     = totalTasks;
    }

    function restoreScheduleFromCache(c) {
      if (!c || !Array.isArray(c.scheduleItems)) return;
      S.scheduleItems           = c.scheduleItems;
      S.scheduleAssignUpdatedAt = c.scheduleAssignUpdatedAt || null;
      S.scheduleProgressData    = c.scheduleProgressData    || {};
      S.taskCounts              = c.taskCounts              || {};
      if (c.cleaners && c.cleaners.length) S.cleaners = c.cleaners;
      S.scheduleTasks = {};
      updateScheduleStats();
      renderScheduleList();
    }

    function restoreScheduleRangeFromCache(c) {
      if (!c || !Array.isArray(c.scheduleSearchItems)) return;
      S.scheduleSearchItems   = c.scheduleSearchItems;
      S.scheduleSearchByDate  = c.scheduleSearchByDate  || {};
      S.scheduleProgressData  = c.scheduleProgressData  || {};
      S.scheduleSearchFetched = true;
      S.isAdmin = true;
      if (c.cleaners && c.cleaners.length) S.cleaners = c.cleaners;
      applyScheduleDate(S.boardDate);
      updateScheduleStats();
      updateScheduleViewBars();
      renderScheduleList();
    }

    // byDate から S.scheduleItems・S.scheduleAssignUpdatedAt・S.taskCounts をセットしソートする
    function applyScheduleDate(date) {
      var dateData = S.scheduleSearchByDate[date] || { items: [], latestUpdatedAt: null };
      S.scheduleItems           = (dateData.items || []).slice();
      S.scheduleAssignUpdatedAt = dateData.latestUpdatedAt || null;
      S.taskCounts = {};
      S.scheduleItems.forEach(function(i) { S.taskCounts[i.propertyName] = i.taskCount; });
      S.scheduleTasks = {};
      S.scheduleItems.sort(function(a, b) {
        var ar = areaRank(a.area) - areaRank(b.area);
        if (ar) return ar;
        return (a.order || 999) - (b.order || 999);
      });
    }

    function toast(msg, ms) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.hidden = true; }, ms || 2500);
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function setBusy(v) {
      S.busy = v;
    }

    function stopBoardTimer() {
      clearInterval(S.boardTimer);
      S.boardTimer = null;
    }

    function startBoardTimer() {
      stopBoardTimer();
      if (!document.hidden && !S.sessionExpired) {
        S.boardTimer = setInterval(function() { loadScheduleTab(true); }, 30000);
      }
    }

    function stopProgressTimer() {
      clearInterval(S.progressTimer);
      S.progressTimer = null;
    }

    function startProgressTimer() {
      stopProgressTimer();
      if (!document.hidden && !S.sessionExpired) {
        S.progressTimer = setInterval(function() { loadProgress(true); }, 30000);
      }
    }

    function handleUnauthorized() {
      stopBoardTimer();
      stopProgressTimer();
      S.sessionExpired = true;
      document.getElementById('session-banner').hidden = false;
      var msg = '<div class="msg">ログインの有効期限が切れました。画面を開き直してください</div>';
      document.getElementById('sched-list').innerHTML          = msg;
      document.getElementById('progress-staff-view').innerHTML = msg;
      document.getElementById('progress-board-view').innerHTML = '';
    }

    // ── 競合確認モーダル ──────────────────────────────────────────────
    function showConflictModal(onReload) {
      var modal = document.getElementById('conflict-modal');
      modal.hidden = false;
      document.getElementById('modal-cancel').onclick = function() {
        modal.hidden = true;
        setBusy(false);
      };
      document.getElementById('modal-reload').onclick = function() {
        modal.hidden = true;
        onReload();
      };
    }

    // ── API ──────────────────────────────────────────────────────────
    function callApi(body) {
      body.idToken = S.idToken;
      return fetch(CFG.GAS_API_URL + '?api=1', {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body:    JSON.stringify(body)
      }).then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function(data) {
        if (data && data.error === 'unauthorized') {
          var err = new Error('unauthorized');
          err.isUnauthorized = true;
          throw err;
        }
        return data;
      });
    }

    // ── 物件名検索：複数日データ取得 ─────────────────────────────────
    function loadScheduleSearchData() {
      // 範囲データは loadScheduleTab が取得済み。未取得なら取得を開始して描画を待つ。
      if (!S.scheduleSearchFetched && !S.scheduleSearchLoading) {
        loadScheduleTab();
      } else {
        renderScheduleList();
      }
    }

    // ── 今後の清掃予定タブ ────────────────────────────────────────────
    // getScheduleRange(today〜+90) を一度取得して S.scheduleSearchItems/ByDate に保持する。
    // 日付切り替えは保持データから applyScheduleDate() でノーコスト切替。
    function loadScheduleTab(silent) {
      if (S.sessionExpired) return;
      if (silent) {
        if (_staffPendingSchedule || S.scheduleDetailKey ||
            !document.getElementById('task-modal').hidden ||
            !document.getElementById('task-drawer').hidden) return;
      } else {
        var _sc = lsGet('dh_schedule_range');
        if (_sc) {
          restoreScheduleRangeFromCache(_sc);
        } else {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';
        }
      }

      S.scheduleSearchLoading = true;

      var fromDate = today();
      var _d90 = new Date();
      _d90.setDate(_d90.getDate() + 90);
      var toDate = _d90.getFullYear() + '-' +
        String(_d90.getMonth() + 1).padStart(2, '0') + '-' +
        String(_d90.getDate()).padStart(2, '0');

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      var progressProm = callApi({ action: 'getProgress', date: fromDate });

      return Promise.all([
        callApi({ action: 'getScheduleRange', fromDate: fromDate, toDate: toDate }),
        cleanerProm,
        progressProm
      ]).then(function(res) {
        var sr = res[0], cr = res[1], pr = res[2];
        S.scheduleSearchLoading = false;
        if (cr && cr.ok) S.cleaners = cr.cleaners;
        if (!sr.ok) { toast('スケジュールの読み込みに失敗しました'); return; }

        S.scheduleSearchItems   = sr.items  || [];
        S.scheduleSearchByDate  = sr.byDate || {};
        S.scheduleSearchFetched = true;
        S.isAdmin = true;
        S.lineRequests = sr.lineRequests || [];

        // 今日の DONE チェック用
        S.scheduleProgressData = {};
        if (pr && pr.ok) {
          (pr.progress || []).forEach(function(p) {
            S.scheduleProgressData[String(p.property || '').trim()] = p;
          });
          S.progressDefaults = pr.defaults || {};
        }

        applyScheduleDate(S.boardDate);
        updateScheduleStats();

        var now = new Date();
        document.getElementById('refresh-note').textContent =
          '最終更新: ' + now.getHours() + ':' +
          String(now.getMinutes()).padStart(2, '0') + '  ／  30秒ごとに自動更新';

        S.scheduleFetchedAt = Date.now();
        lsSet('dh_schedule_range', {
          scheduleSearchItems:  S.scheduleSearchItems,
          scheduleSearchByDate: S.scheduleSearchByDate,
          scheduleProgressData: S.scheduleProgressData,
          cleaners:             S.cleaners
        });

        updateScheduleViewBars();
        renderScheduleList();
      }).catch(function(e) {
        S.scheduleSearchLoading = false;
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('スケジュール読み込みエラー: ' + e.message);
      });
    }

    var SEARCH_MAX = 30;

    function renderScheduleList() {
      if (S.scheduleGrouping === 'staff') { renderScheduleListStaff(); return; }
      var search       = S.scheduleSearchText.trim().toLowerCase();
      var isSearchMode = search.length > 0;
      var items;

      if (isSearchMode) {
        if (S.scheduleSearchLoading) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索中…</div>';
          return;
        }
        if (!S.scheduleSearchFetched) {
          document.getElementById('sched-list').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 検索データを読み込み中…</div>';
          return;
        }
        items = S.scheduleSearchItems.filter(function(i) {
          return i.propertyName.toLowerCase().indexOf(search) >= 0;
        }).sort(function(a, b) {
          if (a.date < b.date) return -1;
          if (a.date > b.date) return 1;
          var ar = areaRank(a.area) - areaRank(b.area);
          if (ar) return ar;
          return (a.order || 999) - (b.order || 999);
        });
      } else {
        items = S.scheduleItems;
      }

      if (!items.length) {
        document.getElementById('sched-list').innerHTML = isSearchMode
          ? '<div class="msg">「' + esc(S.scheduleSearchText) + '」に一致する物件はありません</div>'
          : '<div class="msg">この日の清掃はありません</div>';
        return;
      }

      var moreCount   = isSearchMode ? Math.max(0, items.length - SEARCH_MAX) : 0;
      var displayItems = isSearchMode ? items.slice(0, SEARCH_MAX) : items;
      var showResend  = isSearchMode ? false : (S.boardDate === today() || S.boardDate === tomorrow());

      var pendingByUid = {};
      (S.lineRequests || []).forEach(function(lr) { if (lr.uid) pendingByUid[lr.uid] = lr; });

      var html = '';
      var _curArea = null, _curAreaDate = null;
      displayItems.forEach(function(item) {
        var pn     = item.propertyName;
        var key    = pn + '\t' + item.date;
        var isExpanded = (S.scheduleExpandedKey === key);
        var isDetail   = (S.scheduleDetailKey   === key);

        var itemDate = isSearchMode ? item.date : null;
        if (item.area !== _curArea || itemDate !== _curAreaDate) {
          html += '<div class="area-label">' +
            esc(item.area ? 'エリア ' + item.area : 'エリア未設定') + '</div>';
          _curArea = item.area;
          _curAreaDate = itemDate;
        }

        html += buildSchedItemHtml(item, {
          isExpanded: isExpanded, isDetail: isDetail,
          showDateLabel: isSearchMode, showResend: showResend,
          pendingByUid: pendingByUid, areaInline: ''
        });
      });

      if (moreCount > 0) {
        html += '<div class="sched-search-more">他にも ' + moreCount + ' 件あります</div>';
      }

      document.getElementById('sched-list').innerHTML = html;
    }

    function buildSchedItemHtml(item, opts) {
      var isExpanded    = opts.isExpanded;
      var isDetail      = opts.isDetail;
      var showDateLabel = opts.showDateLabel;
      var showResend    = opts.showResend;
      var pendingByUid  = opts.pendingByUid || {};
      var areaInline    = opts.areaInline   || '';

      var pn     = item.propertyName;
      var key    = pn + '\t' + item.date;
      var keyEsc = esc(key);
      var pnEsc  = esc(pn);
      var uid    = item.uid || '';

        var typeBadge = item.isSameDayIn
          ? '<span class="sched-type-badge-in">同日イン</span>'
          : '<span class="sched-type-badge-out">インなし</span>';

        var staffLabel = item.staff || '';
        var staffCls   = staffLabel ? 'sched-staff' : 'sched-staff unassigned';
        var staffText  = staffLabel || '未担当';

        var taskBadge = item.taskCount > 0
          ? '<span class="sched-task-cnt">対応' + item.taskCount + '件</span>'
          : '';

        var dateBadge = '';
        var pendingLr = uid ? pendingByUid[uid] : null;
        if (pendingLr) {
          if (pendingLr.result === 'PENDING') dateBadge = '<span class="sched-status-badge pending">反映待ち（最大5分）</span>';
          else if (pendingLr.result === 'ERROR') dateBadge = '<span class="sched-status-badge error">反映に失敗</span>';
        } else if (item.source === 'MANUAL') {
          dateBadge = '<span class="sched-status-badge manual">手入力</span>';
        } else if (item.finalReason === '手動で清掃日変更'
                   || (item.manualDate && item.manualDate !== item.autoDate)) {
          dateBadge = '<span class="sched-status-badge changed">変更済み</span>';
        }

        var dateLabel = showDateLabel
          ? '<span class="sched-date-label">' + esc(fmtDate(item.date)) + '</span>'
          : '';

        var orderNum = (item.order > 0)
          ? '<span class="sched-order-num">' + item.order + '</span>'
          : '';

      var h = '<div class="sched-row' + (isExpanded ? ' expanded' : '') + '" data-sched-key="' + keyEsc + '">';
      h += '<div class="sched-row-main" data-sched-toggle="' + keyEsc + '">' +
          dateLabel +
          orderNum +
          '<span class="sched-prop-name">' + pnEsc + '</span>' +
          areaInline +
          typeBadge +
          '<span class="' + staffCls + '">' + esc(staffText) + '</span>' +
          taskBadge +
          dateBadge +
          '<span class="sched-chevron">▼</span>' +
        '</div>';

        if (isExpanded) {
          // 担当変更セレクト
          var isDone = S.scheduleProgressData[pn] && S.scheduleProgressData[pn].status === 'DONE';
          var selOpts = '<option value=""' + (!item.staff ? ' selected' : '') + '>未担当</option>';
          S.cleaners.forEach(function(c) {
            selOpts += '<option value="' + esc(c.name) + '"' +
              (item.staff === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>';
          });

          h += '<div class="sched-expand">';
          h += '<div class="sched-assign-section">' +
            '<span class="sched-assign-label">担当：</span>' +
            '<select class="sched-staff-sel" data-sched-assign-key="' + keyEsc + '"' +
              (isDone ? ' disabled' : '') + '>' + selOpts + '</select>' +
          '</div>';
          h += '<button class="sched-detail-btn" data-sched-detail-key="' + keyEsc + '">' +
            (isDetail ? '▲ 詳細設定を閉じる' : '▼ 詳細設定') +
          '</button>';

          if (isDetail) {
            h += '<div class="sched-tasks-section">';
            var tasks = S.scheduleTasks[pn];
            if (!tasks) {
              h += '<div class="sched-tasks-empty">読み込み中…</div>';
            } else if (!tasks.length) {
              h += '<div class="sched-tasks-empty">OPEN の対応はありません</div>';
            } else {
              var todayYmd = today();
              tasks.forEach(function(t) {
                var dateLabel = t.targetMode === 'NEXT'
                  ? '次回清掃' + (t.boundDate ? '（' + t.boundDate + '）' : '')
                  : (t.targetDate || '');
                var expired = t.targetMode === 'DATE' && t.targetDate && t.targetDate < todayYmd;
                h += '<div class="sched-task-item">' +
                  '<div class="task-item-header">' +
                    '<span class="task-type-badge">' + esc(t.type) + '</span>' +
                    '<span class="task-date-label">' + esc(dateLabel) + '</span>' +
                    (expired ? '<span class="task-expired-label">期限切れ</span>' : '') +
                  '</div>' +
                  '<div class="task-content">' + esc(t.content) + '</div>' +
                  (t.photoRequired ? '<div class="task-photo-tag">📷 写真必要</div>' : '') +
                  '<div class="task-actions">' +
                    '<button class="btn-task-done" data-sched-tid="' + esc(t.taskId) + '" data-sched-prop="' + pnEsc + '">完了</button>' +
                    '<button class="btn-task-cancel" data-sched-tid="' + esc(t.taskId) + '" data-sched-prop="' + pnEsc + '">取消</button>' +
                  '</div>' +
                '</div>';
              });
            }
            h += '<button class="btn-sched-add-task" data-sched-add-prop="' + pnEsc + '" data-sched-add-date="' + esc(item.date) + '">＋ 対応追加</button>';
            if (showResend) {
              h += '<button class="btn-sched-resend" data-sched-resend-prop="' + pnEsc + '">再送</button>';
            }
            var defs = S.progressDefaults[pn] || {};
            var checkIsOn = defs.checkDefault === 'NEED';
            var trashIsOn = defs.trashDefault === 'NEED';
            h += '<div class="sched-default-section">' +
              '<div class="sched-default-label">初期値（清掃開始時の既定）</div>' +
              '<div class="sched-default-row">' +
                '<span class="sched-default-name">チェック要</span>' +
                '<button class="btn-sched-default' + (checkIsOn ? ' is-on' : '') + '"' +
                  ' data-sched-default-prop="' + pnEsc + '" data-sched-default-field="checkDefault"' +
                  ' data-sched-default-val="' + (checkIsOn ? 'NEED' : '') + '">' +
                  (checkIsOn ? 'ON' : 'OFF') +
                '</button>' +
              '</div>' +
              '<div class="sched-default-row">' +
                '<span class="sched-default-name">ゴミ要回収</span>' +
                '<button class="btn-sched-default' + (trashIsOn ? ' is-on' : '') + '"' +
                  ' data-sched-default-prop="' + pnEsc + '" data-sched-default-field="trashDefault"' +
                  ' data-sched-default-val="' + (trashIsOn ? 'NEED' : '') + '">' +
                  (trashIsOn ? 'ON' : 'OFF') +
                '</button>' +
              '</div>' +
            '</div>';
            // 日程変更セクション（iCal 予約のみ）
            if (item.source !== 'MANUAL') {
              var tomorrowYmd = tomorrow();
              var canChange = item.autoDate && item.autoDate >= tomorrowYmd;
              h += '<div class="sched-date-change-section">' +
                '<div class="sched-date-change-label">日程変更</div>';
              if (canChange) {
                h += '<div class="sched-date-change-row">' +
                  '<label>ICS 日付</label>' +
                  '<span>' + esc(fmtDate(item.autoDate)) + '</span>' +
                '</div>';
                if (item.manualDate) {
                  h += '<div class="sched-date-change-row">' +
                    '<label>現在の設定</label>' +
                    '<span>' + esc(fmtDate(item.manualDate)) + '</span>' +
                    '<button class="btn-sched-clear-date"' +
                      ' data-sched-uid="' + esc(uid) + '"' +
                      ' data-sched-pn="' + pnEsc + '"' +
                      ' data-sched-old="' + esc(item.manualDate) + '">' +
                      '元に戻す' +
                    '</button>' +
                  '</div>';
                }
                h += '<div class="sched-date-change-row">' +
                  '<label>変更後の日付</label>' +
                  '<input type="date" class="sched-new-date-input"' +
                    ' data-sched-uid="' + esc(uid) + '"' +
                    ' min="' + esc(tomorrowYmd) + '">' +
                  '<button class="btn-sched-change-date"' +
                    ' data-sched-uid="' + esc(uid) + '"' +
                    ' data-sched-pn="' + pnEsc + '"' +
                    ' data-sched-old="' + esc(item.autoDate) + '">' +
                    '変更する' +
                  '</button>' +
                '</div>';
              } else {
                h += '<div class="sched-date-change-row">' +
                  '<span style="font-size:0.8rem;color:var(--muted)">日程変更は明日以降の清掃のみ可能です</span>' +
                '</div>';
              }
              h += '</div>';
            }
            h += '</div>';
          }
          h += '</div>';
        }
        h += '</div>';
        return h;
    }

    function changeScheduleStaff(key, newStaff) {
      if (_staffPendingSchedule) return;
      _staffPendingSchedule = true;

      var parts    = key.split('\t');
      var propName = parts[0];
      var date     = parts[1];

      // 検索モード・通常モード共通：scheduleSearchByDate[date] を使う
      var dateData = S.scheduleSearchByDate[date];
      if (!dateData) { _staffPendingSchedule = false; return; }

      var oldStaff = null;
      // scheduleSearchItems・dateData.items・scheduleItems は同一オブジェクトを参照するが明示的に更新
      S.scheduleSearchItems.forEach(function(i) {
        if (i.propertyName === propName && i.date === date) {
          if (oldStaff === null) oldStaff = i.staff || '';
          i.staff = newStaff;
        }
      });
      dateData.items.forEach(function(i) {
        if (i.propertyName === propName) i.staff = newStaff;
      });
      if (date === S.boardDate) {
        S.scheduleItems.forEach(function(i) {
          if (i.propertyName === propName) i.staff = newStaff;
        });
      }
      if (oldStaff === null) oldStaff = '';
      var oldUpdatedAt = dateData.latestUpdatedAt;
      renderScheduleList();

      var rows = dateData.items.map(function(i) {
        return { propertyName: i.propertyName, uid: i.uid || '', staff: i.staff || '', order: i.order || 0 };
      });
      callApi({
        action: 'saveAssignments', date: date, rows: rows, knownUpdatedAt: oldUpdatedAt || ''
      }).then(function(r) {
        _staffPendingSchedule = false;
        if (r.ok) {
          if (r.latestUpdatedAt) {
            dateData.latestUpdatedAt = r.latestUpdatedAt;
            if (date === S.boardDate) S.scheduleAssignUpdatedAt = r.latestUpdatedAt;
          }
          toast('担当を変更しました。反映まで最大5分かかります');
          return;
        }
        // ロールバック
        S.scheduleSearchItems.forEach(function(i) {
          if (i.propertyName === propName && i.date === date) i.staff = oldStaff;
        });
        dateData.items.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        if (date === S.boardDate) {
          S.scheduleItems.forEach(function(i) {
            if (i.propertyName === propName) i.staff = oldStaff;
          });
        }
        dateData.latestUpdatedAt = oldUpdatedAt;
        renderScheduleList();
        if (r.error === 'conflict') {
          toast('他の人が先に保存しました。再読込します');
          loadScheduleTab();
        } else {
          toast('担当変更エラー: ' + (r.error || '不明'));
        }
      }).catch(function(e) {
        _staffPendingSchedule = false;
        S.scheduleSearchItems.forEach(function(i) {
          if (i.propertyName === propName && i.date === date) i.staff = oldStaff;
        });
        dateData.items.forEach(function(i) {
          if (i.propertyName === propName) i.staff = oldStaff;
        });
        if (date === S.boardDate) {
          S.scheduleItems.forEach(function(i) {
            if (i.propertyName === propName) i.staff = oldStaff;
          });
        }
        dateData.latestUpdatedAt = oldUpdatedAt;
        renderScheduleList();
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('担当変更エラー: ' + e.message);
      });
    }

    function openScheduleDetail(propName) {
      if (S.scheduleTasks[propName]) { renderScheduleList(); return; }
      callApi({ action: 'getCleanTasksForProperty', propertyName: propName })
        .then(function(r) {
          S.scheduleTasks[propName] = r.ok ? (r.tasks || []) : [];
          renderScheduleList();
        })
        .catch(function(e) {
          S.scheduleTasks[propName] = [];
          if (e.isUnauthorized) { handleUnauthorized(); return; }
          renderScheduleList();
        });
    }

    // ── 進捗確認タブ ────────────────────────────────────────────────
    function loadProgress(silent) {
      if (S.sessionExpired) return;
      if (silent) {
        var _anyPend = Object.keys(_progressPending).some(function(k) { return _progressPending[k]; });
        if (_anyPend || _reorderPending || _staffPendingProgress ||
            S.editDrawerProp ||
            !document.getElementById('task-modal').hidden ||
            !document.getElementById('task-drawer').hidden) return;
      } else {
        var _pc = lsGet('dh_progress_' + S.progressDate);
        if (_pc) {
          restoreProgressFromCache(_pc);
        } else {
          document.getElementById('progress-staff-view').innerHTML =
            '<div class="msg"><span class="spin">↻</span> 読み込み中…</div>';
          document.getElementById('progress-board-view').innerHTML = '';
        }
      }

      var cleanerProm = S.cleaners.length
        ? Promise.resolve(null)
        : callApi({ action: 'getCleanerList' });

      Promise.all([
        callApi({ action: 'getSchedule', date: S.progressDate }),
        callApi({ action: 'getProgress',  date: S.progressDate }),
        cleanerProm
      ]).then(function(res) {
        var sr = res[0], pr = res[1], cr = res[2];
        if (cr && cr.ok) S.cleaners = cr.cleaners;
        if (!sr.ok) { toast('進捗確認の読み込みに失敗しました'); return; }
        S.taskCounts = sr.taskCounts || {};

        // CleanProgress データをキーマップに
        S.progressData    = {};
        S.progressDefaults = {};
        if (pr && pr.ok) {
          (pr.progress || []).forEach(function(p) {
            S.progressData[p.property] = {
              status:     p.status     || 'TODO',
              linen:      p.linen      || '',
              trash:      p.trash      || '',
              check:      p.check      || '',
              orderIndex: p.orderIndex || 0,
              updatedAt:  p.updatedAt  || ''
            };
          });
          S.progressDefaults = pr.defaults || {};
        }

        var hdr = sr.schedule.header;
        var H = {
          pn:  hdr.indexOf('PropertyName'),
          fd:  hdr.indexOf('Final_CheckoutDate'),
          fs:  hdr.indexOf('Final_AssignedStaff'),
          ord: hdr.indexOf('Order'),
          uid: hdr.indexOf('UID'),
          sdc: hdr.indexOf('Auto_SameDayCheckout')
        };

        var seen = {}, unique = [];
        sr.schedule.rows.forEach(function(row) {
          var k = String(row[H.pn] || '').trim() + '\t' + String(row[H.fd] || '').trim();
          if (!seen[k]) { seen[k] = true; unique.push(row); }
        });

        var am = {};
        (sr.assignments || []).forEach(function(a) {
          var pn = String(a.propertyName || '').trim();
          am[pn + '\t' + (a.uid || '')] = a;
          am['pn\t' + pn]               = a;
        });

        S.progressAssignUpdatedAt = sr.latestUpdatedAt || null;

        S.progressItems = unique.map(function(row) {
          var pn  = String(row[H.pn]  || '').trim();
          var uid = String(row[H.uid] || '').trim();
          var a   = am[pn + '\t' + uid] || am['pn\t' + pn];
          var sdc = H.sdc >= 0 ? String(row[H.sdc] || '').trim() : '';
          return {
            propertyName: pn,
            uid:          uid,
            staff:        a ? String(a.staff || '') : String(row[H.fs] || '').trim(),
            order:        a ? (Number(a.order) || 0) : (Number(row[H.ord]) || 0),
            isSameDayIn:  sdc === 'Yes'
          };
        });

        updateProgressStats();
        renderProgressStaff(S.progressItems);
        renderProgressBoard(S.progressItems);

        var now = new Date();
        document.getElementById('progress-refresh-note').textContent =
          '最終更新: ' + now.getHours() + ':' +
          String(now.getMinutes()).padStart(2, '0') + '  ／  30秒ごとに自動更新';

        S.progressFetchedAt = Date.now();
        lsSet('dh_progress_' + S.progressDate, {
          progressItems:           S.progressItems,
          progressData:            S.progressData,
          progressDefaults:        S.progressDefaults,
          progressAssignUpdatedAt: S.progressAssignUpdatedAt,
          taskCounts:              S.taskCounts,
          cleaners:                S.cleaners
        });
      }).catch(function(e) {
        if (e.isUnauthorized) { handleUnauthorized(); return; }
        toast('進捗確認読み込みエラー: ' + e.message);
      });
    }

    function updateProgressStats() {
      var items = S.progressItems;
      var totalN   = items.length;
      var sameDayN = items.filter(function(i) { return i.isSameDayIn; }).length;
      var notInN   = totalN - sameDayN;

      function isDone(item) {
        var pd = S.progressData[item.propertyName];
        return pd && pd.status === 'DONE';
      }
      var doneN        = items.filter(isDone).length;
      var doneSameDayN = items.filter(function(i) { return i.isSameDayIn && isDone(i); }).length;
      var doneNotInN   = items.filter(function(i) { return !i.isSameDayIn && isDone(i); }).length;

      document.getElementById('ps-done').textContent      = doneN        + '/' + totalN;
      document.getElementById('ps-samedayin').textContent = doneSameDayN + '/' + sameDayN;
      document.getElementById('ps-notin').textContent     = doneNotInN   + '/' + notInN;
    }

    function rerenderProgress() {
      updateProgressStats();
      renderProgressStaff(S.progressItems);
      renderProgressBoard(S.progressItems);
      if (S.editDrawerProp) updateEditDrawer();
    }

    function getEffectiveProgress(propertyName) {
      if (S.progressData[propertyName]) return S.progressData[propertyName];
      var def = S.progressDefaults[propertyName] || {};
      return {
        status:     'TODO',
        linen:      '',
        trash:      def.trashDefault === 'NEED' ? 'NEED' : '',
        check:      def.checkDefault === 'NEED' ? 'NEED' : '',
        orderIndex: 0,
        updatedAt:  ''
      };
    }

    function buildProgTile(item, view, num) {
      var pd     = getEffectiveProgress(item.propertyName);
      var status = pd.status || 'TODO';
      var pn     = item.propertyName;
      var pnEsc  = esc(pn);
