<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>清掃スケジュール</title>
  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:  #00a84f;
      --amber:  #f59e0b;
      --red:    #ef4444;
      --fg:     #222;
      --bg:     #f4f4f4;
      --card:   #fff;
      --border: #e0e0e0;
      --muted:  #888;
    }
    body {
      font-family: -apple-system, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg); color: var(--fg); font-size: 15px; min-height: 100vh;
    }

    /* ── ローディング / エラー ── */
    .fill {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 2rem; text-align: center; gap: 1rem;
    }
    #error-view { color: #c00; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ヘッダー ── */
    .header {
      position: sticky; top: 0; z-index: 20;
      background: var(--green); color: #fff;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1rem;
    }
    .header h1 { font-size: 1rem; font-weight: bold; flex: 1; }
    .header .date-label { font-size: 0.85rem; opacity: 0.9; }

    /* ── 一覧 ── */
    #list-view { padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .empty-msg { text-align: center; color: var(--muted); padding: 3rem 1rem; }

    .prop-card {
      background: var(--card); border-radius: 10px;
      border: 1px solid var(--border);
      padding: 1rem; cursor: pointer;
      display: flex; align-items: center; gap: 0.75rem;
      transition: box-shadow 0.15s;
    }
    .prop-card:active { box-shadow: 0 0 0 2px var(--green); }
    .prop-card .order {
      min-width: 2rem; height: 2rem; border-radius: 50%;
      background: var(--green); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: bold; flex-shrink: 0;
    }
    .prop-card .info { flex: 1; min-width: 0; }
    .prop-card .prop-name {
      font-weight: bold; font-size: 1rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .prop-card .prop-time { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }
    .prop-card .chevron { color: var(--muted); flex-shrink: 0; }

    /* ── ステータスバッジ ── */
    .badge {
      display: inline-block; border-radius: 20px;
      padding: 0.2rem 0.65rem; font-size: 0.8rem; font-weight: bold;
    }
    .badge-todo { background: #e5e7eb; color: #555; }
    .badge-doing { background: #fef3c7; color: #92400e; }
    .badge-done { background: #d1fae5; color: #065f46; }

    /* ── 詳細 ── */
    #detail-view { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 0.3rem;
      color: var(--green); background: none; border: none;
      font-family: inherit; font-size: 0.95rem; cursor: pointer; padding: 0;
    }

    .detail-card {
      background: var(--card); border-radius: 10px;
      border: 1px solid var(--border); padding: 1rem;
    }
    .detail-card h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }

    .detail-row {
      display: flex; gap: 0.5rem; align-items: flex-start;
      padding: 0.4rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--muted); min-width: 5rem; flex-shrink: 0; }
    .detail-val { flex: 1; word-break: break-all; }
    .detail-val a { color: var(--green); }

    /* ── CARRY タスク ── */
    .task-item {
      display: flex; align-items: flex-start; gap: 0.5rem;
      padding: 0.35rem 0; font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
    }
    .task-item:last-child { border-bottom: none; }

    /* ── ボタン ── */
    .btn {
      display: block; width: 100%; padding: 0.9rem;
      border: none; border-radius: 10px; font-size: 1rem;
      font-family: inherit; font-weight: bold; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start  { background: var(--amber); color: #fff; }
    .btn-finish { background: var(--green); color: #fff; }
    .btn-undo   {
      background: none; color: var(--muted);
      border: 1px solid var(--border); font-size: 0.9rem; padding: 0.6rem;
    }

    .btn-row { display: flex; gap: 0.5rem; }
    .btn-row .btn { flex: 1; }
  </style>
</head>
<body>

<!-- ローディング -->
<div id="loading-view" class="fill">
  <span class="spin">⏳</span>
  <span id="loading-msg"></span>
</div>

<!-- エラー -->
<div id="error-view" class="fill" hidden>
  <div style="font-size:2rem">⚠️</div>
  <div id="error-msg"></div>
  <button class="btn btn-start" style="max-width:200px" onclick="location.reload()">再試行</button>
</div>

<!-- アプリ本体 -->
<div id="app" hidden>

  <!-- ヘッダー -->
  <div class="header">
    <h1 id="hdr-title"></h1>
    <span class="date-label" id="hdr-date"></span>
  </div>

  <!-- 一覧ビュー -->
  <div id="list-view"></div>

  <!-- 詳細ビュー -->
  <div id="detail-view" hidden></div>

</div>

<script>
  // ── 辞書（次の段階で言語切替を追加できる構造） ───────────────────────
  var DICT = {
    ja: {
      appTitle:     '清掃スケジュール',
      loading:      '読み込み中...',
      errUnauth:    'ログインが必要です。',
      errLoad:      '読み込みに失敗しました。',
      errConflict:  '他の端末で更新されました。再読み込みします。',
      errNetwork:   '通信エラーが発生しました。',
      empty:        '今日の担当物件はありません。',
      checkinTime:  'チェックイン',
      password:     'パスワード',
      manual:       'マニュアル',
      manualOpen:   'マニュアルを開く',
      photo:        '写真',
      photoOpen:    '写真を開く',
      carryTasks:   '📦 CARRYタスク',
      progress:     '進捗',
      linen:        'リネン',
      trash:        'ゴミ',
      check:        'チェック',
      status:       'ステータス',
      TODO:         '未着手',
      DOING:        '進行中',
      DONE:         '完了',
      btnStart:     '開始',
      btnFinish:    '完了にする',
      btnUndoStart: '開始を取り消す',
      btnUndoFinish:'完了を取り消す',
      startedAt:    '開始時刻',
      finishedAt:   '終了時刻',
      na:           '—',
      back:         '← 一覧に戻る',
      startedAtVal: function(v) { return v ? formatTime(v) : '—'; },
      finishedAtVal:function(v) { return v ? formatTime(v) : '—'; }
    }
  };
  var LANG = 'ja';
  function t(key) { var d = DICT[LANG] || DICT.ja; return d[key] || key; }

  // ── ユーティリティ ───────────────────────────────────────────────────
  var CFG = window.DISPATCH_CONFIG;

  function today() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + dd;
  }

  function formatTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    var h = String(d.getHours()).padStart(2, '0');
    var m = String(d.getMinutes()).padStart(2, '0');
    return h + ':' + m;
  }

  function escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function nowIso() { return new Date().toISOString(); }

  // ── 状態 ────────────────────────────────────────────────────────────
  var S = {
    idToken:  null,
    today:    null,
    rows:     [],
    row:      null,
    busy:     false
  };

  // ── API ─────────────────────────────────────────────────────────────
  function callApi(body) {
    body.idToken = S.idToken;
    return fetch(CFG.GAS_API_URL + '?api=1', {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body:    JSON.stringify(body)
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(data) {
      if (data && data.error === 'unauthorized') {
        var err = new Error('unauthorized');
        err.isUnauthorized = true;
        throw err;
      }
      return data;
    });
  }

  // ── ロード ──────────────────────────────────────────────────────────
  function loadSchedule() {
    setLoading(t('loading'));
    callApi({ action: 'getCleanerSchedule', date: S.today })
      .then(function(data) {
        if (!data.ok) throw new Error(data.error || 'load_failed');
        S.rows = (data.rows || []).slice().sort(function(a, b) {
          return (a.order || 0) - (b.order || 0);
        });
        hideLoading();
        renderList();
      })
      .catch(function(err) {
        if (err.isUnauthorized) showError(t('errUnauth'));
        else showError(t('errLoad') + (err.message ? ' (' + err.message + ')' : ''));
      });
  }

  // ── 一覧レンダリング ─────────────────────────────────────────────────
  function renderList() {
    document.getElementById('detail-view').hidden = true;
    document.getElementById('list-view').hidden   = false;
    document.getElementById('hdr-title').textContent = t('appTitle');
    document.getElementById('hdr-date').textContent  = S.today;

    var el = document.getElementById('list-view');
    if (!S.rows.length) {
      el.innerHTML = '<div class="empty-msg">' + escHtml(t('empty')) + '</div>';
      return;
    }
    el.innerHTML = S.rows.map(function(row, idx) {
      var prog   = row.progress || {};
      var status = prog.status || 'TODO';
      return '<div class="prop-card" data-idx="' + idx + '">' +
        '<div class="order">' + escHtml(String(row.order || idx + 1)) + '</div>' +
        '<div class="info">' +
          '<div class="prop-name">' + escHtml(row.propertyName) + '</div>' +
          '<div class="prop-time">' +
            (row.checkinTime ? escHtml(t('checkinTime') + ' ' + row.checkinTime) : '') +
          '</div>' +
        '</div>' +
        '<span class="badge badge-' + status.toLowerCase() + '">' + escHtml(t(status)) + '</span>' +
        '<span class="chevron">›</span>' +
      '</div>';
    }).join('');

    el.querySelectorAll('.prop-card').forEach(function(card) {
      card.addEventListener('click', function() {
        openDetail(parseInt(card.dataset.idx, 10));
      });
    });
  }

  // ── 詳細レンダリング ─────────────────────────────────────────────────
  function openDetail(idx) {
    S.row = S.rows[idx];
    renderDetail();
    document.getElementById('list-view').hidden   = true;
    document.getElementById('detail-view').hidden = false;
    window.scrollTo(0, 0);
  }

  function renderDetail() {
    var row  = S.row;
    var prog = row.progress || {};
    var status = prog.status || 'TODO';

    var carryTasks = (row.tasks || []).filter(function(tk) { return tk.type === 'CARRY'; });

    var infoRows = '';

    if (row.checkinTime)
      infoRows += detailRow(t('checkinTime'), escHtml(row.checkinTime));

    if (row.password)
      infoRows += detailRow(t('password'),
        '<span style="font-weight:bold;letter-spacing:2px">' + escHtml(row.password) + '</span>');

    var manualHref = row.manualShortUrl || row.manualUrl || '';
    if (manualHref)
      infoRows += detailRow(t('manual'),
        '<a href="' + escHtml(manualHref) + '" target="_blank">' + escHtml(t('manualOpen')) + '</a>');

    if (row.photoUrl)
      infoRows += detailRow(t('photo'),
        '<a href="' + escHtml(row.photoUrl) + '" target="_blank">' + escHtml(t('photoOpen')) + '</a>');

    var carryHtml = '';
    if (carryTasks.length) {
      carryHtml = '<div class="detail-card">' +
        '<h2>' + escHtml(t('carryTasks')) + '</h2>' +
        carryTasks.map(function(tk) {
          return '<div class="task-item">' +
            '<span>📦</span>' +
            '<span>' + escHtml(tk.note || tk.taskId || '') + '</span>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    var progressInfo =
      detailRow(t('status'), '<span class="badge badge-' + status.toLowerCase() + '">' + escHtml(t(status)) + '</span>') +
      detailRow(t('startedAt'),  escHtml(t('startedAtVal')(prog.startedAt))) +
      detailRow(t('finishedAt'), escHtml(t('finishedAtVal')(prog.finishedAt)));

    var btnHtml = '';
    if (status === 'TODO') {
      btnHtml = '<button id="btn-start" class="btn btn-start">' + escHtml(t('btnStart')) + '</button>';
    } else if (status === 'DOING') {
      btnHtml =
        '<div class="btn-row">' +
          '<button id="btn-undo-start" class="btn btn-undo">' + escHtml(t('btnUndoStart')) + '</button>' +
          '<button id="btn-finish" class="btn btn-finish">' + escHtml(t('btnFinish')) + '</button>' +
        '</div>';
    } else if (status === 'DONE') {
      btnHtml = '<button id="btn-undo-finish" class="btn btn-undo">' + escHtml(t('btnUndoFinish')) + '</button>';
    }

    var el = document.getElementById('detail-view');
    el.innerHTML =
      '<button class="back-btn" id="btn-back">' + escHtml(t('back')) + '</button>' +

      '<div class="detail-card">' +
        '<h2>' + escHtml(row.propertyName) + '</h2>' +
        infoRows +
      '</div>' +

      carryHtml +

      '<div class="detail-card">' +
        '<h2>' + escHtml(t('progress')) + '</h2>' +
        progressInfo +
      '</div>' +

      '<div>' + btnHtml + '</div>';

    // イベント
    document.getElementById('btn-back').onclick = function() {
      document.getElementById('detail-view').hidden = true;
      document.getElementById('list-view').hidden   = false;
      window.scrollTo(0, 0);
    };

    var btnStart = document.getElementById('btn-start');
    if (btnStart) btnStart.onclick = function() { doStart(); };

    var btnFinish = document.getElementById('btn-finish');
    if (btnFinish) btnFinish.onclick = function() { doFinish(); };

    var btnUndoStart = document.getElementById('btn-undo-start');
    if (btnUndoStart) btnUndoStart.onclick = function() { doUndoStart(); };

    var btnUndoFinish = document.getElementById('btn-undo-finish');
    if (btnUndoFinish) btnUndoFinish.onclick = function() { doUndoFinish(); };

  }

  function detailRow(label, valHtml) {
    return '<div class="detail-row">' +
      '<span class="detail-label">' + escHtml(label) + '</span>' +
      '<span class="detail-val">' + valHtml + '</span>' +
    '</div>';
  }

  // ── 更新アクション ───────────────────────────────────────────────────
  function doStart() {
    setDetailBusy(true);
    updateProgress({ status: 'DOING', startedAt: nowIso() });
  }

  function doFinish() {
    setDetailBusy(true);
    updateProgress({ status: 'DONE', finishedAt: nowIso() });
  }

  function doUndoStart() {
    setDetailBusy(true);
    updateProgress({ status: 'TODO', startedAt: '' });
  }

  function doUndoFinish() {
    setDetailBusy(true);
    updateProgress({ status: 'DOING', finishedAt: '' });
  }

  function updateProgress(fields) {
    var row  = S.row;
    var prog = row.progress || {};
    callApi({
      action:       'cleanerUpdateProgress',
      propertyName: row.propertyName,
      date:         S.today,
      fields:       fields,
      knownUpdatedAt: prog.updatedAt || ''
    }).then(function(data) {
      if (!data.ok) {
        if (data.error === 'conflict') {
          alert(t('errConflict'));
          return loadScheduleAndRefreshDetail();
        }
        throw new Error(data.error || 'update_failed');
      }
      prog.updatedAt = data.updatedAt || prog.updatedAt;
      if (fields.status    !== undefined) prog.status    = fields.status;
      if (fields.startedAt !== undefined) prog.startedAt = fields.startedAt;
      if (fields.finishedAt!== undefined) prog.finishedAt= fields.finishedAt;
      if (fields.linen     !== undefined) prog.linen     = fields.linen;
      if (fields.trash     !== undefined) prog.trash     = fields.trash;
      if (fields.check     !== undefined) prog.check     = fields.check;
      row.progress = prog;
      renderDetail();
      renderListBadge();
    }).catch(function(err) {
      if (err.isUnauthorized) {
        showError(t('errUnauth'));
      } else {
        alert(t('errNetwork') + (err.message ? '\n' + err.message : ''));
        setDetailBusy(false);
      }
    });
  }

  function setDetailBusy(on) {
    ['btn-start','btn-finish','btn-undo-start','btn-undo-finish'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.disabled = on;
    });
  }

  function renderListBadge() {
    var idx = S.rows.indexOf(S.row);
    if (idx < 0) return;
    var card = document.querySelector('.prop-card[data-idx="' + idx + '"]');
    if (!card) return;
    var prog   = S.row.progress || {};
    var status = prog.status || 'TODO';
    var badge  = card.querySelector('.badge');
    if (badge) {
      badge.className  = 'badge badge-' + status.toLowerCase();
      badge.textContent = t(status);
    }
  }

  function loadScheduleAndRefreshDetail() {
    var prev = S.row;
    callApi({ action: 'getCleanerSchedule', date: S.today })
      .then(function(data) {
        if (!data.ok) return;
        S.rows = (data.rows || []).slice().sort(function(a, b) {
          return (a.order || 0) - (b.order || 0);
        });
        var refreshed = S.rows.find(function(r) { return r.propertyName === prev.propertyName; });
        if (refreshed) { S.row = refreshed; renderDetail(); }
        renderListBadge();
      })
      .catch(function() {});
  }

  // ── UI ヘルパー ──────────────────────────────────────────────────────
  function setLoading(msg) {
    document.getElementById('loading-msg').textContent = msg;
    document.getElementById('loading-view').hidden = false;
    document.getElementById('error-view').hidden   = true;
    document.getElementById('app').hidden          = true;
  }

  function hideLoading() {
    document.getElementById('loading-view').hidden = true;
    document.getElementById('app').hidden          = false;
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('loading-view').hidden = true;
    document.getElementById('error-view').hidden   = false;
    document.getElementById('app').hidden          = true;
  }

  // ── LIFF 初期化 ──────────────────────────────────────────────────────
  setLoading(t('loading'));
  liff.init({ liffId: CFG.CLEANER_LIFF_ID }).then(function() {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    S.idToken = liff.getIDToken();
    S.today   = today();
    loadSchedule();
  }).catch(function(err) {
    showError(t('errLoad') + (err.message ? ' (' + err.message + ')' : ''));
  });
</script>
</body>
</html>
